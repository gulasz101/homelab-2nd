---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CNPG Namespace
  - cnpg/namespace.yaml
  # CNPG Operator
  - cnpg/helm-repository.yaml
  - cnpg/helm-release.yaml
  # Barman Cloud CNPG-I plugin (depends on cert-manager HelmRelease)
  - cnpg/barman-cloud-plugin-manifest.yaml
  # SOPS-encrypted Secret holding the plugin sidecar image reference
  - cnpg/barman-cloud-sidecar-image.sops.yaml
  # Mattermost HelmRepository (needed for HelmRelease in apps)
  - mattermost/helm-repository.yaml
  # Nextcloud HelmRepository (needed for HelmRelease in apps)
  - nextcloud/helm-repository.yaml
  # itsaplan GitRepository (upstream Helm chart)
  - itsaplan/git-repository.yaml
  # CoreDNS custom config for resolving OMV .local hostname from pods
  - coredns/coredns-custom-homelab.yaml
  # NVIDIA Device Plugin for GPU scheduling
  - nvidia-device-plugin/namespace.yaml
  - nvidia-device-plugin/serviceaccount.yaml
  - nvidia-device-plugin/runtimeclass.yaml
  - nvidia-device-plugin/configmap.yaml
  - nvidia-device-plugin/helm-repository.yaml
  - nvidia-device-plugin/helm-release.yaml
  # AMD GPU device plugin (mimir's Vega 7 iGPU -> amd.com/gpu, used by Ollama via Vulkan)
  - amd-gpu-device-plugin/namespace.yaml
  - amd-gpu-device-plugin/helm-repository.yaml
  - amd-gpu-device-plugin/helm-release.yaml
  # LGTM observability stack
  - observability/namespace.yaml
  - observability/helm-repositories.yaml
  - observability/grafana-admin-credentials.sops.yaml
  # Read-only InfluxDB token for the Grafana datasource (token interpolated as
  # ${INFLUX_TOKEN}). Referenced by grafana-helm-release.yaml envFromSecrets since
  # d7a9e94 (2026-10-14) but never listed here, so the Secret was never created
  # and the Grafana pod failed at container start with
  # "secret grafana-influxdb-datasource not found" (GUL-168).
  - observability/grafana-influxdb-datasource.sops.yaml
  - observability/grafana-oidc-client.sops.yaml
  - observability/grafana-tunnel-token.sops.yaml
  - observability/loki-minio-creds.sops.yaml
  - observability/prometheus-stack-helm-release.yaml
  - observability/loki-helm-release.yaml
  - observability/tempo-helm-release.yaml
  - observability/homelab-node-prometheus-rules.yaml
  # OMV storage health (btrfs device errors, read-only volume, host down)
  - observability/omv-storage-prometheus-rules.yaml
  - observability/homelab-node-alertmanager-config.yaml
  - observability/homelab-node-mattermost-webhook-url.sops.yaml
  # GitOps control-plane health: flux-system controller metrics
  - observability/flux-controller-podmonitor.yaml
  # GitOps deployment health: alerts when Flux stops being able to deploy
  - observability/flux-gitops-prometheus-rules.yaml
  - observability/flux-gitops-alertmanager-config.yaml
  # CloudNativePG backup health: PodMonitor + PrometheusRule + AlertmanagerConfig
  - observability/cnpg-instance-podmonitor.yaml
  - observability/cnpg-backup-prometheus-rules.yaml
  - observability/cnpg-backup-alertmanager-config.yaml
  - observability/grafana-helm-release.yaml
  - observability/opentelemetry-collector-helm-release.yaml
  # Loki rule delivery guard (GUL-805): the Loki rule sidecar can stop writing rule
  # files with no restart and no error, leaving merged rules dead on arrival. The guard
  # compares labelled ConfigMaps against the ruler's own API every 5 minutes and posts
  # to Mattermost; the PrometheusRule is the backstop. Nested kustomization: file list
  # and reasoning live in loki-rule-guard/kustomization.yaml, ADR in
  # docs/adr/pending/loki-rule-delivery-guard.md.
  - observability/loki-rule-guard
  - observability/cloudflared-grafana-deployment.yaml
  - observability/grafana-tunnel-ingress-configmap.yaml
  # NVIDIA GPU metrics exporter (for older/consumer GPUs)
  - observability/nvidia-gpu-exporter-helm-repository.yaml
  - observability/nvidia-gpu-exporter-helm-release.yaml
  # Grafana dashboards
  - observability/dashboards/homelab-system-load-dashboard-configmap.yaml
  - observability/dashboards/homelab-gpu-power-dashboard-configmap.yaml
  - observability/dashboards/observability-overview-dashboard-configmap.yaml
  - observability/dashboards/kube-flux-overview-dashboard-configmap.yaml

  # Central identity: Authentik (Phase 0)
  # All auth resources are listed in auth/kustomization.yaml to avoid the
  # trap of maintaining two parallel lists in sync.
  - auth/
