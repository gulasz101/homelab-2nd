---
# Prometheus + Prometheus Operator + node-exporter + kube-state-metrics.
# Grafana is disabled here because we deploy a standalone Grafana instance
# with datasources provisioned for Prometheus, Loki and Tempo.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=69.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # We run our own Grafana so we can provision LGTM datasources cleanly.
    grafana:
      enabled: false

    # Minimal Alertmanager for now; can be expanded later.
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['job']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: 'null'
      alertmanagerSpec:
        alertmanagerConfigSelector:
          matchLabels:
            release: kube-prometheus-stack

    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 10d
        retentionSize: "8GB"
        enableRemoteWriteReceiver: true
        # Attach a host label to all metrics scraped by this Prometheus instance
        # so dashboard legends group cleanly alongside OMV's static-config host label.
        externalLabels:
          host: homelab-2nd
        # Discover ServiceMonitors/PodMonitors in all namespaces.
        # those labelled with the chart release name.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        # Storage for time-series data on fast local-path.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        # Static scrape targets for the non-k8s openmediavault host.
        additionalScrapeConfigs:
          - job_name: omv-node
            static_configs:
              - targets: ["192.168.1.180:9100"]
                labels:
                  instance: openmediavault
                  host: openmediavault
          - job_name: omv-docker
            static_configs:
              - targets: ["192.168.1.180:9323"]
                labels:
                  instance: openmediavault
                  host: openmediavault
          - job_name: omv-cadvisor
            static_configs:
              - targets: ["192.168.1.180:8080"]
                labels:
                  instance: openmediavault
                  host: openmediavault
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 15m
          memory: 64Mi
        limits:
          memory: 256Mi
      # Flux's own controllers do NOT export a revision label -
      # gotk_reconcile_condition carries only kind/name/namespace/status/type,
      # so "is what is deployed the current main?" cannot be asked of them.
      # kube-state-metrics can read the custom resource status and export it as
      # a label, which is the mechanism Flux documents for resource metrics:
      #   https://fluxcd.io/flux/monitoring/custom-metrics/
      # Result: gotk_resource_info{customresource_kind, exported_namespace, name,
      #   ready, suspended, revision, source_name, ...} = 1
      # Kustomization.revision = status.lastAppliedRevision,
      # GitRepository.revision = status.artifact.revision - the two values the
      # revision-lag alert compares (H2-223).
      #
      # The upstream example sets collectors: [] and
      # --custom-resource-state-only=true. That would delete kube_pod_info and
      # every other kube_* series and break the existing dashboards, so the
      # custom resource state is added alongside the default collectors instead.
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
                      source_kind: [spec, sourceRef, kind]
                      source_namespace: [spec, sourceRef, namespace]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
                      chart_ref_name: [spec, chartRef, name]
                      chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Backup
                metricNamePrefix: cnpg
                labelsFromPath:
                  namespace: [metadata, namespace]
                  exported_namespace: [metadata, namespace]
                  name: [metadata, name]
                  cluster: [spec, cluster, name]
                metrics:
                  - name: "backup_info"
                    help: "The current state of a CloudNativePG Backup resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          phase: [status, phase]
                  - name: "backup_reconciliation_terminated_at"
                    help: "Unix timestamp when a CloudNativePG Backup reconciliation terminated (RFC3339)."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, reconciliationTerminatedAt]
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - source.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - gitrepositories
              - helmreleases
            verbs: ["list", "watch"]
          - apiGroups:
              - postgresql.cnpg.io
            resources:
              - backups
            verbs: ["list", "watch"]

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      # Intel RAPL power counters under /sys/class/powercap are only readable by
      # root by default. Enable the chart's permission-fix init container so the
      # non-root node-exporter can read package/DRAM energy counters and expose
      # real CPU watts to Prometheus/Grafana.
      permissionInitContainer:
        fixes:
          rapl: true
      hostRootFsMount:
        enabled: true

    # k3s runs controller-manager, scheduler and kube-proxy inside the
    # k3s binary, so kube-prometheus-stack's scrape targets for them do not
    # exist. Disable both the targets and their alert rules (k3s embeds them).
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false

    # Keep CRDs; Flux/Helm will manage them.
    crds:
      enabled: true
