---
# Standalone Grafana with datasources provisioned for Prometheus, Loki and Tempo.
# Admin password is injected from a SOPS-encrypted secret.
# Uses the community-maintained grafana-community/helm-charts Grafana chart (OSS).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "12.7.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Generic OAuth via Authentik (OIDC). All OIDC client secrets are
    # injected through a SOPS-encrypted secret mounted as envFrom.
    envFromSecrets:
      - name: grafana-oidc-client
      # 2026-10-14: read-only InfluxDB datasource token (org na, bucket default)
      # used by the InfluxDB datasource provisioning below (secureJsonData token
      # interpolation). See grafana-influxdb-datasource.sops.yaml.
      - name: grafana-influxdb-datasource

    # Grafana expands ${INFLUX_TOKEN} in the provisioning file at startup, so the
    # container needs an env var with exactly that name. envFromSecrets alone
    # exposes the secret under its own key (token), which Grafana does not see.
    envValueFrom:
      INFLUX_TOKEN:
        secretKeyRef:
          name: grafana-influxdb-datasource
          key: token

    env:
      GF_SERVER_ROOT_URL: "https://grafana.voitech.dev"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
      GF_AUTH_GENERIC_OAUTH_ICON: signin
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      # Role sync is ON: every login re-derives the Grafana role from Authentik.
      # The mapping (GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH) lives in the SOPS
      # secret grafana-oidc-client: `role == 'admin' && 'Admin' || 'Viewer'`.
      # It must name the CLAIM `role`, which the Authentik scope mapping
      # `homelab-role` emits ({"role": "admin"} for the homelab-admins group),
      # NOT the scope name. Until 2026-10-19 it read `"homelab-role" == 'admin'`,
      # never matched, and silently demoted every login to Viewer (no Explore).
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      # Disable local/basic logins; only Authentik OIDC remains.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    initChownData:
      enabled: false

    # Admin credentials come from the SOPS-encrypted Secret
    # grafana-admin-credentials (admin-user / admin-password), decrypted by Flux.
    # SSO via Authentik is the only interactive login path (basic auth disabled);
    # this local admin is retained strictly for API/automation access.
    # NOTE: existingSecret suppresses the chart's auto-generated `grafana`
    # secret, which is what silently drifted from the repo value before.
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password

    # Grafana keeps its SQLite DB on an RWO local-path PVC, so a surge pod
    # cannot take the volume while the old pod holds it. maxSurge: 0 makes the
    # rollout stop the old pod before starting the new one — the same safety
    # Recreate gave — while keeping type: RollingUpdate, which is what the live
    # Deployment already has. Recreate is unusable here: Helm 4 upgrades with
    # server-side apply, and SSA cannot remove the API-server-defaulted
    # rollingUpdate fields, so `type: Recreate` + `rollingUpdate` is rejected.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1

    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    # Provision datasources via a sidecar that watches ConfigMaps labelled
    # `grafana_datasource: "true"`.
    sidecar:
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "true"
        reloadURL: "http://grafana.observability.svc.cluster.local:3000/api/admin/provisioning/datasources/reload"
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana.folder
        reloadURL: "http://grafana.observability.svc.cluster.local:3000/api/admin/provisioning/dashboards/reload"
        provider:
          foldersFromFilesStructure: true
      # Alert sidecar is disabled; we use Alertmanager for node alerts.
      alerts:
        enabled: false

    # Datasource definitions provisioned directly in values.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus-stack-kube-prom-prometheus.observability.svc.cluster.local:9090
            access: proxy
            isDefault: true
            editable: false
          - name: Loki
            type: loki
            url: http://loki-gateway.observability.svc.cluster.local:80
            access: proxy
            editable: false
          - name: Tempo
            type: tempo
            url: http://tempo.observability.svc.cluster.local:3200
            access: proxy
            editable: false
          # 2026-10-14: the migrated home-sensor pipeline (Node-RED influxdb-out
          # nodes, org 'na' bucket 'default', measurements LYWSD03MMC /
          # MOVEMENT / bathroom_heater / power_usage) had NO Grafana datasource
          # after the k3s migration - only Prometheus/Loki/Tempo were carried
          # over, so every home-sensor dashboard went blind even though writes
          # kept landing. Port is 80 (chart service), not 8086 (pod). Token is a
          # READ-ONLY auth scoped to the default bucket
          # (grafana-influxdb-datasource.sops.yaml), because Grafana only queries.
          - name: InfluxDB
            type: influxdb
            url: http://influxdb-influxdb2.zigbee.svc.cluster.local:80
            access: proxy
            editable: false
            jsonData:
              version: Flux
              organization: na
              defaultBucket: default
              tlsSkipVerify: true
            secureJsonData:
              token: ${INFLUX_TOKEN}

    # Service stays internal; Cloudflare Tunnel ingress is added separately.
    service:
      type: ClusterIP
      port: 3000

    # Expose Grafana metrics to Prometheus.
    serviceMonitor:
      enabled: true
      # The chart already injects 'release: <Helm release name>'; do not add a
      # second 'release' key here or Helm post-render fails with a duplicate key.

    # Disable bundled test pods.
    testFramework:
      enabled: false
