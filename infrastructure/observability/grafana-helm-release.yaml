---
# Standalone Grafana with datasources provisioned for Prometheus, Loki and Tempo.
# Admin password is injected from a SOPS-encrypted secret.
# Uses the community-maintained grafana-community/helm-charts Grafana chart (OSS).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "12.7.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Keep a single Grafana replica. Explicitly set because a one-off manual
    # scale-to-0 during the alert debugging left the Deployment at 0 replicas;
    # Helm's three-way merge preserved that drift until we pin the value here.
    replicas: 1

    # Generic OAuth via Authentik (OIDC). OIDC client secrets are injected
    # through a SOPS-encrypted secret mounted as envFrom. The Mattermost
    # webhook URL for alerts is injected via envValueFrom so the variable name
    # matches the one referenced in the provisioned alerting ConfigMap.
    envFromSecrets:
      - name: grafana-oidc-client

    envValueFrom:
      MATTERMOST_ALERTS_WEBHOOK_URL:
        secretKeyRef:
          name: grafana-alerts-mattermost-webhook-url
          key: url

    env:
      GF_SERVER_ROOT_URL: "https://grafana.voitech.dev"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
      GF_AUTH_GENERIC_OAUTH_ICON: "signin"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      # Disable local/basic logins; only Authentik OIDC remains.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    initChownData:
      enabled: false

    # Local admin fallback removed; SSO via Authentik is the only login path.
    admin:
      userKey: admin-user
      passwordKey: admin-password
      password: "not-used"

    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    # Mount the homelab-node alerting provisioning file directly into Grafana
    # so it is loaded at startup without relying on the k8s-sidecar reload
    # endpoint (basic auth is disabled, so the sidecar cannot trigger a live
    # reload). The ConfigMap content is plain YAML and is not interpreted by
    # Helm's tpl engine.
    extraVolumes:
      - name: homelab-node-alerts
        configMap:
          name: homelab-node-alerts
          defaultMode: 0444

    extraVolumeMounts:
      - name: homelab-node-alerts
        mountPath: /etc/grafana/provisioning/alerting
        readOnly: true

    # Disable the alert sidecar; we use the direct ConfigMap mount above.
    sidecar:
      alerts:
        enabled: false
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "true"
        reloadURL: "http://grafana.observability.svc.cluster.local:3000/api/admin/provisioning/datasources/reload"
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folderAnnotation: grafana.folder
        reloadURL: "http://grafana.observability.svc.cluster.local:3000/api/admin/provisioning/dashboards/reload"
        provider:
          foldersFromFilesStructure: true

    # Datasource definitions provisioned directly in values.
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus-stack-kube-prom-prometheus.observability.svc.cluster.local:9090
            access: proxy
            isDefault: true
            editable: false
          - name: Loki
            type: loki
            url: http://loki-gateway.observability.svc.cluster.local:80
            access: proxy
            editable: false
          - name: Tempo
            type: tempo
            url: http://tempo.observability.svc.cluster.local:3200
            access: proxy
            editable: false

    # Service stays internal; Cloudflare Tunnel ingress is added separately.
    service:
      type: ClusterIP
      port: 3000

    # Expose Grafana metrics to Prometheus.
    serviceMonitor:
      enabled: true
      # The chart already injects 'release: <Helm release name>'; do not add a
      # second 'release' key here or Helm post-render fails with a duplicate key.

    # Disable bundled test pods.
    testFramework:
      enabled: false
