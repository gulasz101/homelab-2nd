---
# OpenTelemetry Collector DaemonSet.
# - Collects Kubernetes container logs via the filelog receiver and sends them
#   to Loki using the Loki exporter.
# - Receives OTLP metrics/traces/logs from applications and forwards them to
#   Prometheus (native OTLP receiver), Tempo (OTLP) and Loki (OTLP/loki).
# - Every pipeline runs memory_limiter -> k8sattributes -> batch, so a busy node
#   sheds telemetry instead of being OOM-killed by it, and every exporter has a
#   sending queue plus retries, so a backend restart loses nothing.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.178.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: daemonset

    # Collect logs on the dedicated zigbee-node too (taint `dedicated=zigbee:
    # NoSchedule`, H2-306): guardrail 9 needs zigbee2mqtt's logs in Loki.
    tolerations:
      - key: dedicated
        operator: Equal
        value: zigbee
        effect: NoSchedule

    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
      tag: ""

    command:
      name: otelcol-contrib

    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
      kubernetesAttributes:
        enabled: true
      kubeletMetrics:
        enabled: false
      hostMetrics:
        enabled: false
      clusterMetrics:
        enabled: false
      kubernetesEvents:
        enabled: false

    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:4317
            http:
              endpoint: ${env:MY_POD_IP}:4318

      processors:
        # First in every pipeline: refuse/shed data before it is queued when the
        # process is near its memory limit, rather than growing until the kubelet
        # OOM-kills the collector and takes the node's log pipeline with it.
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 20

      exporters:
        otlphttp/loki:
          endpoint: http://loki-gateway.observability.svc.cluster.local:80/otlp
          tls:
            insecure: true
          sending_queue:
            enabled: true
          retry_on_failure:
            enabled: true

        otlp/tempo:
          endpoint: tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true
          sending_queue:
            enabled: true
          retry_on_failure:
            enabled: true

        # Prometheus 2.55+ native OTLP receiver (Service
        # prometheus-stack-kube-prom-prometheus in this namespace). The otlphttp
        # exporter appends /v1/metrics to the endpoint, so the full path is
        # /api/v1/otlp/v1/metrics.
        otlphttp/prometheus:
          endpoint: http://prometheus-stack-kube-prom-prometheus.observability.svc.cluster.local:9090/api/v1/otlp
          tls:
            insecure: true
          sending_queue:
            enabled: true
          retry_on_failure:
            enabled: true

      service:
        pipelines:
          logs:
            receivers: [otlp, filelog]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlphttp/loki]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlp/tempo]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlphttp/prometheus]

    # Loki 3.x supports native OTLP log ingestion at /otlp on port 3100.
    # The schemaConfig in the Loki HelmRelease already uses v13, which
    # enables structured metadata required for OTLP logs.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    service:
      # Apps inside the cluster send OTLP to this Service; every node runs a
      # collector pod, so keep the traffic node-local instead of letting a
      # connection cross nodes to a collector that shares no logs with it.
      enabled: true
      type: ClusterIP
      internalTrafficPolicy: Local

    # Self-metrics: the chart serves the collector's internal telemetry
    # (otelcol_*) on ${env:MY_POD_IP}:8888, and the PodMonitor below scrapes it
    # with `release: prometheus-stack`, the label this cluster's Prometheus
    # selects PodMonitors on. Without the label the target silently never loads.
    ports:
      metrics:
        enabled: true

    podMonitor:
      enabled: true
      extraLabels:
        release: prometheus-stack

    # The logsCollection preset already mounts /var/log/pods and
    # /var/lib/docker/containers, so we do not add them again as extra volumes.
    extraVolumes: []
    extraVolumeMounts: []

    # The logsCollection preset mounts /var/log/pods and /var/lib/docker/containers.
    # We keep runAsUser: 0 because log files on the node are owned by root and the
    # filelog receiver must traverse host paths. Full privileged mode is replaced
    # with fine-grained capabilities: read-only root fs, no privilege escalation,
    # drop all caps, add DAC_READ_SEARCH (enables reading files across UID boundaries).
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: false
      capabilities:
        drop:
          - ALL
        add:
          - DAC_READ_SEARCH
