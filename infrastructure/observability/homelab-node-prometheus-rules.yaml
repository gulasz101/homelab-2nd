---
# PrometheusRule: thermal and load alerts for every homelab node (mimir, loki,
# arr-box, zigbee-node, OMV). Per-instance since the 2026-11-12 node move
# (pending ADR k3s-control-plane-moves-to-mimir); these used to be hard-wired to the Clevo (instance 192.168.1.179:9100,
# Intel coretemp) and went silent the day the Clevo left.
# Routes to the homelab-node AlertmanagerConfig in the observability namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-node-alerts
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: homelab-node-thermal
      interval: 60s
      rules:
        - alert: HomelabNodeHighTemperature
          # CPU package sensor: Intel coretemp (loki, arr-box) or AMD k10temp
          # (mimir, chip pci0000:00_0000:00:18_3).
          expr: |
            max by (instance) (
              node_hwmon_temp_celsius{chip=~"platform_coretemp_0|pci0000:00_0000:00:18_3"}
            ) > 85
          for: 2m
          labels:
            severity: critical
            alertgroup: homelab-node
            namespace: observability
          annotations:
            summary: "CPU temperature is high on {{ $labels.instance }}"
            description: "CPU package temperature on {{ $labels.instance }} is {{ $value }}°C for more than 2 minutes."

        - alert: HomelabNodeThermalThrottling
          expr: max by (instance) (node_thermal_zone_temp) > 90
          for: 1m
          labels:
            severity: critical
            alertgroup: homelab-node
            namespace: observability
          annotations:
            summary: "Thermal zone near critical on {{ $labels.instance }}"
            description: "A thermal zone on {{ $labels.instance }} is {{ $value }}°C."

    - name: homelab-node-load
      interval: 60s
      rules:
        # load1 per CPU. The old expression used `count without (mode)`, which keeps
        # the cpu label, so it never matched node_load1 and could not fire.
        - alert: HomelabNodeHighLoad
          expr: |
            max by (instance) (node_load1)
            /
            count by (instance) (node_cpu_seconds_total{mode="idle"})
            > 0.85
          for: 5m
          labels:
            severity: warning
            alertgroup: homelab-node
            namespace: observability
          annotations:
            summary: "Load average is high on {{ $labels.instance }}"
            description: "Load average on {{ $labels.instance }} is {{ $value }} per CPU."

        - alert: HomelabNodeSustainedHighLoad
          expr: |
            max by (instance) (node_load1)
            /
            count by (instance) (node_cpu_seconds_total{mode="idle"})
            > 0.95
          for: 10m
          labels:
            severity: critical
            alertgroup: homelab-node
            namespace: observability
          annotations:
            summary: "Sustained heavy load on {{ $labels.instance }}"
            description: "Sustained load on {{ $labels.instance }} is {{ $value }} per CPU — risk of thermal shutdown."
