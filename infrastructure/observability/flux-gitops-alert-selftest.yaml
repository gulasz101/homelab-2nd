---
# THROWAWAY - H2-223 false-positive test (AC4). Delete after the alert has been
# observed firing in Alertmanager, delivered to Mattermost, and then resolving.
#
# A Kustomization that cannot possibly build, so it is guaranteed to reach
# Ready=False. It points at `path: ./does-not-exist` inside the same
# GitRepository source, and with `prune: false` it applies nothing and deletes
# nothing even if it ever did build.
#
# `apps` and `infrastructure` are never used for this test: a false-positive
# test that damages the thing it is testing is not a test.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-gitops-alert-selftest
  namespace: flux-system
spec:
  interval: 1m
  path: ./does-not-exist
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
