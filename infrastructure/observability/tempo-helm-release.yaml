---
# Grafana Tempo in single-binary mode with local filesystem storage.
# Receives OTLP traces on gRPC/HTTP and stores them on a local-path PVC.
# Uses the community-maintained grafana-community/helm-charts Tempo chart (OSS).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: "2.2.3"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    tempo:
      # OTLP receivers enabled by default in the chart; keep them.
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      # Local filesystem storage on a PVC.
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
          wal:
            path: /var/tempo/wal
      retention: 168h  # 7 days
      # Derive service-graph and span metrics from the traces Tempo ingests and
      # remote-write them to Prometheus, which accepts them because
      # prometheusSpec.enableRemoteWriteReceiver is on (GUL-1596 AC-5). Grafana
      # reads those series for the service map and the trace->metrics links.
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://prometheus-stack-kube-prom-prometheus.observability.svc.cluster.local:9090/api/v1/write
        # Both processors on. The series they emit are
        # traces_service_graph_* and traces_spanmetrics_*.
        processor:
          service_graphs: {}
          span_metrics: {}
        storage:
          # The traces PVC is mounted at /var/tempo, so keep the generator's
          # WAL there instead of the chart's /tmp default: a restart then does
          # not throw away unflushed metrics.
          path: /var/tempo/metrics
        traces_storage:
          path: /var/tempo/traces-wal
      # Tempo's standard overrides also have to activate the processors per
      # tenant - the processor config above alone generates nothing.
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
      # Tempo single-binary with WAL replay and all default receivers needs more
      # than 512Mi on startup. Keep request low but raise the limit.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    persistence:
      enabled: true
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 10Gi

    # Service stays internal; Grafana accesses Tempo via the cluster service.
    service:
      type: ClusterIP

    # Expose Tempo metrics to Prometheus.
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
