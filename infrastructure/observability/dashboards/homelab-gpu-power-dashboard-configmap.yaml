    "homelab-gpu-power.json": "{\"annotations\":{\"list\":[]},\"description\":\"What the homelab host is doing to its own silicon: package temperature, RAPL power draw, thermal zones and fans from node-exporter. Generated from scripts/dashboards/manifest.json.\",\"editable\":true,\"fiscalYearStartMonth\":0,\"graphTooltip\":0,\"id\":null,\"links\":[{\"asDropdown\":true,\"icon\":\"external link\",\"includeVars\":false,\"keepTime\":true,\"tags\":[\"homelab\"],\"targetBlank\":false,\"title\":\"Homelab dashboards\",\"tooltip\":\"Every homelab dashboard\",\"type\":\"dashboards\",\"url\":\"\"}],\"liveNow\":true,\"panels\":[{\"options\":{\"content\":\"Thermals and power for the physical host. Temperatures and fan speeds come from node-exporter hwmon and thermal zones, draw from the RAPL energy counters. Rising package power at flat temperature is work; flat power at rising temperature is airflow.\\n\\nRe-rendered from `scripts/dashboards/manifest.json` \\u2014 edit the manifest or `scripts/render_namespace_dashboard.py`, never this JSON.\",\"mode\":\"markdown\"},\"title\":\"Overview\",\"type\":\"text\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"id\":1,\"gridPos\":{\"h\":3,\"w\":24,\"x\":0,\"y\":0}},{\"collapsed\":false,\"panels\":[],\"title\":\"Golden signals\",\"type\":\"row\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"id\":2,\"gridPos\":{\"h\":1,\"w\":24,\"x\":0,\"y\":3}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"The coretemp package sensor from node_hwmon_temp_celsius. This is the number that decides whether the host throttles.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"celsius\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":80},{\"color\":\"red\",\"value\":90}]}},\"overrides\":[]},\"options\":{\"colorMode\":\"value\",\"graphMode\":\"area\",\"justifyMode\":\"auto\",\"orientation\":\"auto\",\"reduceOptions\":{\"calcs\":[\"lastNotNull\"],\"fields\":\"\",\"values\":false},\"textMode\":\"auto\"},\"targets\":[{\"editorMode\":\"code\",\"expr\":\"node_hwmon_temp_celsius{job=\\\"node-exporter\\\",chip=~\\\"platform_coretemp.*\\\",sensor=~\\\"temp1\\\"}\",\"refId\":\"A\",\"legendFormat\":\"{{chip}}\",\"instant\":true}],\"title\":\"CPU package temperature\",\"type\":\"stat\",\"id\":3,\"gridPos\":{\"h\":4,\"w\":8,\"x\":0,\"y\":4}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"RAPL package energy converted to watts. The same series the existing power board has always reported, now generated.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"watt\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":80},{\"color\":\"red\",\"value\":90}]}},\"overrides\":[]},\"options\":{\"colorMode\":\"value\",\"graphMode\":\"area\",\"justifyMode\":\"auto\",\"orientation\":\"auto\",\"reduceOptions\":{\"calcs\":[\"lastNotNull\"],\"fields\":\"\",\"values\":false},\"textMode\":\"auto\"},\"targets\":[{\"editorMode\":\"code\",\"expr\":\"rate(node_rapl_package_joules_total{job=\\\"node-exporter\\\"}[5m])\",\"refId\":\"A\",\"legendFormat\":\"{{instance}}\",\"instant\":true}],\"title\":\"CPU package power\",\"type\":\"stat\",\"id\":4,\"gridPos\":{\"h\":4,\"w\":8,\"x\":8,\"y\":4}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"Maximum of every hwmon temperature on the host, so a single hot sensor cannot hide behind an average.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"celsius\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":80},{\"color\":\"red\",\"value\":90}]}},\"overrides\":[]},\"options\":{\"colorMode\":\"value\",\"graphMode\":\"area\",\"justifyMode\":\"au