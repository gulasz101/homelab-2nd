  "data": {
    "homelab-system-load.json": "{\"annotations\":{\"list\":[]},\"description\":\"Host and pod pressure in one place: load, CPU, memory, disk I/O, network and the busiest containers by CPU and memory. Generated from scripts/dashboards/manifest.json.\",\"editable\":true,\"fiscalYearStartMonth\":0,\"graphTooltip\":0,\"id\":null,\"links\":[{\"asDropdown\":true,\"icon\":\"external link\",\"includeVars\":false,\"keepTime\":true,\"tags\":[\"homelab\"],\"targetBlank\":false,\"title\":\"Homelab dashboards\",\"tooltip\":\"Every homelab dashboard\",\"type\":\"dashboards\",\"url\":\"\"}],\"liveNow\":true,\"panels\":[{\"options\":{\"content\":\"Which resource is short. Host load, CPU, memory and disk first, then the containers responsible for it. Every panel is derived, not hand-written: re-rendering reproduces this file byte for byte.\\n\\nRe-rendered from `scripts/dashboards/manifest.json` \\u2014 edit the manifest or `scripts/render_namespace_dashboard.py`, never this JSON.\",\"mode\":\"markdown\"},\"title\":\"Overview\",\"type\":\"text\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"id\":1,\"gridPos\":{\"h\":3,\"w\":24,\"x\":0,\"y\":0}},{\"collapsed\":false,\"panels\":[],\"title\":\"Golden signals\",\"type\":\"row\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"id\":2,\"gridPos\":{\"h\":1,\"w\":24,\"x\":0,\"y\":3}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"node_load1 and node_load5 on the same axis. Load above the core count is a queue, and on this host the queue is usually disk rather than CPU.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"short\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":80},{\"color\":\"red\",\"value\":90}]}},\"overrides\":[]},\"options\":{\"colorMode\":\"value\",\"graphMode\":\"area\",\"justifyMode\":\"auto\",\"orientation\":\"auto\",\"reduceOptions\":{\"calcs\":[\"lastNotNull\"],\"fields\":\"\",\"values\":false},\"textMode\":\"auto\"},\"targets\":[{\"editorMode\":\"code\",\"expr\":\"node_load1{job=\\\"node-exporter\\\"}\",\"refId\":\"A\",\"legendFormat\":\"load1 {{instance}}\",\"instant\":true},{\"editorMode\":\"code\",\"expr\":\"node_load5{job=\\\"node-exporter\\\"}\",\"refId\":\"B\",\"legendFormat\":\"load5 {{instance}}\",\"instant\":true}],\"title\":\"Load average per host\",\"type\":\"stat\",\"id\":3,\"gridPos\":{\"h\":4,\"w\":8,\"x\":0,\"y\":4}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"Idle CPU inverted, per instance, from node-exporter. The same series node CPU alerts fire on.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"percent\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":80},{\"color\":\"red\",\"value\":90}]}},\"overrides\":[]},\"options\":{\"colorMode\":\"value\",\"graphMode\":\"area\",\"justifyMode\":\"auto\",\"orientation\":\"auto\",\"reduceOptions\":{\"calcs\":[\"lastNotNull\"],\"fields\":\"\",\"values\":false},\"textMode\":\"auto\"},\"targets\":[{\"editorMode\":\"code\",\"expr\":\"100 - (avg by (instance) (rate(node_cpu_seconds_total{job=\\\"node-exporter\\\",mode=\\\"idle\\\"}[5m])) * 100)\",\"refId\":\"A\",\"legendFormat\":\"{{instance}}\",\"instant\":true}],\"title\":\"CPU utilisation per host\",\"type\":\"stat\",\"id\":4,\"gridPos\":{\"h\":4,\"w\":8,\"x\":8,\"y\":4}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"Memory in use per instance from MemAvailable against MemTotal. Swap pressure starts well before this reaches 100.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"percent\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":80},{\"color\":\"red\",\"value\":90}]}},\"overrides\":[]},\"options\":{\"colorMode\":\"value\",\"graphMode\":\"area\",\"justifyMode\":\"auto\",\"orientation\":\"auto\",\"reduceOptions\":{\"calcs\":[\"lastNotNull\"],\"fields\":\"\",\"values\":false},\"textMode\":\"auto\"},\"targets\":[{\"editorMode\":\"code\",\"expr\":\"100 * (1 - (node_memory_MemAvailable_bytes{job=\\\"node-exporter\\\"} / node_memory_MemTotal_bytes{job=\\\"node-exporter\\\"}))\",\"refId\":\"A\",\"legendFormat\":\"{{instance}}\",\"instant\":true}],\"title\":\"Memory used per host\",\"type\":\"stat\",\"id\":5,\"gridPos\":{\"h\":4,\"w\":8,\"x\":16,\"y\":4}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"Used space per mountpoint, tmpfs and overlay excluded. The homelab has several NFS exports, so the mountpoint label is the whole story.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"percent\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":80},{\"color\":\"red\",\"value\":90}]}},\"overrides\":[]},\"options\":{\"colorMode\":\"value\",\"graphMode\":\"area\",\"justifyMode\":\"auto\",\"orientation\":\"auto\",\"reduceOptions\":{\"calcs\":[\"lastNotNull\"],\"fields\":\"\",\"values\":false},\"textMode\":\"auto\"},\"targets\":[{\"editorMode\":\"code\",\"expr\":\"100 - ((node_filesystem_avail_bytes{job=\\\"node-exporter\\\",fstype!=\\\"tmpfs\\\",fstype!=\\\"overlay\\\"} * 100) / node_filesystem_size_bytes{job=\\\"node-exporter\\\",fstype!=\\\"tmpfs\\\",fstype!=\\\"overlay\\\"})\",\"refId\":\"A\",\"legendFormat\":\"{{mountpoint}}\",\"instant\":true}],\"title\":\"Filesystem used per mountpoint\",\"type\":\"stat\",\"id\":6,\"gridPos\":{\"h\":4,\"w\":8,\"x\":0,\"y\":8}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"Percentage of wall time each device spent serving I/O. This is usually the real explanation for load on this host.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"p