    "kube-flux-overview.json": "{\"annotations\":{\"list\":[]},\"description\":\"GitOps health for the cluster: flux controller reconciliations, stuck HelmReleases and Kustomizations, and the node pressure underneath them. Generated from scripts/dashboards/manifest.json.\",\"editable\":true,\"fiscalYearStartMonth\":0,\"graphTooltip\":0,\"id\":null,\"links\":[{\"asDropdown\":true,\"icon\":\"external link\",\"includeVars\":false,\"keepTime\":true,\"tags\":[\"homelab\"],\"targetBlank\":false,\"title\":\"Homelab dashboards\",\"tooltip\":\"Every homelab dashboard\",\"type\":\"dashboards\",\"url\":\"\"}],\"liveNow\":true,\"panels\":[{\"options\":{\"content\":\"Does the cluster still converge? Reconciliation rate and duration are on top, stuck objects next, then node CPU, memory and disk. A dashboard that is green on application pods and red here means main is merged and not applied.\\n\\nRe-rendered from `scripts/dashboards/manifest.json` \\u2014 edit the manifest or `scripts/render_namespace_dashboard.py`, never this JSON.\",\"mode\":\"markdown\"},\"title\":\"Overview\",\"type\":\"text\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"id\":1,\"gridPos\":{\"h\":3,\"w\":24,\"x\":0,\"y\":0}},{\"collapsed\":false,\"panels\":[],\"title\":\"Golden signals\",\"type\":\"row\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"id\":2,\"gridPos\":{\"h\":1,\"w\":24,\"x\":0,\"y\":3}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"Controller restarts in flux-system over five minutes. A controller that restarts silently stops reconciling, which looks identical to a quiet cluster.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"short\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":80},{\"color\":\"red\",\"value\":90}]}},\"overrides\":[]},\"options\":{\"colorMode\":\"value\",\"graphMode\":\"a