    "observability-slos.json": "{\"annotations\":{\"list\":[]},\"description\":\"SLOs and error budgets for Open WebUI, Hindsight API and Grafana, generated from scripts/dashboards/manifest.json.\",\"editable\":true,\"fiscalYearStartMonth\":0,\"graphTooltip\":0,\"id\":null,\"links\":[{\"asDropdown\":true,\"icon\":\"external link\",\"includeVars\":false,\"keepTime\":true,\"tags\":[\"homelab\"],\"targetBlank\":false,\"title\":\"Homelab dashboards\",\"tooltip\":\"Every homelab dashboard\",\"type\":\"dashboards\",\"url\":\"\"}],\"liveNow\":true,\"panels\":[{\"options\":{\"content\":\"The **SLOs** of the three services that answer a request: Open WebUI 99.5 %, Hindsight API 99.5 %, Grafana 95 %. Two SLIs each \\u2014 availability and latency \\u2014 recorded as an error ratio for the seven alerting windows, with one error budget per service (1 - target).\\n\\nRows follow the homelab order: golden signals (the 30-day SLI, the error budget left, the burn rate), resources (the observability namespace itself), then logs. The alarms that read these series are in `infrastructure/observability/slo/slo-prometheus-rules.yaml`; the design is `docs/adr/adr-135-observability-design.md`.\\n\\nRe-rendered from `scripts/dashboards/manifest.json` \\u2014 edit the manifest or `scripts/render_namespace_dashboard.py`, never this JSON.\",\"mode\":\"markdown\"},\"title\":\"Overview\",\"type\":\"text\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"${datasource}\"},\"id\":1,\"gridPos\":{\"h\":3,\"w\":24,\"x\":0,\"y\":0}},{\"collapsed\":false,\"panels\":[],\"title\":\"Golden signals\",\"type\":\"row\",\"id\":2,\"gridPos\":{\"h\":1,\"w\":24,\"x\":0,\"y\":3}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"${datasource}\"},\"description\":\"Share of Open WebUI requests in the last 30 days that met the availability SLO (target 99.5 %). Pooled over the whole window: the failed requests and the total are summed and divided once, so a busy day counts for more than a quiet one. It is the invers