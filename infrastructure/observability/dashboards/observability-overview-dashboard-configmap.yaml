    "observability-overview.json": "{\"annotations\":{\"list\":[]},\"description\":\"The telemetry pipeline itself: what the OpenTelemetry Collector accepts, exports and fails to send, how full its queue is, and whether the components behind it are up. Generated from scripts/dashboards/manifest.json.\",\"editable\":true,\"fiscalYearStartMonth\":0,\"graphTooltip\":0,\"id\":null,\"links\":[{\"asDropdown\":true,\"icon\":\"external link\",\"includeVars\":false,\"keepTime\":true,\"tags\":[\"homelab\"],\"targetBlank\":false,\"title\":\"Homelab dashboards\",\"tooltip\":\"Every homelab dashboard\",\"type\":\"dashboards\",\"url\":\"\"}],\"liveNow\":true,\"panels\":[{\"options\":{\"content\":\"Where telemetry is lost. The receiver counters are what applications hand the collector; the exporter counters are what actually reaches Loki, Tempo and Prometheus. A board that is green on pod readiness and red here is the failure class this dashboard exists for: every pod is ready and the data still stops.\\n\\nRe-rendered from `scripts/dashboards/manifest.json` \\u2014 edit the manifest or `scripts/render_namespace_dashboard.py`, never this JSON.\",\"mode\":\"markdown\"},\"title\":\"Overview\",\"type\":\"text\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"id\":1,\"gridPos\":{\"h\":3,\"w\":24,\"x\":0,\"y\":0}},{\"collapsed\":false,\"panels\":[],\"title\":\"Golden signals\",\"type\":\"row\",\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"id\":2,\"gridPos\":{\"h\":1,\"w\":24,\"x\":0,\"y\":3}},{\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"},\"description\":\"Collector receiver throughput by signal, from otelcol_receiver_accepted_spans, _metric_points and _log_records. These counters carry no _total suffix on the :8888 scrape endpoint.\",\"fieldConfig\":{\"defaults\":{\"unit\":\"reqps\",\"custom\":{},\"min\":null,\"max\":null,\"thresholds\":{\"mode\":\"absolute\",\"steps\":[{\"color\":\"green\",\"value\":null},{\