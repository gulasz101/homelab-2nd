---
# nvidia-gpu-exporter HelmRelease
# Provides GPU metrics to Prometheus by wrapping nvidia-smi.
# Runs as a DaemonSet on GPU nodes only, via a nodeSelector on the NFD label.
# This is a simpler alternative to DCGM for old consumer GPUs (Maxwell/Pascal).
#
# Security note: the chart defaults to privileged: true because it needs access
# to /dev/nvidia* devices and the host nvidia-smi / libnvidia-ml.so stack. On
# this single-node homelab with a Maxwell GTX 970M there is no DCGM support, so
# we accept the upstream hostPath volumes and privileged container as required
# for accurate GPU metrics. The exception is documented here and in the
# security-scan exclusions rather than being hidden from the scanner.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-gpu-exporter
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: nvidia-gpu-exporter
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: utkuozdemir
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    runtimeClassName: nvidia

    nodeSelector:
      feature.node.kubernetes.io/pci-10de.present: "true"

    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

    # The upstream chart defaults to privileged: true. We keep it because the
    # exporter must talk to the NVIDIA driver devices and libraries on the host.
    # This is an accepted risk for a single-node consumer-GPU homelab; see the
    # tracking note for the security-scan decision.
    securityContext:
      privileged: true
      readOnlyRootFilesystem: true
      runAsNonRoot: false
      capabilities:
        drop:
          - ALL

    # Host volumes are deliberately NOT configured here: chart 0.3.0 already
    # ships the correct defaults (nvidiactl, nvidia0, nvidia-smi,
    # libnvidia-ml.so, libnvidia-ml.so.1). Older revisions of this file used
    # `extraVolumes` / `extraVolumeMounts`, which this chart does not read at
    # all, so those keys did nothing — removed so the config stops misleading
    # the next reader.

    serviceMonitor:
      enabled: true
      # Chart 0.3.0 reads `additionalLabels`, not `labels`; this label is what
      # ties the ServiceMonitor to the kube-prometheus-stack instance.
      additionalLabels:
        release: prometheus-stack

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
