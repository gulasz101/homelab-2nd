---
# Daily Zigbee2MQTT state backup -> OMV MinIO (s3://zigbee2mqtt-backups/zigbee2mqtt/).
#
# WHY THIS IS THE MOST IMPORTANT OBJECT IN THE NAMESPACE:
# /app/data holds the whole Zigbee network - the network key, the coordinator
# backup and the registry of all 17 paired devices. The chart's storage comment
# promised durability via a backup and, until this CronJob existed, that promise
# was not kept: the live copy was a single un-backed-up copy on the radio head's
# microSD card. Losing it means re-pairing every device by hand.
#
# The volume is the StatefulSet's own PVC, mounted read-only here. Both pods run
# on zigbee-node, which is what makes that legal: local-path volumes are
# ReadWriteOnce, and RWO permits multiple pods on the SAME node, just not two
# nodes at once.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zigbee2mqtt-backup
  namespace: zigbee
spec:
  schedule: "45 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          # local-path PVC is bound to zigbee-node; the backup must run where the
          # volume lives.
          nodeSelector:
            kubernetes.io/hostname: zigbee-node
          containers:
            - name: backup
              # Pinned. This was originally minio/mc tagged with the version mc
              # itself reports - which is NOT a published Docker tag. The job sat in
              # ErrImagePull and the backup never ran: found by triggering it, not
              # by trusting a CronJob because it applied cleanly.
              image: amazon/aws-cli:2.17.0
              imagePullPolicy: IfNotPresent
              env:
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt-minio-backup-creds
                      key: ACCESS_KEY_ID
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: zigbee2mqtt-minio-backup-creds
                      key: ACCESS_SECRET_KEY
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  STAMP=$(date -u +%Y%m%d-%H%M%S)
                  PREFIX="zigbee2mqtt/$STAMP"

                  # Fail loudly rather than uploading nothing: an empty registry
                  # means the radio has nothing paired, which is a disaster, not a
                  # backup.
                  test -s /data/configuration.yaml || { echo "FATAL: no configuration.yaml on the volume - refusing to back up"; exit 1; }
                  N=$(wc -l < /data/database.db 2>/dev/null || echo 0)
                  echo "configuration.yaml present; database.db records: $N"
                  test "$N" -ge 5 || { echo "FATAL: registry looks empty ($N records) - refusing to back up"; exit 1; }

                  export AWS_ACCESS_KEY_ID="$MINIO_ACCESS_KEY"
                  export AWS_SECRET_ACCESS_KEY="$MINIO_SECRET_KEY"
                  export AWS_DEFAULT_REGION=us-east-1
                  EP="--endpoint-url http://openmediavault.local:9000"

                  # Copy the files individually rather than tarring them: the AWS CLI
                  # image has no tar, and per-file objects restore more precisely
                  # anyway (you can pull back just database.db).
                  for f in configuration.yaml database.db state.json coordinator_backup.json; do
                    [ -s "/data/$f" ] || { echo "  skip (absent): $f"; continue; }
                    aws $EP s3 cp "/data/$f" "s3://zigbee2mqtt-backups/$PREFIX/$f"
                  done

                  # Verify before pruning. A silent upload failure followed by a prune
                  # is how you lose the last good copy.
                  SZ=$(aws $EP s3api head-object --bucket zigbee2mqtt-backups \
                        --key "$PREFIX/database.db" --query 'ContentLength' --output text)
                  echo "verified database.db in the bucket: $SZ bytes"
                  test "$SZ" -gt 0

                  # Retention: 30 days.
                  CUT=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
                  aws $EP s3api list-objects-v2 --bucket zigbee2mqtt-backups --prefix zigbee2mqtt/ \
                    --query "Contents[?LastModified<'$CUT'].Key" --output text 2>/dev/null \
                    | tr '\t' '\n' | grep -v '^None$' | while read -r k; do
                        [ -n "$k" ] && aws $EP s3 rm "s3://zigbee2mqtt-backups/$k" >/dev/null && echo "pruned $k"
                      done
                  echo "retention: done"
                  aws $EP s3 ls s3://zigbee2mqtt-backups/zigbee2mqtt/ | tail -6
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-volume-zigbee2mqtt-0
