# Credential material for the Mosquitto broker in the zigbee namespace.
# Shape contracted by H2-214: keys `passwd` and `acl` are exactly what
# apps/zigbee/mosquitto-deployment.yaml mounts (via subPath, so the two
# plaintext client keys below are never projected into the broker pod).
#
# `passwd` is mosquitto_passwd output: $7$ PBKDF2-SHA512 hashes, no plaintext.
# The plaintext pairs exist because a hash cannot authenticate a client; they
# are used by zigbee2mqtt (via its own valuesFrom Secret) and by Node-RED.
# `tasmota` user added 2026-10-13 for the LAN-exposed broker
# (mosquitto-lan-service.yaml, NodePort 30188). Dedicated credential, NOT shared
# with zigbee2mqtt or nodered: if a Tasmota device leaks its password the blast
# radius is the tasmota/# ACL and nothing else. Generated with the real
# eclipse-mosquitto mosquitto_passwd binary ($7$ PBKDF2-SHA512, matching the
# two existing users exactly); the plaintext exists here only because a hash
# cannot authenticate a client.
apiVersion: v1
kind: Secret
metadata:
    name: zigbee-mqtt-credentials
    namespace: zigbee
type: Opaque
