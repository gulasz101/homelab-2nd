---
# ============================================================================
# Node-RED (H2-214) - chart pinned, image pinned, data on OMV NFS.
#
# Chart: schwarzit.github.io/node-red-chart 0.40.2 (Apache-2.0). Upstream
# Node-RED publishes an image but no chart; this is the most credible chart
# available and it was released the same day this ticket ran.
#
# IMAGE PIN: nodered/node-red:4.1.16-22 (the 4.1 line, Debian-based, Node 22).
# Node-RED 5.0.8 exists. It is deliberately NOT used: the migrated flows come
# off an unpinned `nodered/node-red` in the source stack, and a major-version
# jump during a data migration is how you spend a weekend debugging a flow
# engine instead of migrating data. Restore on the 4.1 line, prove the flows,
# then upgrade as its own deliberate change.
#
# THE SOURCE STACK BUILT A CUSTOM IMAGE - READ THIS BEFORE THE RESTORE
#   gulasz101/temp_collector/node-red/Dockerfile is `FROM nodered/node-red` plus
#   `npm install node-red-contrib-influxdb node-red-contrib-sun-position
#   node-red-contrib-cron-plus node-red-contrib-nmap`. Those nodes were baked
#   into the image, and the restored flows use three of them (the node census in
#   the recon note counts cronplus, influxdb-out and sun-position nodes).
#   This scaffold runs the STOCK pinned image, so the palette has to be provided
#   on top of it. Two honest options, both for H2-216:
#     (a) install the three modules into /data/node_modules from the editor
#         (Manage Palette) - /data is on the durable NFS PVC, so it is a one-off
#         and it survives rebuilds; or
#     (b) build a pinned custom image - needs an image registry and CI, which
#         this repo has only for openchamber.
#   (a) is what this scaffold assumes. node-red-contrib-nmap can be dropped: no
#   nmap node appears in the flow census, and the module additionally needs the
#   `nmap` binary, which the stock image does not ship.
#
# NO settings CONFIGMAP
#   The chart can mount a settings.js ConfigMap at /data/settings.js. Not used
#   here: /data comes from the restore, and the source settings.js (24 KB) is
#   part of it. Mounting a ConfigMap over it would shadow the migrated file.
#   The credentialSecret question is handled in the H2-216 notes instead:
#   the restored .config.runtime.json carries the generated credential key, so
#   flows_cred.json decrypts out of the box, and pinning a fixed
#   NODE_RED_CREDENTIAL_SECRET is a deliberate rotation to do AFTER the cutover
#   (setting one now would make the restored credentials undecryptable).
#
# CORRECTED 2026-10-13. Two sentences above were wrong and caused real damage:
#
# 1. "ClusterIP only" - no longer true. node-red-lan-service.yaml now publishes
#    the editor on NodePort 30180 so it is reachable from a browser on the LAN.
#    Supreme Leader's explicit call: he edits flows in the browser and needs the
#    same convenience he had on the previous device. It is deliberately NOT
#    behind a Cloudflare Tunnel - an unauthenticated automation writer on the
#    public internet is the one combination nobody wants.
#
# 2. "The source settings.js may already carry adminAuth - that comes with the
#    restore." VERIFIED FALSE. Probed from inside the cluster: GET / returned
#    HTTP 200 unauthenticated, and GET /settings exposed no adminAuth,
#    httpAdminAuth or httpNodeAuth. The restored settings.js has NO auth.
#    Anyone who can reach :1880 can deploy flows. Do not let the older comment
#    convince you otherwise - it was an assumption written down as fact.
#
# LAN access now: http://<any-node-ip>:30180  (use 192.168.1.179, always-on).
# port-forward is no longer the only way in.
# ============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-red
  namespace: zigbee
spec:
  interval: 1h
  chart:
    spec:
      chart: node-red
      version: "0.40.2"
      sourceRef:
        kind: HelmRepository
        name: node-red
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Node-RED's /data is OMV NFS. The pod was landing on zigbee-node, which has NO
  # nfs-common installed, and the mount failed with:
  #   fsconfig() failed: NFS: mount program didn't pass remote address
  # That is the documented trap for new k3s nodes: nfs-common must be installed
  # before a node can mount an OMV export.
  #
  # Two ways out: install nfs-common on zigbee-node (needs root, not available to
  # the agent) or place the pod where nfs-common already exists. Doing the
  # second so the automation is self-contained, and leaving the first as a
  # follow-up so the pin can be removed later.
  #
  # Done as a postRenderer rather than a chart value because the chart's values
  # schema is NOT in docs-mcp (the indexed node-red library is the application's
  # docs, not schwarzit/node-red-chart's) - so rather than guess a key name, the
  # patch targets the rendered Deployment. There is exactly one, so a bare
  # kind target is unambiguous.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  kubernetes.io/hostname: homelab-2nd

  values:
    image:
      registry: docker.io
      repository: nodered/node-red
      tag: "4.1.16-22"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 1880

    # The restored /data on OMV NFS, not a chart-created PVC.
    persistence:
      enabled: true
      existingClaim: node-red-data

    # TZ is Etc/UTC in the source stack and the flows contain sun-position
    # nodes, which do their own time maths. Do not "fix" this during a
    # migration: changing the timezone changes when the house turns its lights
    # on. If it should move to Europe/Warsaw, that is its own change with its
    # own verification.
    env:
      - name: TZ
        value: Etc/UTC

    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
