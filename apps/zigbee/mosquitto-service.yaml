---
# ============================================================================
# Mosquitto Service (H2-214).
#
# SUPERSEDED 2026-10-13 - read this before trusting the sentence below.
#
# This Service is STILL ClusterIP, and it is still the one every in-cluster
# client should use (zigbee2mqtt's `mqtt://mosquitto`, Node-RED's broker node).
# What changed is that it is no longer the only way in:
# mosquitto-lan-service.yaml now publishes the same broker on NodePort 30188 so
# Tasmota devices can dial it from the LAN, exactly as they reached the retired
# homelab-one broker on 192.168.1.144:1883. That came with what this comment
# demanded - a deliberate decision plus an ACL - namely the dedicated `tasmota`
# user in zigbee-mqtt-credentials.sops.yaml. Still not anonymous.
#
# Original reasoning, kept for the record:
# "reachable only from inside the cluster. If a device on the LAN ever needs
#  MQTT again, that is a deliberate NodePort/LoadBalancer decision with an ACL
#  to go with it - not a default."
#
# The name is `mosquitto` on purpose: the migrated zigbee2mqtt
# configuration.yaml points at `mqtt://mosquitto`, and the short name resolves
# inside this namespace.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: zigbee
  labels:
    app: mosquitto
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: zigbee
spec:
  type: ClusterIP
  ports:
    - name: mqtt
      port: 1883
      protocol: TCP
      targetPort: mqtt
  selector:
    app: mosquitto
