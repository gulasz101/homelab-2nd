---
# Seed the Node-RED MQTT broker credential from the SOPS Secret.
#
# WHY A JOB: Node-RED stores MQTT username/password as an encrypted credential in
# flows_cred.json. The migrated flows were written against a broker that allowed
# anonymous access, so the broker node (id c1ecb8b21360de2b) has no username at
# all - hence 'disconnected: not authorised' against the now-authenticated broker.
#
# WHY THIS SHAPE, AND NOT A UI CLICK: any command-line route
# (`kubectl exec ... NRPW=<password> ...`) puts the plaintext credential into the
# process table and into whatever transcript the operator is working in. Here the
# password is injected by Kubernetes from the Secret as an environment variable and
# read inside the container with os.environ, so it never appears in a command line,
# in this manifest, in an argv, or in a log.
#
# Node-RED encrypts it with the credentialSecret from settings.js on write, so the
# value at rest stays encrypted.
#
# WHY THE IMAGE IS python:3.13-alpine AND NOT curlimages/curl (the -v3 bump):
# Revisions 1 and 2 used `curlimages/curl:8.11.0`, which contains curl and NOTHING
# ELSE - no python3. The entire flow-patching step is a Python program, so the Job
# died with the least helpful error imaginable:
#
#   /bin/sh: python3: not found
#
# It could never have succeeded on that image, however correct the Node-RED API
# call was - which is why the API-shape debugging on 2026-10-11 produced a fix that
# still failed on the next run. There was no shell/curl dependency worth keeping
# (the readiness probe is now one urllib call), so the whole thing is a single
# Python program on the same `python:3.13-alpine` image the backup CronJobs use.
# One interpreter, one language, no argv, no shell.
#
# WHY THE NAME IS VERSIONED - THE RULE THIS ENCODES (ADR-048):
# `Job.spec.template` is IMMUTABLE. Changing it under a stable name is rejected at
# Flux's server-side dry-run:
#
#   Job.batch "nodered-mqtt-credential" is invalid:
#     spec.template: Invalid value: ...: field is immutable
#
# `apps` is ONE Kustomization and it is all-or-nothing, so revision 1's failed Job
# froze EVERY application deploy in the repo for 20 hours (applied stuck at
# 0daf87d while three commits queued behind it).
#
# Revision history of this Job object:
#   nodered-mqtt-credential     Failed BackoffLimitExceeded 2026-10-11T22:06Z
#                               (no python3 in the image; API shape also wrong)
#   nodered-mqtt-credential-v2  Failed 2026-10-12, `/bin/sh: python3: not found`
#                               (API shape now correct; image still had no python)
#   nodered-mqtt-credential-v3  this one - python:3.13-alpine, whole script in Python
#
# So: one-shot Jobs in this repo carry a version suffix in `metadata.name`, and it
# MUST be bumped every time `spec.template` changes. A rename makes Flux create a
# NEW Job object; Flux then prunes the superseded one (it carries this
# Kustomization's prune labels), so the two do not coexist. Side effect, by design:
# bumping the suffix RE-RUNS the Job - which is exactly what is wanted here, and
# exactly why the other bare-named Jobs in the repo (see ADR-048) must only be
# converted when a re-run is acceptable.
#
# Guardrail 2 note: a Job is the sanctioned raw-manifest form for a one-shot
# bootstrap. Flux does not re-run completed Jobs, so this runs once per name.
# Re-running the same credential is harmless if it ever needs to be recreated.
apiVersion: batch/v1
kind: Job
metadata:
  name: nodered-mqtt-credential-v3
  namespace: zigbee
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: set-credential
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: MQTT_USER
              value: nodered
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zigbee-mqtt-credentials
                  key: NODERED_MQTT_PASSWORD
          command:
            - python3
            - -c
            - |
              # The working call, found the hard way. Node-RED 4.1 rejects
              # everything that looks obvious:
              #   POST /credentials/<id>            -> 404 Cannot POST /credentials/<id>
              #   POST /flow  {user,password}       -> 400 missing nodes property
              #   POST /flow  {nodes:[...]}         -> 400 duplicate id
              #   PUT  /flow/<id>                   -> 404 not_found
              # What works is a whole-flow update: GET /flows, add a `credentials`
              # object to the mqtt-broker node, POST /flows back with the SAME rev.
              # The rev is required - omitting it invites an edit conflict, and a
              # stale one is rejected.
              #
              # The password arrives as an env var from the Secret and is read with
              # os.environ, so it never appears in a command line or in any log.
              import json, os, sys, time, urllib.request

              NR = "http://node-red:1880"
              USER = os.environ["MQTT_USER"]
              PASSWORD = os.environ["MQTT_PASSWORD"]

              def req(method, path, body=None, timeout=30):
                  data = json.dumps(body).encode() if body is not None else None
                  r = urllib.request.Request(NR + path, data=data, method=method)
                  r.add_header("Content-Type", "application/json")
                  r.add_header("Node-RED-API-Version", "v2")
                  with urllib.request.urlopen(r, timeout=timeout) as resp:
                      return json.load(resp)

              # 1. The Job and Node-RED start together, so wait for the admin API.
              #    /flows is probed here (not /settings) so the wait also proves the
              #    endpoint the patch depends on is actually answering.
              print("waiting for Node-RED admin API")
              deadline = time.time() + 120
              while True:
                  try:
                      req("GET", "/flows")
                      break
                  except Exception:
                      if time.time() > deadline:
                          print("FATAL: Node-RED admin API unreachable after 120s")
                          sys.exit(1)
                      time.sleep(3)

              # 2. Whole-flow update: patches every mqtt-broker node in the flow.
              d = req("GET", "/flows")
              rev, flows = d.get("rev"), d.get("flows") or []
              patched = 0
              for n in flows:
                  if n.get("type") == "mqtt-broker":
                      n["credentials"] = {"user": USER, "password": PASSWORD}
                      patched += 1
              if not patched:
                  print("FATAL: no mqtt-broker node in the flow")
                  sys.exit(1)
              req("POST", "/flows", {"rev": rev, "flows": flows})
              print("  patched %d broker node(s); credential written" % patched)
              print("done")
