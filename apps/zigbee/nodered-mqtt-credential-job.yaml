---
# Seed the Node-RED MQTT broker credential from the SOPS Secret.
#
# WHY A JOB: Node-RED stores MQTT username/password as an encrypted credential in
# flows_cred.json. The migrated flows were written against a broker that allowed
# anonymous access, so the broker node (id c1ecb8b21360de2b) has no username at
# all - hence 'disconnected: not authorised' against the now-authenticated broker.
#
# WHY THIS SHAPE, AND NOT A UI CLICK: any command-line route
# (`kubectl exec ... NRPW=<password> ...`) puts the plaintext credential into the
# process table and into whatever transcript the operator is working in. Here the
# password is injected by Kubernetes from the Secret as an environment variable, so
# it never appears in a command line, in this manifest, or in a log.
#
# Node-RED encrypts it with the credentialSecret from settings.js on write, so the
# value at rest stays encrypted.
#
# WHY THE `-v2` SUFFIX - THE RULE THIS ENCODES (ADR-048):
# `Job.spec.template` is IMMUTABLE. Revision 1 of this Job (the unsuffixed
# `nodered-mqtt-credential`) died with BackoffLimitExceeded at 2026-10-11T22:06Z.
# The corrected script was committed 5 minutes later, and Flux could not apply it -
# a changed template under a stable name is rejected at server-side dry-run:
#
#   Job.batch "nodered-mqtt-credential" is invalid:
#     spec.template: Invalid value: ...: field is immutable
#
# `apps` is ONE Kustomization and it is all-or-nothing, so that single rejection
# froze EVERY application deploy in the repo for 20 hours. The applied revision sat
# at 0daf87d while three commits queued up behind it.
#
# So: one-shot Jobs in this repo carry a version suffix in `metadata.name`, and the
# suffix MUST be bumped every time `spec.template` changes. A rename creates a NEW
# Job object; Flux also prunes the superseded one (it carries this Kustomization's
# prune labels), so the two do not coexist. Side effect to be aware of: bumping the
# suffix RE-RUNS the Job - which is exactly what we want here, and exactly why the
# other bare-named Jobs in the repo (see ADR-048) must only be converted when a
# re-run is acceptable.
#
# Guardrail 2 note: a Job is the sanctioned raw-manifest form for a one-shot
# bootstrap. Flux does not re-run completed Jobs, so this runs once per name.
# Re-running the same credential is harmless if it ever needs to be recreated.
apiVersion: batch/v1
kind: Job
metadata:
  name: nodered-mqtt-credential-v2
  namespace: zigbee
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: set-credential
          image: curlimages/curl:8.11.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MQTT_USER
              value: nodered
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zigbee-mqtt-credentials
                  key: NODERED_MQTT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              NR=http://node-red:1880
              BROKER_NODE=c1ecb8b21360de2b

              echo "waiting for Node-RED admin API"
              i=0
              while [ "$i" -lt 40 ]; do
                if curl -sf -o /dev/null "$NR/settings"; then break; fi
                i=$((i+1)); sleep 3
              done
              curl -sf -o /dev/null "$NR/settings" || { echo "FATAL: Node-RED admin API unreachable"; exit 1; }

              # The working call, found the hard way. Node-RED 4.1 rejects
              # everything that looks obvious:
              #   POST /credentials/<id>            -> 404 Cannot POST /credentials/<id>
              #   POST /flow  {user,password}       -> 400 missing nodes property
              #   POST /flow  {nodes:[...]}         -> 400 duplicate id
              #   PUT  /flow/<id>                   -> 404 not_found
              # What works is a whole-flow update: GET /flows, add a `credentials`
              # object to the mqtt-broker node, POST /flows back with the SAME rev.
              # The rev is required - omitting it invites an edit conflict, and a
              # stale one is rejected.
              #
              # The password arrives as an env var from the Secret, so it never
              # appears in a command line, in this manifest, or in any log.
              python3 -c '
                import json, os, urllib.request
                NR = "http://node-red:1880"
                def req(method, path, body=None):
                    data = json.dumps(body).encode() if body is not None else None
                    r = urllib.request.Request(NR + path, data=data, method=method)
                    r.add_header("Content-Type", "application/json")
                    r.add_header("Node-RED-API-Version", "v2")
                    return json.load(urllib.request.urlopen(r, timeout=30))
                d = req("GET", "/flows")
                rev, flows = d.get("rev"), d.get("flows") or []
                patched = 0
                for n in flows:
                    if n.get("type") == "mqtt-broker":
                        n["credentials"] = {"user": os.environ["MQTT_USER"], "password": os.environ["MQTT_PASSWORD"]}
                        patched += 1
                if not patched:
                    raise SystemExit("FATAL: no mqtt-broker node in the flow")
                req("POST", "/flows", {"rev": rev, "flows": flows})
                print("  patched %d broker node(s); credential written" % patched)
                '
              echo "done"
