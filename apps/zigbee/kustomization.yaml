---
# ============================================================================
# zigbee namespace group.
#
# A NESTED kustomization referenced from apps/kustomization.yaml as "- zigbee/",
# the same shape apps/arr-stack/ uses. H2-210 wired the four z2m files flat in
# apps/kustomization.yaml; H2-214 folded them in here. Two reasons:
#   1. the render gate is `kubectl kustomize <path>` and this gives it one clean
#      path that renders exactly this group (kubeconform -strict over the whole
#      apps tree is noisy: every SOPS-encrypted Secret in the repo trips the
#      strict Secret schema on its `sops:` metadata block);
#   2. twenty-odd file entries with their rationale stay next to the files they
#      explain instead of growing apps/kustomization.yaml by another 60 lines.
#
# Everything is listed explicitly - no directory globs - so a forgotten file is
# a visible diff line. apps/zigbee/tests/render-check.sh asserts that every
# *.yaml on disk appears in this list.
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespace (created by H2-210 for the radio head, extended by H2-214)
  - namespace.yaml

  # Chart sources (all pinned by the HelmReleases below)
  - helm-repositories.yaml

  # --- zigbee2mqtt: Zigbee radio head bridge (upstream chart 2.14.2) ---------
  # Scaffolded by H2-210 (the radio-head ticket).
  - zigbee2mqtt-secrets.sops.yaml
  # The migrated state (17-device registry + coordinator backup). Drives the
  # one-off restore Job below; the preflight gate then lets z2m start.
  - zigbee2mqtt-restored-state.sops.yaml
  - zigbee2mqtt-restore-job.yaml
  - zigbee2mqtt-preflight-configmap.yaml
  - zigbee2mqtt-helm-release.yaml
  # The durability promise the storage comment makes. Holds the Zigbee
  # network key + the 17-device registry; without it that state is a single
  # un-backed-up copy on the radio head's microSD.
  - zigbee2mqtt-minio-backup-creds.sops.yaml
  - zigbee2mqtt-backup-cronjob.yaml

  # --- Mosquitto: MQTT broker (raw manifests, no sane upstream chart exists) --
  # SOPS-encrypted broker credentials + ACL (H2-215). The shape contracts
  # exactly what mosquitto-deployment.yaml mounts.
  - zigbee-mqtt-credentials.sops.yaml
  - mosquitto-configmap.yaml
  - mosquitto-deployment.yaml
  - mosquitto-service.yaml

  # --- Node-RED: flow engine, 110 nodes / 7 tabs migrated from homelab-one ---
  - node-red-data-pv.yaml
  - node-red-data-pvc.yaml
  - node-red-helm-release.yaml

  # --- InfluxDB v2: sensor history ------------------------------------------
  # SOPS-encrypted admin password + API token (H2-215); the chart's
  # adminUser.existingSecret contract.
  - zigbee-influxdb-credentials.sops.yaml
  - influxdb-pvc.yaml
  - influxdb-service-monitor.yaml
  - influxdb-helm-release.yaml

  # --- Observability (guardrail 9) ------------------------------------------
  - zigbee-prometheus-rules.yaml
  - zigbee-alertmanager-config.yaml
  - zigbee-loki-rule.yaml
  - zigbee-dashboard-configmap.yaml
