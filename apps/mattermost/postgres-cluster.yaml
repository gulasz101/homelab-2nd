---
# CNPG Cluster for Mattermost — single instance on local-path NVMe
# Backups + WAL archiving via the Barman Cloud CNPG-I plugin to OMV MinIO
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mattermost-db
  namespace: mattermost
  # Barman serverName generation convention: see
  # docs/cnpg-backup-servername-generations.md. A rebuilt cluster archives into
  # a fresh "<name>-genN" namespace while recovering from the previous one, so
  # the cnpg.io/skipEmptyWalArchiveCheck annotation is no longer needed.
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16-minimal-trixie

  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"

  # Recovery bootstrap: if this cluster is ever recreated, restore the latest
  # available base backup from the barman ObjectStore and replay WAL.
  bootstrap:
    recovery:
      source: origin
      database: mattermost
      owner: mattermost
      secret:
        name: mattermost-db-credentials

  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: mattermost-db-backups
          # Previous generation (recovery source); bump to the prior genN on rebuild.
          serverName: mattermost-db

  # Storage — local-path on homelab-2nd NVMe (fast, NOT durable)
  storage:
    storageClass: local-path
    size: 10Gi

  # Barman Cloud CNPG-I plugin provides WAL archiving and base backups.
  # We stay on PostgreSQL 16 to avoid a risky major-version migration.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mattermost-db-backups
        # Current generation (archiver target); bump to "<name>-genN" (fresh) on rebuild.
        serverName: mattermost-db

  # Retention only — backup destination is handled by the plugin ObjectStore.
  backup:
    retentionPolicy: "30d"

  # Resource limits — reasonable for a homelab
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
