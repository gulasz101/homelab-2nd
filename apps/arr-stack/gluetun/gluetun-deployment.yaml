---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun
  namespace: arr-stack
  labels:
    app.kubernetes.io/name: gluetun
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gluetun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gluetun
    spec:
      nodeSelector:
        kubernetes.io/hostname: arr-box
      hostNetwork: false
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
                - NET_ADMIN
            allowPrivilegeEscalation: true
          ports:
            - name: socks5
              containerPort: 1080
              protocol: TCP
            - name: http-proxy
              containerPort: 8888
              protocol: TCP
            - name: qbit-ui
              containerPort: 8080
              protocol: TCP
            - name: torrent-tcp
              containerPort: 6881
              protocol: TCP
            - name: torrent-udp
              containerPort: 6881
              protocol: UDP
            - name: prowlarr
              containerPort: 9696
              protocol: TCP
            - name: sonarr
              containerPort: 8989
              protocol: TCP
            - name: radarr
              containerPort: 7878
              protocol: TCP
            - name: flaresolvr
              containerPort: 8191
              protocol: TCP
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-mullvad-keys
                  key: private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: gluetun-mullvad-keys
                  key: address
            - name: SERVER_COUNTRIES
              value: Spain
            - name: HTTPPROXY
              value: "on"
            - name: HTTPPROXY_LISTENING_ADDRESS
              value: ":8888"
            - name: FIREWALL_OUTBOUND_SUBNETS
              valueFrom:
                secretKeyRef:
                  name: gluetun-mullvad-keys
                  key: lan-subnet
            - name: PUID
              value: "1100"
            - name: PGID
              value: "1100"
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: gluetun-config
              mountPath: /gluetun
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls467
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 30); do
                COUNTRY=$(python3 -c "import urllib.request, json; print(json.loads(urllib.request.urlopen('https://am.i.mullvad.net/json', timeout=10).read()).get('country',''))" 2>/dev/null || true)
                if [ "$COUNTRY" = "Spain" ]; then
                  echo "OK: VPN exit IP country is Spain; starting qBittorrent"
                  break
                fi
                echo "Attempt $i: VPN exit IP country is '${COUNTRY:-unknown}', retrying in 10s..."
                sleep 10
              done
              if [ "$COUNTRY" != "Spain" ]; then
                echo "FATAL: VPN exit IP is not Spain. Refusing to start qBittorrent."
                exit 1
              fi
              exec /init
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
            - name: PUID
              value: "1100"
            - name: PGID
              value: "1100"
            - name: TZ
              value: Europe/Berlin
            # No HTTP_PROXY/HTTPS_PROXY here: qBittorrent shares gluetun network namespace.
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy
                  COUNTRY=$(python3 -c "import urllib.request, json; print(json.loads(urllib.request.urlopen('https://am.i.mullvad.net/json', timeout=10).read()).get('country',''))" 2>/dev/null || true)
                  [ "$COUNTRY" = "Spain" ] || { echo "Liveness fail: country=$COUNTRY"; exit 1; }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: gluetun-config
          persistentVolumeClaim:
            claimName: gluetun-config
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: arr-stack-downloads
