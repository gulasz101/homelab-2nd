---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: arr-stack-resource-alerts
  namespace: arr-stack
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: arr-stack.resources
      interval: 30s
      rules:
        - alert: ArrStackCPUAboveRequest
          expr: |
            sum by (pod, container, namespace) (
              rate(container_cpu_usage_seconds_total{namespace="arr-stack", container!=""}[5m])
            ) >
            sum by (pod, container, namespace) (
              kube_pod_container_resource_requests{namespace="arr-stack", resource="cpu", container!=""}
            )
          for: 5m
          labels:
            severity: warning
            namespace: arr-stack
          annotations:
            summary: "arr-stack/{{ $labels.pod }} CPU above request"
            description: "{{ $labels.pod }}/{{ $labels.container }} CPU usage exceeds its request for more than 5 minutes."
        - alert: ArrStackMemoryAboveRequest
          expr: |
            sum by (pod, container, namespace) (
              container_memory_working_set_bytes{namespace="arr-stack", container!=""}
            ) >
            sum by (pod, container, namespace) (
              kube_pod_container_resource_requests{namespace="arr-stack", resource="memory", container!=""}
            )
          for: 5m
          labels:
            severity: warning
            namespace: arr-stack
          annotations:
            summary: "arr-stack/{{ $labels.pod }} memory above request"
            description: "{{ $labels.pod }}/{{ $labels.container }} memory usage exceeds its request for more than 5 minutes."
        - alert: ArrStackCPUAbove90PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              rate(container_cpu_usage_seconds_total{namespace="arr-stack", container!=""}[5m])
            ) / sum by (pod, container, namespace) (
              container_spec_cpu_quota{namespace="arr-stack", container!=""} / container_spec_cpu_period{namespace="arr-stack", container!=""}
            ) > 90
          for: 5m
          labels:
            severity: critical
            namespace: arr-stack
          annotations:
            summary: "arr-stack/{{ $labels.pod }} CPU above 90% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} CPU is above 90% of its limit for more than 5 minutes."
        - alert: ArrStackMemoryAbove90PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              container_memory_working_set_bytes{namespace="arr-stack", container!=""}
            ) / sum by (pod, container, namespace) (
              kube_pod_container_resource_limits{namespace="arr-stack", resource="memory", container!=""}
            ) > 90
          for: 5m
          labels:
            severity: critical
            namespace: arr-stack
          annotations:
            summary: "arr-stack/{{ $labels.pod }} memory above 90% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} memory is above 90% of its limit for more than 5 minutes."
        - alert: ArrStackPodNotReady
          expr: |
            kube_pod_status_ready{namespace="arr-stack", condition="true"} == 0
          for: 5m
          labels:
            severity: critical
            namespace: arr-stack
          annotations:
            summary: "arr-stack/{{ $labels.pod }} not ready"
            description: "Pod {{ $labels.pod }} in arr-stack has been not ready for more than 5 minutes."
