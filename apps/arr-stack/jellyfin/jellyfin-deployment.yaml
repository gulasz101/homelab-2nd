---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: arr-stack
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      nodeSelector:
        kubernetes.io/hostname: arr-box
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:10.11.11ubu2404-ls40
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: PUID
              value: "1100"
            - name: PGID
              value: "1100"
            - name: TZ
              value: Europe/Berlin
            - name: JELLYFIN_PublishedServerUrl
              value: "http://192.168.1.162:30096"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data/tvshows
              subPath: tv
            - name: media
              mountPath: /data/movies
              subPath: movies
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: arr-stack-media
