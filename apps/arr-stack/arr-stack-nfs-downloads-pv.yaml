---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: arr-stack-downloads
  namespace: arr-stack
spec:
  capacity:
    storage: 1500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: openmediavault.local
    path: /srv/dev-disk-by-uuid-b6591cb4-4cc4-4901-aaa2-4feabab33235/downloads
  mountOptions:
    - hard
    - intr
    - nconnect=8
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-stack-downloads
  namespace: arr-stack
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1500Gi
  volumeName: arr-stack-downloads
