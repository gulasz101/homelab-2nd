---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: arr-stack
  labels:
    app.kubernetes.io/name: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: arr-box
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "chown -R 1100:1100 /config || true"
          volumeMounts:
            - name: config
              mountPath: /config
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.2.1.10461-ls309
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 7878
              protocol: TCP
          env:
            - name: HTTP_PROXY
              value: "http://gluetun.arr-stack.svc.cluster.local:8888"
            - name: HTTPS_PROXY
              value: "http://gluetun.arr-stack.svc.cluster.local:8888"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,cluster.local,.arr-stack.svc.cluster.local,openmediavault.local"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /movies
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: downloads
          persistentVolumeClaim:
            claimName: arr-stack-downloads
        - name: media
          persistentVolumeClaim:
            claimName: arr-stack-media
