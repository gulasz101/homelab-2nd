---
# Open WebUI Postgres cluster — single instance on local-path NVMe
# Backups + WAL archiving via the Barman Cloud CNPG-I plugin to OMV MinIO
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openwebui-db
  namespace: llm-hub
  # Barman serverName generation convention: see
  # docs/cnpg-backup-servername-generations.md. A rebuilt cluster archives into
  # a fresh "<name>-genN" namespace while recovering from the previous one, so
  # the cnpg.io/skipEmptyWalArchiveCheck annotation is no longer needed.
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.3-18-trixie

  # Recovery bootstrap: if this cluster is ever recreated, restore the latest
  # available base backup from the barman ObjectStore and replay WAL.
  bootstrap:
    recovery:
      source: origin
      database: openwebui
      owner: openwebui
      secret:
        name: openwebui-db-credentials

  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: openwebui-db-backups
          # Previous generation (recovery source); bump to the prior genN on rebuild.
          serverName: openwebui-db

  storage:
    storageClass: local-path
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: openwebui-db-backups
        # Current generation (archiver target); bump to "<name>-genN" (fresh) on rebuild.
        serverName: openwebui-db

  backup:
    retentionPolicy: "30d"

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
