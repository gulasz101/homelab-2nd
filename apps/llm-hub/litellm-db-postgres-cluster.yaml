---
# LiteLLM Postgres cluster — single instance on local-path NVMe
# Backups + WAL archiving via the Barman Cloud CNPG-I plugin to OMV MinIO
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  namespace: llm-hub
  annotations:
    # Recovery reuses the same ObjectStore/serverName as the source, so the
    # "archive must be empty" guard must be bypassed.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.3-18-trixie

  # Recovery bootstrap: if this cluster is ever recreated, restore the latest
  # available base backup from the barman ObjectStore and replay WAL.
  bootstrap:
    recovery:
      source: origin
      database: litellm
      owner: litellm
      secret:
        name: litellm-db-credentials

  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: litellm-db-backups
          serverName: litellm-db

  storage:
    storageClass: local-path
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: litellm-db-backups
        serverName: litellm-db

  backup:
    retentionPolicy: "30d"

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1500m"
