---
# ConfigMap for the LiteLLM virtual-key model-whitelist provisioner.
# The script runs inside a CronJob and ensures every declared user key has
# access to the same model list that is configured in the LiteLLM proxy.
# Uses only Python stdlib, so no runtime package installs are needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-key-provisioner
  namespace: llm-hub
data:
  provision.py: |
    import json
    import os
    import sys
    import urllib.error
    import urllib.request

    LITELLM_URL = os.environ.get("LITELLM_URL", "http://litellm:4000")
    MASTER_KEY = os.environ.get("LITELLM_MASTER_KEY", "")
    DESIRED_MODELS = [
        "kimi-k2.7-code",
        # Ollama Cloud models (all with -ollama suffix)
        "glm-5.2-ollama",
        "glm-5.3-ollama",
        "glm-5.3-flash-ollama",
        "glm-5.1-ollama",
        "kimi-k2.7-code-ollama",
        "kimi-k2.6-ollama",
        "kimi-k3-ollama",
        "minimax-m2.7-ollama",
        "minimax-m3-ollama",
        "deepseek-v4-pro-ollama",
        "deepseek-v4-flash-ollama",
        "deepseek-v4-flash-0731-ollama",
        "deepseek-v4.1-flash-ollama",
        "qwen3.5-397b-ollama",
        "gemma4-31b-ollama",
        "mistral-large-3-675b-ollama",
        "nemotron-3-super-ollama",
        "nemotron-3-ultra-ollama",
        "nemotron-3-nano-30b-ollama",
        "gpt-oss-20b-ollama",
        "gpt-oss-120b-ollama",
        # GUL-123 / ADR-085 (2026-10-24): z.ai, Mistral, OpenRouter, the grey-zone
        # Anthropic resellers and Google Gemini left LiteLLM. LiteLLM now carries
        # paid subscriptions only (Ollama Cloud, OpenCode Go) plus the local LM
        # Studio models; free tiers live in FreeLLMAPI (apps/freellmapi/).
        # ADR-091: one named free route into FreeLLMAPI's gpt-oss-120b pool.
        "gpt-oss-120b-freellmapi",
        # Local LM Studio model on Hermes host
        "gemma-4-12b-uncensored",
        "qwen3.8-9b-heretic-uncensored",
        "qwen3.8-27b-mlx",
        # Honcho deriver/summary/dream/dialectic models
        "nemotron-3-nano-30b-ollama",
        "openai/nemotron-3-nano-30b-ollama",
        "nemotron-3-super-ollama",
        "openai/nemotron-3-super-ollama",
        "nemotron-3-ultra-ollama",
        "openai/nemotron-3-ultra-ollama",
        "beam-ollama",
        "deepseek-v4-pro-0813-ollama",
        "deepseek-v4.1-flash-1017-ollama",
        # GUL-591: same model on Wojtek's own DeepSeek API key (-ds suffix),
        # upstream id `deepseek-flash`. Kept in DESIRED_MODELS so every key
        # here can reach it; the route itself lives in litellm-helm-release.yaml.
        "deepseek-v4.1-flash-1017-ds",
        "minimax-m3.1-flash-ollama",
        "mistral-large-4-ollama",
        "muse-spark-open-ollama",
        "clef-27b-ollama",
        # OpenCode Go subscription models (2026-10-02: 29 verified live
        # + deepseek-v4.1-flash OpenChamber native route; 7 endpoint ids
        # excluded - chat-completions 400s, see litellm-helm-release.yaml)
        "deepseek-flash-go",
        "deepseek-v4-flash-go",
        "deepseek-v4-flash-vision-exp-go",
        "deepseek-v4-pro-go",
        "deepseek-v4.1-flash-go",
        "glm-5.1-go",
        "glm-5.2-go",
        "glm-5.3-go",
        "glm-5.3-flash-go",
        "hy3-go",
        "hy4-preview-go",
        "kimi-k2.6-go",
        "kimi-k2.7-code-go",
        "kimi-k3-go",
        "longcat-2.0-go",
        "longcat-2.5-preview-free-go",
        "mimo-v2.5-go",
        "mimo-v2.5-pro-go",
        "mimo-v2.6-flash-go",
        "mimo-v2.6-pro-go",
        "minimax-m2.5-go",
        "minimax-m3-go",
        "hindsight-consolidation-go",
        "omen-alpha-go",
        "qwen3.6-plus-go",
        "qwen3.7-max-go",
        "qwen3.7-plus-go",
        "qwen3.8-flash",
        "qwen3.8-flash-go",
        "qwen3.8-max-go",
        "space-bunny-free-go",
        "deepseek-v4.1-flash",
        "beam-free-go",
        "step-5-preview-go",
        "claude-haiku-5-5-go",
        "gemini-4-argon-contributor-go",
        "gpt-5.6-luna-go",
        "gpt-6-luna-go",
        "grok-4.6-go",
        "grok-4.7-go",
        "minimax-m2.7-go",
        "minimax-m3.1-flash-go",
        "muse-spark-1.2-contributor-go",
        "muse-spark-1.3-contributor-go",
    ]

    def expand_models(models):
        # LiteLLM clients may pass either the bare model name or an
        # openai/ prefixed name. Allow both forms so keys work regardless
        # of how the caller names the model.
        expanded = set()
        for m in models:
            expanded.add(m)
            if not m.startswith("openai/"):
                expanded.add(f"openai/{m}")
        return sorted(expanded)

    # Kubernetes maps secret keys like 'hermes-andrzej-key' to env vars
    # HERMES_ANDRZEJ_KEY. This list must match the keys in the
    # litellm-user-keys Secret.
    KEY_ENV_NAMES = [
        "WIFE_KEY",
        "WOJTEK_KEY",
        "HERMES_ANDRZEJ_KEY",
        "MEMORY_HONCHO_KEY",
        "HERMES_BILL_CIPHER_KEY",
        "OPENVIKING_KEY",
        # Pi + OpenCode engineers in Paperclip on the M1 Air (ADR-075)
        "PAPERCLIP_CODERS_KEY",
        # Hindsight reflect + mental-model refresh through llm-hub (GUL-263 /
        # ADR-094). Its own key, so the model list stays GitOps-managed like
        # every other service key instead of being a hand-scoped orphan.
        "HINDSIGHT_REFLECT_KEY",
    ]

    def api_request(path, token=None, method="GET", data=None):
        url = f"{LITELLM_URL}{path}"
        headers = {"Content-Type": "application/json"}
        if token:
            headers["Authorization"] = f"Bearer {token}"
        body = None
        if data is not None:
            body = json.dumps(data).encode("utf-8")
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=30) as resp:
                return json.loads(resp.read().decode("utf-8"))
        except urllib.error.HTTPError as e:
            err = e.read().decode("utf-8")
            print(f"ERROR {method} {path}: HTTP {e.code} {err}")
            raise


    def main():
        if not MASTER_KEY:
            print("LITELLM_MASTER_KEY not set; aborting")
            sys.exit(1)

        desired_models = expand_models(DESIRED_MODELS)
        desired_sorted = sorted(desired_models)

        for env_name in KEY_ENV_NAMES:
            token = os.environ.get(env_name)
            if not token:
                print(f"Skipping {env_name}: no token")
                continue

            key_alias = env_name.replace("_", "-").lower()
            print(f"Checking {key_alias}...")

            try:
                info = api_request("/key/info", token=token)
            except urllib.error.HTTPError:
                print(f"WARN: could not read info for {key_alias}")
                continue

            current_models = sorted(info.get("info", {}).get("models", []))
            if current_models != desired_sorted:
                print(f"Updating {key_alias}: {current_models} -> {desired_sorted}")
                api_request(
                    "/key/update",
                    token=MASTER_KEY,
                    method="POST",
                    data={"key": token, "models": desired_models},
                )
                print(f"{key_alias} updated")
            else:
                print(f"{key_alias} already correct")


    if __name__ == "__main__":
        main()
