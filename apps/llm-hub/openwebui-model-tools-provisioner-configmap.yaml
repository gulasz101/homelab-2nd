apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-model-tools-provisioner
  namespace: llm-hub
  labels:
    app.kubernetes.io/name: openwebui-model-tools-provisioner
    app.kubernetes.io/part-of: llm-hub
data:
  provision.sh: "#!/bin/sh\n# openwebui-model-tools-provisioner (two-stage: fetch -> sql).\n# Stage 1 container (python:3.13-alpine) GETs LiteLLM /models via urllib and writes the\n# chat-model id list to /shared/models.json (skips embed/rerank/tts-style models).\n# Stage 2 container (CNPG postgres image: psql, no python) upserts an Open WebUI\n# workspace-model override row per model id, with the two Hindsight MCP tool servers\n# MERGED into meta.toolIds (user-picked tools survive). Same-id override of base models:\n# routing unchanged (Open WebUI merges name/meta over the LiteLLM base model).\n# Idempotent; hourly as a CronJob. Rows are USER DATA - the reconciler itself is the\n# GitOps artifact, not the rows it writes.\nset -eu\n: \"${LITELLM_URL:?}\"\n: \"${LITELLM_MASTER_KEY:?}\"\n: \"${SKIP_FETCH:-}\"\n\nif [ -z \"${SKIP_FETCH:-}\" ]; then\n  python3 - <<'PY'\nimport json, os, urllib.request\nreq = urllib.request.Request(os.environ[\"LITELLM_URL\"].rstrip(\"/\") + \"/models\")\nreq.add_header(\"\
    Authorization\", \"Bearer \" + os.environ[\"LITELLM_MASTER_KEY\"])\nd = json.load(urllib.request.urlopen(req, timeout=30))\nskip = (\"embed\", \"rerank\", \"whisper\", \"tts\", \"stt\", \"-audio\", \"moderation\", \"bge-\")\nids = sorted({m[\"id\"] for m in d[\"data\"] if not any(s in m[\"id\"].lower() for s in skip)})\nwith open(\"/shared/models.json\", \"w\") as f:\n    json.dump(ids, f)\nprint(\"fetched chat models:\", len(ids))\nPY\nfi\n\n# Stage 1 ends here - the apply stage re-runs the script with SKIP_FETCH=1.\n[ -n \"$SKIP_FETCH\" ] || { echo \"fetch stage done\"; exit 0; }\n\nMODELS_JSON=$(cat /shared/models.json)\nCOUNT=$(printf %s \"$MODELS_JSON\" | grep -o '\",\"' | wc -l)\necho \"chat models: count=$((COUNT + 1))\"\n\ncat > /tmp/upsert.sql <<SQLEOF\nBEGIN;\nCREATE TEMP TABLE _models (id text PRIMARY KEY);\nINSERT INTO _models SELECT DISTINCT v #>> '{}' FROM jsonb_array_elements('$MODELS_JSON'::jsonb) AS v;\nINSERT INTO model (id, user_id, base_model_id, name, params, meta,\
    \ updated_at, created_at, is_active)\nSELECT m.id, 'seed-provisioner', NULL, m.id, '{}',\n       jsonb_build_object('toolIds',\n           (SELECT COALESCE(jsonb_agg(DISTINCT t), '[]'::jsonb)\n            FROM jsonb_array_elements(\n                '[\"server:mcp:hindsight-chat-memory\",\"server:mcp:hindsight-fleet-memory\"]'::jsonb)\n            AS t)),\n       EXTRACT(EPOCH FROM NOW())::bigint, EXTRACT(EPOCH FROM NOW())::bigint, TRUE\nFROM _models m\nON CONFLICT (id) DO UPDATE\nSET meta = model.meta::jsonb || jsonb_build_object('toolIds',\n        (SELECT COALESCE(jsonb_agg(DISTINCT t), '[]'::jsonb)\n         FROM jsonb_array_elements(\n             COALESCE(model.meta::jsonb->'toolIds', '[]'::jsonb) ||\n             '[\"server:mcp:hindsight-chat-memory\",\"server:mcp:hindsight-fleet-memory\"]'::jsonb)\n         AS t)),\n    updated_at = EXTRACT(EPOCH FROM NOW())::bigint;\nCOMMIT;\nSQLEOF\n\npsql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /tmp/upsert.sql\necho \"verified - workspace rows\
    \ carrying the fleet tool (first count = live rows):\"\npsql \"$DATABASE_URL\" -t -c \"SELECT count(*) FROM model WHERE is_active AND meta::jsonb->'toolIds' @> '[\\\"server:mcp:hindsight-fleet-memory\\\"]';\"\necho \"reconcile complete\"\n"
