apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-model-tools-provisioner
  namespace: llm-hub
  labels:
    app.kubernetes.io/name: openwebui-model-tools-provisioner
    app.kubernetes.io/part-of: llm-hub
data:
  provision.sh: "#!/bin/sh\n# openwebui-model-tools-provisioner: attach the Hindsight MCP tool servers as DEFAULT tools\n# on EVERY LiteLLM chat model, by keeping Open WebUI workspace-model override rows in sync.\n# Same-id override = routing unchanged (Open WebUI merges name/meta over the base model;\n# utils/models.py \"Override applied directly to a base model (shares the same ID)\").\n# toolIds are MERGED, so any tools a user picked for the model survive. Idempotent, hourly.\n# Rows are USER DATA (same class as memories/chats) - deliberately NOT SOPS/GitOps objects;\n# the reconciler itself is the GitOps artifact.\nset -eu\n: \"${LITELLM_URL:?LITELLM_URL required}\"\n: \"${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}\"\n: \"${DATABASE_URL:?DATABASE_URL required}\"\n\nMODELS=$(python3 - <<'PY'\nimport json, os, urllib.request\nreq = urllib.request.Request(os.environ[\"LITELLM_URL\"].rstrip(\"/\") + \"/models\")\nreq.add_header(\"Authorization\", \"Bearer \" + os.environ[\"LITELLM_MASTER_KEY\"\
    ])\nd = json.load(urllib.request.urlopen(req, timeout=30))\nskip = (\"embed\", \"rerank\", \"whisper\", \"tts\", \"stt\", \"-audio\", \"moderation\", \"bge-\")\nids = sorted({m[\"id\"] for m in d[\"data\"] if not any(s in m[\"id\"].lower() for s in skip)})\nprint(json.dumps(ids))\nPY\n)\nCOUNT=$(printf %s \"$MODELS\" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')\necho \"chat models from LiteLLM: count=$COUNT\"\n\n# jsonb_array_elements over a JSON array of strings yields jsonb scalars; (v->>'0') is wrong for a\n# raw string element - the safe text extraction is v #>> '{}'  (empty path = the scalar itself).\ncat > /tmp/upsert.sql <<SQLEOF\nBEGIN;\nCREATE TEMP TABLE _models (id text PRIMARY KEY);\nINSERT INTO _models SELECT DISTINCT v #>> '{}' FROM jsonb_array_elements('$MODELS'::jsonb) AS v;\nINSERT INTO model (id, user_id, base_model_id, name, params, meta, updated_at, created_at, is_active)\nSELECT m.id, 'seed-provisioner', NULL, m.id, '{}',\n       jsonb_build_object('toolIds',\n\
    \           (SELECT COALESCE(jsonb_agg(DISTINCT t), '[]'::jsonb)\n            FROM jsonb_array_elements(\n                '[\"server:mcp:hindsight-chat-memory\",\"server:mcp:hindsight-fleet-memory\"]'::jsonb)\n            AS t)),\n       EXTRACT(EPOCH FROM NOW())::bigint, EXTRACT(EPOCH FROM NOW())::bigint, TRUE\nFROM _models m\nON CONFLICT (id) DO UPDATE\nSET meta = model.meta::jsonb || jsonb_build_object('toolIds',\n        (SELECT COALESCE(jsonb_agg(DISTINCT t), '[]'::jsonb)\n         FROM jsonb_array_elements(\n             COALESCE(model.meta::jsonb->'toolIds', '[]'::jsonb) ||\n             '[\"server:mcp:hindsight-chat-memory\",\"server:mcp:hindsight-fleet-memory\"]'::jsonb)\n         AS t)),\n    updated_at = EXTRACT(EPOCH FROM NOW())::bigint;\nCOMMIT;\nSQLEOF\n\npsql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /tmp/upsert.sql\n\necho \"verified - workspace models with hindsight tools:\"\npsql \"$DATABASE_URL\" -t -c \\\n  \"SELECT count(*) FROM model WHERE is_active AND meta::jsonb->'toolIds'\
    \ @> '[\\\"server:mcp:hindsight-fleet-memory\\\"]';\"\necho \"reconcile complete\""
