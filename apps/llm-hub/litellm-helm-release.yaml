      - model_name: minimax-m3-go
        litellm_params:
          model: openai/minimax-m3
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
        # Free on the Go plan (2026-10-19). Unlike minimax-m2.7, plain
        # chat-completions work (probed 2026-10-19: 1.3 s).
      - model_name: hindsight-consolidation-go
        litellm_params:
          # Hindsight consolidation route (H2-306, 2026-10-19). Purpose name with
          # its own fallback chain (router_settings.fallbacks): free-ish MiniMax on
          # the Go plan -> DeepSeek v4.1 flash on Go -> paid OpenRouter
          # gpt-oss-120b as last resort. The `-go` SUFFIX IS LOAD-BEARING: the
          # session normalizer only stamps `x-opencode-session` (which Go
          # requires) on names ending in -go or listed in OPENCODE_GO_UNSUFFIXED.
          # GUL-105 (2026-10-22): OpenCode Go RETIRED the old primary
          # `minimax-m3.1-flash-free` (it answers "Model minimax-m3.1-flash-free
          # has been deprecated" in ~0.2 s) between GUL-97's PR and its merge, so
          # the route could never answer: 158/158 consolidation calls in the first
          # 25 min on release v53 fell through to the metered
          # deepseek-v4.1-flash-go hop. Primary is now `minimax-m3` (same family,
          # live on the Go plan, 1.0 s probe).
          # Picked on replay evidence, not vibes - 8 real consolidation prompts
          # (banks hermes-andrzej / hermes-matejko, 5.0k-8.9k input tokens) rerun
          # through the running v53 pod on 2026-10-22 with the same key, endpoint
          # and x-opencode-session header, validated the H2-306 way (parses, only
          # creates/updates/deletes, required fields, every source_fact_id and
          # observation_id real and present in the prompt):
          #   beam-free   6/13 attempts answered, and every answer it gave was
          #               schema-valid - but 7/13 died in ~1 s on
          #               RateLimitError "Endpoint is unavailable", including when
          #               spaced 20 s apart. That is capacity, not schema, and it
          #               fails the 8/8 bar the issue set for the only other free
          #               Go model, so it was rejected as primary.
          #   minimax-m3  8/8 schema-valid (7 with actions plus one valid empty
          #               batch - _ConsolidationBatchResponse defaults all three
          #               lists to []), median 14.2 s, max 21.8 s: well inside the
          #               120 s route timeout below (GUL-108 raised it from 60 s).
          # minimax-m3 is NOT a cost win - it draws the same Go weekly allowance
          # as DeepSeek (ADR-068) - but it puts a live primary back in front of
          # the paid OpenRouter last resort instead of routing 100% of
          # consolidation onto the metered hop.
          # 2026-10-19 H2-306 baseline, for comparison: MiniMax 8/8 and DeepSeek
          # 8/8 schema-valid, gpt-oss 7/8 (one cited a non-existent id); MiniMax
          # 3-5 s typical with one 72 s outlier at 8.5k tokens.
          model: openai/minimax-m3
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
          # GUL-97 (2026-10-22): give up on MiniMax BEFORE Hindsight gives up on
          # LiteLLM, so the deepseek-v4.1-flash-go fallback below actually runs.
          # Without a timeout LiteLLM used its default request_timeout of 6000 s
          # (constants.DEFAULT_REQUEST_TIMEOUT_SECONDS, verified in the running
          # v1.85.7 pod), while Hindsight cancelled the call at 120 s - so the
          # fallback chain was NEVER reached: zero deepseek/gpt-oss fallbacks in
          # 2 h of logs, and every slow consolidation batch was cancelled and
          # retried from scratch until `after 4 attempts`.
          # The original 60 s hop was tuned on the retired
          # minimax-m3.1-flash-free. GUL-108 (2026-10-22) re-measured the live
          # route on pod litellm-6d649d8686-48qt6: 17 primary 200s vs 16
          # deepseek-v4.1-flash-go fallbacks in its first ~8 min (~48%), every
          # fallback landing 60-65 s after request start with no exception.
          # Hindsight's own batch log showed those calls completing in 77-106 s
          # total (60 s primary + 10-46 s DeepSeek), with minimax-m3 generating
          # ~100 tok/s once past prefill. The large (8-fact, 12-18 k-token)
          # batches were being cut just before finishing, not failing.
          # 120 s gives minimax-m3 room for those thinking-heavy batches while
          # preserving DeepSeek's 90 s window inside Hindsight's 210 s outer
          # budget. A 60 s hop is NOT faster when half the calls take it:
          # 60 s primary + 10-46 s DeepSeek is usually slower than finishing
          # the primary at 70-100 s, and it burns the metered Go hop.
          # num_retries MUST be 0: retries happen inside the model group BEFORE
          # fallbacks and default to 2, so a timeout alone would burn
          # 3 x 120 s = 360 s and outlive the caller again.
          # Invariant: this timeout must stay below
          # HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT in apps/hindsight (210 s =
          # 120 s primary + 90 s DeepSeek fallback; asserted by
          # apps/hindsight/tests/render-check.sh).
          timeout: 120
          num_retries: 0
