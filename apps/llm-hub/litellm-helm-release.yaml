# LiteLLM Proxy HelmRelease
# - Central AI gateway with virtual keys, spend tracking, model routing.
# - Uses external Postgres via CloudNativePG (not chart-bundled Postgres).
# - Prometheus metrics enabled via ServiceMonitor.
# - Internal ClusterIP only; public ingress via dedicated Cloudflare Tunnel.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: llm-hub
spec:
  interval: 1h
  chart:
    spec:
      chart: litellm-helm
      version: "1.85.7"
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # DB connection pieces come from SOPS-encrypted secret
  - kind: Secret
    name: litellm-db-credentials
    valuesKey: externalConnectionString
    targetPath: db.url
  values:
    replicaCount: 1

    image:
      repository: ghcr.io/berriai/litellm-database
      pullPolicy: IfNotPresent
      # Chart default appVersion is fine; pin only if needed
      tag: "v1.85.7"

    nameOverride: "litellm"

    # Use our CNPG Postgres, not the bundled Bitnami one
    db:
      useExisting: true
      deployStandalone: false
      endpoint: litellm-db-rw.llm-hub.svc.cluster.local
      database: litellm
      # db.url is injected via valuesFrom above; username/password from secret
      secret:
        name: litellm-db-credentials
        usernameKey: username
        passwordKey: password
        endpointKey: host

    # Master key from SOPS-encrypted secret
    masterkeySecretName: "litellm-master-key"
    masterkeySecretKey: "master-key"

    # Provider API keys are injected via environmentSecrets below
    # and referenced in proxy_config with os.environ/<VAR>
    extraEnvVars:
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-master-key
          key: salt-key
      # OpenCode Go subscription provider (Zen Go endpoint)
    - name: OPENCODE_GO_SUBSCRIPTION_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-provider-keys
          key: OPENCODE_GO_SUBSCRIPTION_API_KEY
      # Local LM Studio model does not need a real API key; LiteLLM still
      # sends an Authorization header so give it a non-empty placeholder
    - name: DUMMY_API_KEY
      value: "lm-studio-local-dummy-key"
      # SSO via Generic OIDC (Authentik) — Admin UI login only
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: client_id
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: client_secret
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: authorization_endpoint
    - name: GENERIC_TOKEN_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: token_endpoint
    - name: GENERIC_USERINFO_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: userinfo_endpoint
    - name: PROXY_BASE_URL
      value: "https://llm.voitech.dev"
      # Allowed email domains for SSO
    - name: ALLOWED_EMAIL_DOMAINS
      value: "voitech.dev"
      # Auto-redirect the UI login page straight to SSO (hides classic form)
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
      # Log the resolved session id and its source. Set to "0" to quiet it
      # once the wiring is proven; useful evidence during rollout.
    - name: OPENCODE_HOOK_DEBUG
      value: "1"

    # Pod template annotation used ONLY to force a rollout when the
    # litellm-session-callbacks ConfigMap changes. The callback module is
    # imported at LiteLLM startup, and the chart mounts it via subPath (which
    # does not update in place), so a ConfigMap-only change neither reloads the
    # module nor restarts the pod. BUMP THIS VALUE whenever custom_callbacks.py
    # changes, or the change will not take effect.
    podAnnotations:
      litellm.session-callbacks-revision: "3"
      # Provider keys come from the litellm-provider-keys Secret as env vars,
      # read only at pod start. BUMP THIS after rotating a key in
      # litellm-provider-keys.sops.yaml, or the pod keeps the old key.
      litellm.provider-keys-revision: "2"

    # Pre-call hook that normalizes the OpenCode Go session header (ADR-029).
    # LiteLLM loads a callback named in litellm_settings.callbacks by file path
    # RELATIVE TO THE CONFIG FILE (get_instance_fn: dirname(config)/module.py),
    # and the chart mounts the config at /etc/litellm/config.yaml — so the
    # module MUST live at /etc/litellm/custom_callbacks.py. (PYTHONPATH does
    # not help here; the loader reads the file directly.)
    volumes:
    - name: litellm-session-callbacks
      configMap:
        name: litellm-session-callbacks
    volumeMounts:
    - name: litellm-session-callbacks
      mountPath: /etc/litellm/custom_callbacks.py
      subPath: custom_callbacks.py

    # proxy_config is rendered into a ConfigMap and mounted as /etc/litellm/config.yaml
    proxy_config:
      model_list:
      - model_name: beam-ollama
        litellm_params:
          model: openai/beam
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
          # GUL-581 / ADR-101: mirror of beam-free-go (GUL-122). beam reasons by
          # default, so the client's reasoning_effort is dropped, not forwarded.
          drop_params: true
      - model_name: deepseek-v4-pro-0813-ollama
        litellm_params:
          model: openai/deepseek-v4-pro:0813
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: deepseek-v4.1-flash-1017-ollama
        litellm_params:
          model: openai/deepseek-v4.1-flash:1017
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
          # GUL-581 / ADR-101: this route is the fleet's executor primary, and Pi
          # (thinking: max) sends reasoning_effort. Ollama Cloud accepts it, but
          # LiteLLM rejects params the openai provider does not declare, so
          # declare it here instead of silently dropping the thinking budget.
          allowed_openai_params:
          - reasoning_effort
      - model_name: minimax-m3.1-flash-ollama
        litellm_params:
          model: openai/minimax-m3.1-flash
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: mistral-large-4-ollama
        litellm_params:
          model: openai/mistral-large-4
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: muse-spark-open-ollama
        litellm_params:
          model: openai/muse-spark-open
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: beam-free-go
        litellm_params:
          model: openai/beam-free
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY
          # GUL-122: Pi (thinking: max) sends reasoning_effort, which LiteLLM
          # rejects for openai/beam-free with 400 UnsupportedParamsError before
          # the call goes upstream. beam reasons by default; drop the param.
          drop_params: true
      - model_name: step-5-preview-go
        litellm_params:
          model: openai/step-5-preview
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY
      - model_name: minimax-m3.1-flash-go
        litellm_params:
          model: openai/minimax-m3.1-flash
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY
      - model_name: kimi-k2.7-code
        litellm_params:
          model: openai/kimi-k2.7-code
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: glm-5.2-ollama
        litellm_params:
          model: openai/glm-5.2
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: glm-5.3-ollama
        litellm_params:
          model: openai/glm-5.3
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
          # GUL-581 / ADR-101: reviewer/verifier route; same reasoning_effort
          # declaration as the flash route above.
          allowed_openai_params:
          - reasoning_effort
      - model_name: glm-5.3-flash-ollama
        litellm_params:
          model: openai/glm-5.3-flash
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: glm-5.1-ollama
        litellm_params:
          model: openai/glm-5.1
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: kimi-k2.7-code-ollama
        litellm_params:
          model: openai/kimi-k2.7-code
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: kimi-k2.6-ollama
        litellm_params:
          model: openai/kimi-k2.6
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: kimi-k3-ollama
        litellm_params:
          model: openai/kimi-k3
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: minimax-m2.7-ollama
        litellm_params:
          model: openai/minimax-m2.7
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: minimax-m3-ollama
        litellm_params:
          model: openai/minimax-m3
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: deepseek-v4-pro-ollama
        litellm_params:
          model: openai/deepseek-v4-pro
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: deepseek-v4-flash-ollama
        litellm_params:
          model: openai/deepseek-v4-flash
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: deepseek-v4-flash-0731-ollama
        litellm_params:
          model: "openai/deepseek-v4-flash:0731"
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: deepseek-v4.1-flash-ollama
        litellm_params:
          model: openai/deepseek-v4.1-flash
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
            # Ollama Cloud accepts reasoning_effort; allow the openai provider to
            # forward it (LiteLLM blocks unknown params otherwise).
          allowed_openai_params:
          - reasoning_effort
      - model_name: qwen3.5-397b-ollama
        litellm_params:
          model: "openai/qwen3.5:397b"
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: gemma4-31b-ollama
        litellm_params:
          model: openai/gemma4:31b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: mistral-large-3-675b-ollama
        litellm_params:
          model: openai/mistral-large-3:675b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: nemotron-3-super-ollama
        litellm_params:
          model: openai/nemotron-3-super
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: nemotron-3-ultra-ollama
        litellm_params:
          model: openai/nemotron-3-ultra
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: nemotron-3-nano-30b-ollama
        litellm_params:
          model: openai/nemotron-3-nano:30b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: gpt-oss-20b-ollama
        litellm_params:
          model: openai/gpt-oss:20b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: gpt-oss-120b-ollama
        litellm_params:
          model: openai/gpt-oss:120b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"

        # ── Local LM Studio model on the Hermes M1 Max (same LAN as the cluster) ──
      - model_name: gemma-4-12b-uncensored
        litellm_params:
            # LM Studio on the M1 Max, reached over the LAN (NOT NetBird).
            # The Mac's address comes from an OPNsense DHCP lease (m1max.local);
            # K8s pods cannot resolve `.local`, so pin the LAN IP here. If the
            # address ever changes it must be updated in ONE place: this line.
            # NOTE 2026-09-19: the lease is NOT truly static — it moved .148 → .129
            # and broke this route (connection refused). Set a static DHCP
            # reservation on OPNsense to stop this recurring.
            # Reachable from homelab-2nd; no real API key required.
          model: openai/gemma4-12b-qat-uncensored-hauhaucs-balanced
          api_base: "http://192.168.1.119:1234/v1"
          api_key: "os.environ/DUMMY_API_KEY"

        # Qwen3.8-9B heretic-uncensored (MLX 4-bit) — LM Studio on the M1 Max,
        # same LAN route/caveats as the gemma entry above (pinned DHCP IP).
        # NOTE: reasoning model — emits reasoning_content; test prompts need
        # generous max_tokens or content comes back empty (reasoning burn).
        # ⚠ DEPRECATED 2026-10-03: lineage runaway-think trap (9B-Distill has no
        # documented enable_thinking path). Prefer qwen3.8-27b-mlx.
      - model_name: qwen3.8-9b-heretic-uncensored
        litellm_params:
          model: openai/qwen3.8-9b-heretic-uncensored-mtplx
          api_base: "http://192.168.1.119:1234/v1"
          api_key: "os.environ/DUMMY_API_KEY"
          # Advertise the real native window (ADR-036 pattern). Qwen3.8-9B
          # Distill is Qwen3.5-arch with 262,144 native context (HF model
          # card, confirmed 2026-10-05). Without this LiteLLM omits
          # max_input_tokens and clients silently guess 131072. CAVEAT: the
          # engine only honours 262k if LM Studio's load setting matches AND
          # the MLX runtime escapes the auto-fit bug (pin 1.8.5, see
          # qwen3.8-27b-mlx note / H2-129).
        model_info:
          max_input_tokens: 262144
          max_output_tokens: 32768

        # Qwen3.8-27B MLX 4-bit (lmstudio-community, official weights) — LM
        # Studio on the M1 Max. Chosen over the 9B distills because the
        # official chat template ships a REAL thinking kill switch
        # (chat_template_kwargs.enable_thinking=false pre-emits an empty
        # think block) — verified live on 2026-10-03: loop-trap with 4000
        # max_tokens completed clean, finish=stop, no runaway deliberation.
        # Two aliases WERE planned: passthrough + nothink (route-side kill
        # switch). PROBE 2026-10-03 after deploy: chat_template_kwargs is
        # DROPPED on the way — LiteLLM does not forward it, and even a direct
        # curl to LM Studio's /v1 with enable_thinking=false still returns
        # reasoning_content. The kill switch only works inside the LM Studio
        # UI/engine, not via its OpenAI-compatible API. Aliases removed;
        # disable thinking from the LM Studio UI if you want it off globally.
        # Sampling note: never greedy-decode this family (documented
        # repetition loops): temp 0.7, top_p 0.8, top_k 20, presence 1.5.
      - model_name: qwen3.8-27b-mlx
        litellm_params:
          model: openai/qwen3.8-27b-mlx
          api_base: "http://192.168.1.119:1234/v1"
          api_key: "os.environ/DUMMY_API_KEY"
          # Advertise the real context window (ADR-036). Without this, LiteLLM
          # omits max_input_tokens for the openai/ passthrough and clients
          # (Hermes) fall back to a 131072 default — which is why the nightly
          # karakeep digest "could not shrink" a ~28k-token session. LM Studio
          # now serves this model at 262144 (MLX runtime pinned to 1.8.5).
        model_info:
          max_input_tokens: 262144
          max_output_tokens: 32768

        # ── FreeLLMAPI free-tier pool (GUL-184 / ADR-091) ──────────────
        # GUL-184 / ADR-091 (2026-10-26): free gpt-oss-120b pool in FreeLLMAPI
        # (GUL-182, route id `gpt-oss-120b` — a model group, not a provider).
        # A free route on purpose: no fallback of its own, and it must never
        # appear in any paid route's fallback chain. FreeLLMAPI fails over
        # between providers itself, so LiteLLM must not retry (num_retries 0).
        # Keep the name free of -go/-ollama suffixes, or
        # scripts/weekly-model-sync.py treats it as a catalogue route.
      - model_name: gpt-oss-120b-freellmapi
        litellm_params:
          model: openai/gpt-oss-120b
          api_base: "http://freellmapi.freellmapi.svc.cluster.local:3001/v1"
          api_key: "os.environ/FREELLMAPI_API_KEY"
          timeout: 150
          num_retries: 0

        # ── OpenCode Go subscription models (all with -go suffix) ──────
        # Line-up refreshed 2026-10-02 against the LIVE endpoint
        # (GET https://opencode.ai/zen/go/v1/models -> 36 ids), then every id
        # was probed with a minimal chat completion: 29 returned OK, 7 failed
        # and are deliberately NOT configured:
        #   gpt-6-luna, gpt-5.6-luna, grok-4.6, grok-4.7, minimax-m2.7:
        #     HTTP 400 ModelProtocolUnsupported on plain chat-completions
        #     (streaming too) - these need OpenCode-native request framing.
        #   muse-spark-1.2-contributor, muse-spark-1.3-contributor:
        #     HTTP 400 "This Go model trains on request data. Allow paid
        #     endpoints that train on request data in your workspace's
        #     Privacy settings" - not enabled without owner sign-off.
        # Removed stale routes (no longer on the endpoint):
        #   kimi-k2.5-go, glm-5-go, qwen3.5-plus-go, mimo-v2-pro-go,
        #   mimo-v2-omni-go, grok-4.5-go, hy3-preview-go (renamed hy3-go).
        #
        # SESSION-HEADER NORMALIZATION (2026-10-03, supersedes ADR-026):
        # the Go gateway enforces a stable per-conversation
        # `x-opencode-session` header on every chat request. LiteLLM does not
        # emit one and clients vary in what they send. A pre-call hook
        # (custom_callbacks.opencode_go_session_normalizer, mounted from the
        # litellm-session-callbacks ConfigMap) now resolves ONE session id per
        # conversation from whatever the client provides and injects it ONLY
        # when the client did not send the header itself. The previous static
        # fallback ("h2-litellm-fallback-session") was removed because config
        # extra_headers merge AFTER forwarded client headers and therefore
        # masked every real per-session id. See
        # docs/adr/adr-029-litellm-opencode-go-session-normalizer.md.
      - model_name: deepseek-flash-go
        litellm_params:
          model: openai/deepseek-flash
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: deepseek-v4-flash-go
        litellm_params:
          model: openai/deepseek-v4-flash
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: deepseek-v4-flash-vision-exp-go
        litellm_params:
          model: openai/deepseek-v4-flash-vision-exp
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: deepseek-v4-pro-go
        litellm_params:
          model: openai/deepseek-v4-pro
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: deepseek-v4.1-flash-go
        litellm_params:
          model: openai/deepseek-v4.1-flash
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: glm-5.1-go
        litellm_params:
          model: openai/glm-5.1
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: glm-5.2-go
        litellm_params:
          model: openai/glm-5.2
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: glm-5.3-go
        litellm_params:
          model: openai/glm-5.3
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: glm-5.3-flash-go
        litellm_params:
          model: openai/glm-5.3-flash
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: hy3-go
