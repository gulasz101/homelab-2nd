          model: openai/qwen3.6-plus
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: qwen3.7-max-go
        litellm_params:
          model: openai/qwen3.7-max
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: qwen3.7-plus-go
        litellm_params:
          model: openai/qwen3.7-plus
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
        # Bare alias for the native OpenCode Go model id. OpenCode's `opencode-go`
        # provider resolves model ids against its OWN catalogue and rejects an
        # unknown id BEFORE any HTTP call — so a lane configured with the
        # `-go`-suffixed alias fails instantly with "produced no assistant text"
        # and never reaches LiteLLM. The working H2 lane uses the bare
        # `deepseek-v4.1-flash` name, which is why this route exists for it.
        # Mirrors the deepseek pattern: bare name + `-go` alias, same upstream.
      - model_name: qwen3.8-flash
        litellm_params:
          model: openai/qwen3.8-flash
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: qwen3.8-flash-go
        litellm_params:
          model: openai/qwen3.8-flash
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
      - model_name: qwen3.8-max-go
        litellm_params:
          model: openai/qwen3.8-max
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
          # GUL-480: Pi (thinking: max) sends reasoning_effort, which LiteLLM
          # rejects for openai/qwen3.8-max with 400 UnsupportedParamsError before
          # the call goes upstream. qwen3.8-max reasons by default; drop the param.
          drop_params: true
      - model_name: space-bunny-free-go
        litellm_params:
          model: openai/space-bunny-free
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"
        # OpenChamber worker model. Named WITHOUT the -go suffix on purpose:
        # OpenChamber's OpenCode uses the NATIVE `opencode-go` provider, which
        # emits the real per-conversation `x-opencode-session` header. The
        # pre-call hook passes an existing header through untouched (it only
        # injects when the header is absent), and scoped forwarding in
        # litellm_settings.model_group_settings carries it to the Go endpoint.
        # NO config extra_headers here - they would clobber the client's real
        # per-session header (config extras merge last).
      - model_name: deepseek-v4.1-flash
        litellm_params:
          model: openai/deepseek-v4.1-flash
          api_base: "https://opencode.ai/zen/go/v1"
          api_key: "os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY"

      router_settings:
        # Fallback chain for the OpenChamber runner lanes (SOU-104 fix, 2026-10-15).
        # The Alibaba-hosted qwen3.8-flash behind the OpenCode Go gateway
        # intermittently rejects task texts with HTTP 400:
        #   [data_inspection_failed] InternalError.Algo.DataInspectionFailed:
        #   "Input text data may contain inappropriate content"
        # LiteLLM does NOT classify that error as ContentPolicyViolationError
        # (no pattern in exception_mapping_utils.py matches data_inspection_failed),
        # so it surfaces as a generic BadRequestError and ONLY the generic
        # `fallbacks` path can rescue it. Both mappings are set on purpose:
        #   - fallbacks            -> catches the observed BadRequestError(400)
        #   - content_policy_fallbacks -> catches a properly-classified CPV in case
        #     upstream/mapping changes ever surface it as such
        # deepseek-v4.1-flash lives on the SAME gateway and subscription key, so
        # cost profile and auth are unchanged. The OpenCode session pre-call hook
        # is fallback-safe: it injects x-opencode-session only when absent, and
        # the header already on the request kwargs is carried into the fallback
        # call untouched (deepseek-v4.1-flash is in OPENCODE_GO_UNSUFFIXED).
        # Scope: plain per-lane mappings, no wildcard - no other model's routing
        # behaviour changes. Fallback responses arrive labelled deepseek-v4.1-flash
        # while the client keeps its qwen3.8-flash model string; that is the
        # intended resilience semantics (see ADR-052).
        # 2026-10-17 (SOU-267): the same-gateway fallback proved useless against
        # an ACCOUNT-level wall. At 01:51:22Z the Zen Go workspace
        # (wrk_01KXTGFFFC4XBA5T9P8TVVQTB8) exhausted its WEEKLY usage limit:
        #   429 GoUsageLimitError 'Go usage limit exceeded' (limitName: weekly)
        # qwen3.8-flash 429'd and its fallback deepseek-v4.1-flash 429'd too -
        # same gateway, same subscription key, same weekly bucket. The
        # OpenChamber bridge translated the empty session into "produced no
        # assistant text" (runs 124-126 on SOU-223/523) and the SOU lane sat
        # dead for 5+ hours. Fix: every OpenCode Go lane terminates its chain
        # on gpt-oss-120b-openrouter - different vendor, different billing
        # account, immune to a Zen Go quota. Fallback traffic is rare (only
        # when BOTH Zen Go models fail) and rides Wojtek's OpenRouter credits;
        # quality drops for the affected turns but the session SURVIVES. See
        # ADR-068 (this) and ADR-063 (original same-account chain).
        # 2026-10-17 (ADR-069): the cross-account hop now tries the SAME model
        # on OpenRouter first (deepseek-v4.1-flash-openrouter), so a Go wall no
        # longer drops agent sessions to a weaker model; gpt-oss-120b-openrouter
        # stays as the last resort.
        # GUL-123 / ADR-085 (2026-10-24): OpenRouter left LiteLLM (free tiers now
        # live in FreeLLMAPI), so every chain ends at Ollama Cloud. Owner ruling:
        # LiteLLM never silently routes paid-tier traffic into free providers;
        # when Go AND Ollama are both walled, the caller gets the error. This
        # supersedes the cross-account OpenRouter tail of ADR-068/ADR-069.
        # GUL-184 / ADR-091 (2026-10-26): the free route
        # gpt-oss-120b-freellmapi is in no PAID chain below.
        # GUL-1045 (2026-11-09, owner ruling "no paid lane") narrows that rule
        # instead of breaking it: the bar is that a route the owner BUYS by the
        # token must not be silently downgraded to a free pool. A route already
        # living on the Ollama subscription allowance may fall back into the
        # free pool - that is the free lane rescuing the free lane, which is the
        # whole point of the chain added below. `gpt-oss-120b-ollama` is the only
        # source that gets this hop, and both sides carry num_retries 0.
        fallbacks:
        - {"qwen3.8-flash": ["deepseek-v4.1-flash", "deepseek-v4.1-flash-ollama"]}
        - {"deepseek-v4.1-flash": ["deepseek-v4.1-flash-ollama"]}
        - {"deepseek-v4.1-flash-go": ["deepseek-v4.1-flash-ollama"]}
        - {"qwen3.8-flash-go": ["deepseek-v4.1-flash-ollama"]}
        - {"hindsight-consolidation-go": ["deepseek-v4.1-flash-go", "deepseek-v4.1-flash-ollama"]}
        # GUL-783 (2026-11-02): the fleet's executor primary is
        # deepseek-v4.1-flash-1017-ollama (GUL-769) and it appeared in no chain at
        # all, as a source or as a target. So Ollama unloads the model, the
        # `:1017` snapshot tag vanishes on the next weekly model sync, or the
        # account gets walled, and every agent in the company gets a hard error on
        # its first call instead of a degraded answer. The same hole existed while
        # everything was pinned to `-1017-ds` (GUL-593); it just became the only
        # point of failure. Two hops, cheapest billing identity first:
        #   1. deepseek-v4.1-flash-ollama - same Ollama Cloud allowance and the
        #      unversioned tag of the same family, so it costs nothing extra and it
        #      rescues the realistic failure: the snapshot tag moves, one model id
        #      goes bad, or the model is unloaded. Measured 2026-11-02: it answers
        #      as itself and serves a forced tool call exactly as the primary does.
        #   2. deepseek-v4.1-flash-1017-ds - DeepSeek's own API on Wojtek's paid
        #      key (GUL-591), a different vendor AND a different balance, the only
        #      hop that survives an Ollama account wall. Measured 2026-11-02: it
        #      answers chat, and it serves a forced tool_choice ONLY when the
        #      caller asks for thinking off (`reasoning_effort: none`, pending ADR
        #      GUL-690); with thinking on the upstream rejects the tool_choice with
        #      400 "Thinking mode does not support this tool_choice". None of the
        #      executor lanes send `none` today, so in practice this hop rescues
        #      plain turns, and a 400 there is no worse than the hard failure it
        #      replaces. Paid traffic fires only when both Ollama routes are down
        #      and the GUL-662 balance guard pages the owner within the hour if it
        #      starts draining: a small leak beats a dead fleet at 09:00.
        #      ADR (pending: litellm-1017-route-has-a-fallback-chain).
        # The chain on `-1017-ds` is the same judgement backwards: if the paid key
        # errors, the balance empties, or the route is retired, the fleet drops
        # back onto the allowance it was moved onto (GUL-769) instead of going
        # dark. The terminal hop is the unversioned Ollama tag for the case where
        # the `:1017` tag itself is what broke.
        # gpt-oss-120b-freellmapi stays out of every PAID chain (ADR-091). Its
        # one entry is the GUL-1045 hop below, sourced from a route that is
        # already free to us.
        - {"deepseek-v4.1-flash-1017-ollama": ["deepseek-v4.1-flash-ollama", "deepseek-v4.1-flash-1017-ds"]}
        - {"deepseek-v4.1-flash-1017-ds": ["deepseek-v4.1-flash-1017-ollama", "deepseek-v4.1-flash-ollama"]}
        # GUL-1045 (2026-11-09): `gpt-oss-120b-ollama` is the reflect and
        # mental-model-refresh route (apps/hindsight/hindsight-helm-release.yaml)
        # and it had no chain at all, so ollama.com's weekly wall turned every
        # reflect into a 500 - the failure this whole ticket is about. One hop,
        # to the free pool:
        #
        #   - gpt-oss-120b-freellmapi, the same model on FreeLLMAPI. ADR-094 /
        #     GUL-787 excluded it because at 9,328 tokens it answered WITHOUT a
        #     tool call. Re-measured 2026-11-09 from the hindsight-api pod at
        #     refresh size (18,225-char prompt, 5,579 in-tokens, the real
        #     answer_as_document 6-tool schema): 200 in 0.9 s WITH the
        #     `search_observations` tool call, same as the Ollama route. The two
        #     probes differ in size and date, so treat the pool as proven at
        #     ~5.6k tokens and unproven above ~9k - a failed fallback leaves the
        #     caller exactly where the 429 would have, and the pool gets no
        #     retry from us (both entries num_retries 0).
        #   - No paid hop, deliberately: the owner ruled out a metered lane for
        #     these calls on 2026-11-09 (ADR-127 reversed). Adding `-ds` here
        #     would silently reintroduce the bill.
        # GUL-1446 (2026-11-13): reflect and the mental-model refresh left
        # `gpt-oss-120b-ollama` for `iceman-contributor-free-go`, because
        # ollama.com's weekly wall killed both lanes. The chain keeps the free
        # family first, then returns home so the lane comes back to the
        # subscription when the week resets:
        #   1. longcat-2.5-free-go - the other healthy free Go route (5/5 x 200,
        #      5.4-7.0 s, 0.6-1.0 s slower than iceman, and the tool call came
        #      back 4/5, so second). It also keeps prompts 0 days and does not
        #      train on them, which is why it is the one to reach for if the
        #      owner objects to iceman's training terms.
        #   2. gpt-oss-120b-ollama - back onto the subscription allowance once
        #      the weekly window clears. Its own hop to the pool still fires
        #      from there, so the ladder ends in the free pool as before.
        # Every side of every hop carries num_retries 0: one walled call is one
        # hop, never a ladder (GUL-1045).
        - {"iceman-contributor-free-go": ["longcat-2.5-free-go", "gpt-oss-120b-ollama"]}
        - {"gpt-oss-120b-ollama": ["gpt-oss-120b-freellmapi"]}
        # GUL-1431 (2026-11-12, owner ruling): local first, then the Ollama
        # subscription, then the paid DeepSeek API as the last resort. The
        # first hop fires every time a local image job holds the GPU slot.
        - {"qwen3.6-35b-a3b-local": ["deepseek-v4.1-flash-1017-ollama", "deepseek-v4.1-flash-ollama", "deepseek-v4.1-flash-1017-ds"]}
        content_policy_fallbacks:
        - {"qwen3.8-flash": ["deepseek-v4.1-flash", "deepseek-v4.1-flash-ollama"]}
        - {"deepseek-v4.1-flash": ["deepseek-v4.1-flash-ollama"]}

      litellm_settings:
        callbacks:
        - "prometheus"
          # Pre-call hook that normalizes the OpenCode Go session header.
          # Mounted from the litellm-session-callbacks ConfigMap at
          # /etc/litellm/custom_callbacks.py (loaded relative to the config
          # file by get_instance_fn).
        - "custom_callbacks.opencode_go_session_normalizer"
        require_auth_for_metrics_endpoint: false
        # Forward the client's own session headers upstream ONLY for models
        # routed to OpenCode Go (the only provider that needs them). `*-go`
        # matches every standard Go route; the bare name is the OpenChamber
        # worker's unsuffixed native route. Replaces the global
        # general_settings.forward_client_headers_to_llm_api flag (closes the
        # ADR-018 "when to revisit" item; see ADR-029).
        model_group_settings:
          forward_client_headers_to_llm_api:
          - "*-go"
          - "deepseek-v4.1-flash"
            # Fork lane (SOU). Same reasoning as deepseek-v4.1-flash above: the
            # OpenChamber worker's native opencode-go provider emits the real
            # per-conversation x-opencode-session header, but OpenCode resolves
            # model ids from ITS OWN catalogue, which knows the BARE name only -
            # a '-go'-suffixed alias never even produces a request. So the route
            # must be named bare AND scoped here, or the Go gateway rejects it
            # with MissingSessionID.
          - "qwen3.8-flash"

      general_settings:
        # master_key is also supplied via env var from the secret
        master_key: "os.environ/PROXY_MASTER_KEY"
        database_url: "os.environ/DATABASE_URL"
        # Client x-* header forwarding for the OpenCode Go routes is scoped in
        # litellm_settings.model_group_settings above, NOT global: client
        # headers must not leak to unrelated providers (Ollama/Gemini/Z.AI).
        # The pre-call hook is the primary source of the `x-opencode-session`
        # value; scoped forwarding is the belt-and-braces path for clients
        # that already send a real header (see ADR-029).
        # Restrict UI to admins only; combined with no UI_USERNAME/UI_PASSWORD
        # this hides the local login form, leaving only the SSO button
        ui_access_mode: "admin_only"

    # The chart creates a proxyConfigMap by default; leave it on
    proxyConfigMap:
      create: true

    migrationJob:
      enabled: false

    service:
      type: ClusterIP
      port: 4000

    ingress:
      enabled: false

    # Prometheus scraping via ServiceMonitor
    serviceMonitor:
      enabled: true
      labels:
        release: prometheus-stack
      interval: 15s
      scrapeTimeout: 10s

    # GUL-100 (2026-10-22): CPU request right-sized from 1 core to 200m.
    # The HelmRelease could not roll out: Flux's upgrade needs one SURGE pod
    # beside the running one (RollingUpdate, replicaCount 1), and `cpu: 1`
    # had no home on this cluster - homelab-2nd had ~0.2-0.6 core free,
    # t460 ~0.9, and arr-box (the only node with real CPU headroom) was
    # ~350 MiB short of memory for the 1Gi memory request. Result: a loop of
    # UpgradeFailed -> RollbackSucceeded -> new Pending pod -> UpgradeFailed
    # every ~5 min, so the GUL-97 route timeout never went live.
    # 200m is measured, not guessed: `kubectl top pod -n llm-hub` reports the
    # running proxy at ~75m CPU (1.4 GiB RSS) - a Python proxy that waits on
    # providers, so its CPU is bursty and small. The request only drives
    # scheduling and CFS share; the 2-core limit is unchanged, so bursts still
    # get a full core or more whenever the node has idle CPU. Memory request is
    # untouched (1Gi request / 4Gi limit) - memory was NOT the constraint on
    # the two nodes with CPU to spare.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    livenessProbe:
      path: /health/liveliness
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 5

    readinessProbe:
      path: /health/readiness
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

    startupProbe:
      path: /health/readiness
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 30

    # Pass the provider-key secrets into the pod as environment variables too
    environmentSecrets:
    - litellm-provider-keys
