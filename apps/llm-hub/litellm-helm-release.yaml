# LiteLLM Proxy HelmRelease
# - Central AI gateway with virtual keys, spend tracking, model routing.
# - Uses external Postgres via CloudNativePG (not chart-bundled Postgres).
# - Prometheus metrics enabled via ServiceMonitor.
# - Internal ClusterIP only; public ingress via dedicated Cloudflare Tunnel.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: llm-hub
spec:
  interval: 1h
  chart:
    spec:
      chart: litellm-helm
      # GUL-690: 1.85.7 -> 1.106.6. The old DeepSeek transform dropped
      # `thinking: {"type":"disabled"}` (and mapped reasoning_effort "none" to
      # no thinking field at all, which DeepSeek reads as thinking ON), so the
      # `-ds` route could never turn thinking off and refused forced tool calls
      # with 400 "Thinking mode does not support this tool_choice". Fixed
      # upstream; verified in the v1.106.6 transform source.
      version: "1.106.6"
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # DB connection pieces come from SOPS-encrypted secret
  - kind: Secret
    name: litellm-db-credentials
    valuesKey: externalConnectionString
    targetPath: db.url
  values:
    replicaCount: 1

    image:
      repository: ghcr.io/berriai/litellm-database
      pullPolicy: IfNotPresent
      # Pinned deliberately (GUL-690): chart version and image tag move together,
      # one bump per release, so the running binary is always the one the chart
      # was cut for.
      tag: "v1.106.6"

    nameOverride: "litellm"

    # Use our CNPG Postgres, not the bundled Bitnami one
    db:
      useExisting: true
      deployStandalone: false
      endpoint: litellm-db-rw.llm-hub.svc.cluster.local
      database: litellm
      # db.url is injected via valuesFrom above; username/password from secret
      secret:
        name: litellm-db-credentials
        usernameKey: username
        passwordKey: password
        endpointKey: host

    # Master key from SOPS-encrypted secret
    masterkeySecretName: "litellm-master-key"
    masterkeySecretKey: "master-key"

    # Provider API keys are injected via environmentSecrets below
    # and referenced in proxy_config with os.environ/<VAR>
    extraEnvVars:
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-master-key
          key: salt-key
      # OpenCode Go subscription provider (Zen Go endpoint)
    - name: OPENCODE_GO_SUBSCRIPTION_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-provider-keys
          key: OPENCODE_GO_SUBSCRIPTION_API_KEY
      # Local LM Studio model does not need a real API key; LiteLLM still
      # sends an Authorization header so give it a non-empty placeholder
    - name: DUMMY_API_KEY
      value: "lm-studio-local-dummy-key"
      # SSO via Generic OIDC (Authentik) — Admin UI login only
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: client_id
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: client_secret
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: authorization_endpoint
    - name: GENERIC_TOKEN_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: token_endpoint
    - name: GENERIC_USERINFO_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: litellm-oidc-client
          key: userinfo_endpoint
    - name: PROXY_BASE_URL
      value: "https://llm.voitech.dev"
      # Allowed email domains for SSO
    - name: ALLOWED_EMAIL_DOMAINS
      value: "voitech.dev"
      # Auto-redirect the UI login page straight to SSO (hides classic form)
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
      # Log the resolved session id and its source. Set to "0" to quiet it
      # once the wiring is proven; useful evidence during rollout.
    - name: OPENCODE_HOOK_DEBUG
      value: "1"

    # Pod template annotation used ONLY to force a rollout when the
    # litellm-session-callbacks ConfigMap changes. The callback module is
    # imported at LiteLLM startup, and the chart mounts it via subPath (which
    # does not update in place), so a ConfigMap-only change neither reloads the
    # module nor restarts the pod. BUMP THIS VALUE whenever custom_callbacks.py
    # changes, or the change will not take effect.
    podAnnotations:
      litellm.session-callbacks-revision: "3"
      # Provider keys come from the litellm-provider-keys Secret as env vars,
      # read only at pod start. BUMP THIS after rotating a key in
      # litellm-provider-keys.sops.yaml, or the pod keeps the old key.
      # rev 3 (GUL-591, 2026-10-29): DEEPSEEK_API_KEY added to the Secret.
      # `environmentSecrets: [litellm-provider-keys]` below injects every key
      # in that Secret under its own name, so a new key needs no extraEnvVars
      # entry - only this bump, or the running pod keeps the old env.
      litellm.provider-keys-revision: "3"

    # Pre-call hook that normalizes the OpenCode Go session header (ADR-029).
    # LiteLLM loads a callback named in litellm_settings.callbacks by file path
    # RELATIVE TO THE CONFIG FILE (get_instance_fn: dirname(config)/module.py),
    # and the chart mounts the config at /etc/litellm/config.yaml — so the
    # module MUST live at /etc/litellm/custom_callbacks.py. (PYTHONPATH does
    # not help here; the loader reads the file directly.)
    volumes:
    - name: litellm-session-callbacks
      configMap:
        name: litellm-session-callbacks
    volumeMounts:
    - name: litellm-session-callbacks
      mountPath: /etc/litellm/custom_callbacks.py
      subPath: custom_callbacks.py

    # proxy_config is rendered into a ConfigMap and mounted as /etc/litellm/config.yaml
    proxy_config:
      model_list:
      - model_name: beam-ollama
        litellm_params:
          model: openai/beam
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
          # GUL-581 / ADR (pending: agent-fleet-runs-on-ollama-routes): mirror of
          # beam-free-go (GUL-122). beam reasons by default, so the client's
          # reasoning_effort is dropped, not forwarded.
          drop_params: true
      - model_name: deepseek-v4-pro-0813-ollama
        litellm_params:
          model: openai/deepseek-v4-pro:0813
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: deepseek-v4.1-flash-1017-ollama
        litellm_params:
          model: openai/deepseek-v4.1-flash:1017
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
          # GUL-581 / ADR (pending: agent-fleet-runs-on-ollama-routes): this route
          # is the fleet's executor primary, and Pi (thinking: max) sends
          # reasoning_effort. Ollama Cloud accepts it, but LiteLLM rejects params
          # the openai provider does not declare, so declare it here instead of
          # silently dropping the thinking budget.
          allowed_openai_params:
          - reasoning_effort
        # ── DeepSeek direct API, same model, on Wojtek's own paid key (GUL-591) ──
        # Suffix `-ds` = DeepSeek's own API (api.deepseek.com), the same
        # convention `-ollama`/`-go` already use for which subscription pays.
        # The upstream id is NOT `deepseek-v4.1-flash:1017`: DeepSeek's API
        # advertises exactly two ids (verified live 2026-10-29, GET /models):
        #   deepseek-flash     -> name "DeepSeek-V4.1-Flash", 1,048,576 ctx
        #   deepseek-v4-pro    -> name "DeepSeek-V4-Pro"
        # and rejects everything else with 400 "The supported API model names
        # are deepseek-flash, deepseek-v4-pro". `:1017` is the Ollama Cloud
        # snapshot tag only, so the local route name keeps the 1017 label
        # (Wojtek's mental model) while the upstream id is deepseek-flash.
        # Using the native `deepseek/` provider, not `openai/` + api_base: it
        # carries DeepSeek's own params, so `reasoning_effort` (low|high|max)
        # maps to its thinking mode instead of being rejected as unknown
        # (ADR-036 note; see the -ollama sibling's allowed_openai_params).
      - model_name: mimo-v2.6-flash-ollama
        litellm_params:
          model: openai/mimo-v2.6-flash
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: mimo-v2.6-pro-ollama
        litellm_params:
          model: openai/mimo-v2.6-pro
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: iceman-contributor-free-go
        litellm_params:
          model: openai/iceman-contributor-free
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY
          # GUL-1446 (2026-11-13): Hindsight reflect + mental-model refresh
          # primary, off the walled `gpt-oss-120b-ollama`. Measured through this
          # router from the hindsight-api pod, with the real `hindsight-reflect`
          # key, at reflect size (16.7k in-tokens, forced `search_observations`
          # tool_choice): 5/5 x 200, tool_calls on all five, 3.2-5.7 s.
          # Upstream, same payload: 5/5 x 200, 4/5 with the tool call, 3.4-4.5 s.
          # It is a free Go model with its own "Unlimited" row in
          # docs/console/go, so it spends none of beam-free-go's allowance.
          # num_retries 0 and a 60 s cap: the caller gives up at 120 s
          # (HINDSIGHT_API_REFLECT_LLM_TIMEOUT), so a retry or a hang here would
          # eat the whole budget and the chain below would never fire.
          num_retries: 0
          timeout: 60
      - model_name: longcat-2.5-free-go
        litellm_params:
          model: openai/longcat-2.5-free
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY
          # GUL-1446: second hop of the reflect chain, and the one that does not
          # train on prompts (iceman does; longcat keeps 0 days retention -
          # docs/zen). Paid for it with tool-call rate: upstream 5/5 x 200 but
          # only 3/5 asked for the tool, 5.5-11 s. Note the id: ADR-113's
          # `longcat-2.5-preview-free-go` below points at `longcat-2.5-preview`,
          # which upstream now answers "Model is unavailable"; the shipped free
          # model is `longcat-2.5-free`.
          num_retries: 0
          timeout: 60
      - model_name: deepseek-v4.1-flash-1017-ds
        litellm_params:
          model: deepseek/deepseek-flash
          api_key: os.environ/DEEPSEEK_API_KEY
        model_info:
          max_input_tokens: 1048576
          max_output_tokens: 393216
      - model_name: minimax-m3.1-flash-ollama
        litellm_params:
          model: openai/minimax-m3.1-flash
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: mistral-large-4-ollama
        litellm_params:
          model: openai/mistral-large-4
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: muse-spark-open-ollama
        litellm_params:
          model: openai/muse-spark-open
          api_base: https://ollama.com/v1
          api_key: os.environ/OLLAMA_API_KEY
      - model_name: beam-free-go
        litellm_params:
          model: openai/beam-free
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY
          # GUL-122: Pi (thinking: max) sends reasoning_effort, which LiteLLM
          # rejects for openai/beam-free with 400 UnsupportedParamsError before
          # the call goes upstream. beam reasons by default; drop the param.
          drop_params: true
      - model_name: step-5-preview-go
        litellm_params:
          model: openai/step-5-preview
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY
      - model_name: minimax-m3.1-flash-go
        litellm_params:
          model: openai/minimax-m3.1-flash
          api_base: https://opencode.ai/zen/go/v1
          api_key: os.environ/OPENCODE_GO_SUBSCRIPTION_API_KEY
      - model_name: kimi-k2.7-code
        litellm_params:
          model: openai/kimi-k2.7-code
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: glm-5.2-ollama
        litellm_params:
          model: openai/glm-5.2
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: glm-5.3-ollama
        litellm_params:
          model: openai/glm-5.3
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
          # GUL-581 / ADR (pending: agent-fleet-runs-on-ollama-routes):
          # reviewer/verifier route; same reasoning_effort declaration as the
          # flash route above.
          allowed_openai_params:
          - reasoning_effort
      - model_name: glm-5.3-flash-ollama
        litellm_params:
          model: openai/glm-5.3-flash
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: glm-5.1-ollama
        litellm_params:
          model: openai/glm-5.1
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: kimi-k2.7-code-ollama
        litellm_params:
          model: openai/kimi-k2.7-code
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: kimi-k2.6-ollama
        litellm_params:
          model: openai/kimi-k2.6
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: kimi-k3-ollama
        litellm_params:
          model: openai/kimi-k3
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: minimax-m2.7-ollama
        litellm_params:
          model: openai/minimax-m2.7
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: minimax-m3-ollama
        litellm_params:
          model: openai/minimax-m3
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: deepseek-v4-pro-ollama
        litellm_params:
          model: openai/deepseek-v4-pro
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: deepseek-v4-flash-ollama
        litellm_params:
          model: openai/deepseek-v4-flash
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: deepseek-v4-flash-0731-ollama
        litellm_params:
          model: "openai/deepseek-v4-flash:0731"
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: deepseek-v4.1-flash-ollama
        litellm_params:
          model: openai/deepseek-v4.1-flash
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
            # Ollama Cloud accepts reasoning_effort; allow the openai provider to
            # forward it (LiteLLM blocks unknown params otherwise).
          allowed_openai_params:
          - reasoning_effort
      - model_name: qwen3.5-397b-ollama
        litellm_params:
          model: "openai/qwen3.5:397b"
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: gemma4-31b-ollama
        litellm_params:
          model: openai/gemma4:31b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: mistral-large-3-675b-ollama
        litellm_params:
          model: openai/mistral-large-3:675b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: nemotron-3-super-ollama
        litellm_params:
          model: openai/nemotron-3-super
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: nemotron-3-ultra-ollama
        litellm_params:
          model: openai/nemotron-3-ultra
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: nemotron-3-nano-30b-ollama
        litellm_params:
          model: openai/nemotron-3-nano:30b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: gpt-oss-20b-ollama
        litellm_params:
          model: openai/gpt-oss:20b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
      - model_name: gpt-oss-120b-ollama
        litellm_params:
          model: openai/gpt-oss:120b
          api_base: "https://ollama.com/v1"
          api_key: "os.environ/OLLAMA_API_KEY"
          # GUL-1045 (2026-11-09): this route is the one ollama.com walls with
          # "weekly usage limit", and it now has a fallback chain below. A
          # retry here would spend the walled allowance again before the hop,
          # which is exactly how 7,350 doomed calls happened in 25 h. One
          # attempt, then the router moves on.
          num_retries: 0

        # ── Qwen3.6-35B-A3B, the only model in LM Studio on the M1 Max (GUL-1431) ──
        # A MoE model: 35B parameters, about 3B active per token, so it is about
        # 5x faster than the dense Saluki 27B it replaced on 2026-11-13. GGUF
        # unsloth UD-IQ4_XS (17.7 GB) + mmproj-F16 (vision), llama.cpp engine.
        # LM Studio loads it as identifier `qwen3.6-35b-a3b` at 128k context,
        # 2 parallel slots, JIT auto-load OFF.
        # LAN IP pinned because pods cannot resolve `.local`; if the lease moves,
        # change it here (both entries) and in karakeep-prometheus-rules.yaml.
        #
        # Measured 2026-11-13 (pending ADR saluki-local-lane-and-gpu-slot):
        # ~53 tok/s output for one request, ~33 each for two; prompt reading
        # ~410-500 tok/s: 30k tokens in 71 s, 60k in 120 s, 99k in 241 s.
        # The MLX 4-bit build was tried first and rejected: Metal out-of-memory
        # on a 60k prompt at the default GPU limit, and a dead engine after it.
        #
        # The GPU slot (host/m1max/bin/gpu-slot.sh): a local image job unloads
        # the model (ideogram4: 20-25 min). LM Studio then answers every request
        # with a fast HTTP 400 "No models loaded", and the chain below moves the
        # call. With JIT off LM Studio also serves ANY model name with whatever
        # is loaded, so the upstream id here is a label, not a selector.
        #
        # Thinking is on by default. `reasoning_effort: none` turns it off on
        # the llama.cpp engine (measured), so it is declared, never dropped.
      - model_name: qwen3.6-35b-a3b-local
        litellm_params:
          model: openai/qwen3.6-35b-a3b
          api_base: "http://192.168.1.119:1234/v1"
          api_key: "os.environ/DUMMY_API_KEY"
          allowed_openai_params:
          - reasoning_effort
          timeout: 1800
          num_retries: 0
        model_info:
          max_input_tokens: 131072
          max_output_tokens: 32768
          supports_function_calling: true
          supports_vision: true
        # Karakeep's route: same model, thinking forced off at the route.
        # Karakeep sends ~1,200 tagging calls a day. No fallback on purpose:
        # image tagging needs vision, and Karakeep retries a failed job itself.
      - model_name: qwen3.6-35b-a3b-local-nothink
        litellm_params:
          model: openai/qwen3.6-35b-a3b
          api_base: "http://192.168.1.119:1234/v1"
          api_key: "os.environ/DUMMY_API_KEY"
          reasoning_effort: "none"
          allowed_openai_params:
          - reasoning_effort
          timeout: 900
          num_retries: 0
        model_info:
          max_input_tokens: 131072
          max_output_tokens: 8192
          supports_vision: true

        # ── FreeLLMAPI free-tier pool (GUL-184 / ADR-091) ──────────────
        # GUL-184 / ADR-091 (2026-10-26): free gpt-oss-120b pool in FreeLLMAPI
        # (GUL-182, route id `gpt-oss-120b` — a model group, not a provider).
        # A free route on purpose: no fallback of its own, and it must never
        # appear in any paid route's fallback chain. FreeLLMAPI fails over
        # between providers itself, so LiteLLM must not retry (num_retries 0).
        # Keep the name free of -go/-ollama suffixes, or
        # scripts/weekly-model-sync.py treats it as a catalogue route.
      - model_name: gpt-oss-120b-freellmapi
        litellm_params:
          model: openai/gpt-oss-120b
          api_base: "http://freellmapi.freellmapi.svc.cluster.local:3001/v1"
          api_key: "os.environ/FREELLMAPI_API_KEY"
          timeout: 150
          num_retries: 0

        # ── OpenCode Go subscription models (all with -go suffix) ──────
        # Line-up refreshed 2026-10-02 against the LIVE endpoint
        # (GET https://opencode.ai/zen/go/v1/models -> 36 ids), then every id
        # was probed with a minimal chat completion: 29 returned OK, 7 failed
        # and are deliberately NOT configured:
        #   gpt-6-luna, gpt-5.6-luna, grok-4.6, grok-4.7, minimax-m2.7:
        #     HTTP 400 ModelProtocolUnsupported on plain chat-completions
        #     (streaming too) - these need OpenCode-native request framing.
        #   muse-spark-1.2-contributor, muse-spark-1.3-contributor:
        #     HTTP 400 "This Go model trains on request data. Allow paid
        #     endpoints that train on request data in your workspace's
        #     Privacy settings" - not enabled without owner sign-off.
        # Removed stale routes (no longer on the endpoint):
        #   kimi-k2.5-go, glm-5-go, qwen3.5-plus-go, mimo-v2-pro-go,
        #   mimo-v2-omni-go, grok-4.5-go, hy3-preview-go (renamed hy3-go).
        #
        # SESSION-HEADER NORMALIZATION (2026-10-03, supersedes ADR-026):
        # the Go gateway enforces a stable per-conversation
        # `x-opencode-session` header on every chat request. LiteLLM does not
        # emit one and clients vary in what they send. A pre-call hook
        # (custom_callbacks.opencode_go_session_normalizer, mounted from the
        # litellm-session-callbacks ConfigMap) now resolves ONE session id per
        # conversation from whatever the client provides and injects it ONLY
        # when the client did not send the header itself. The previous static
        # fallback ("h2-litellm-fallback-session") was removed because config
        # extra_headers merge AFTER forwarded client headers and therefore
        # masked every real per-session id. See
        # docs/adr/adr-029-litellm-opencode-go-session-normalizer.md.
      - model_name: deepseek-flash-go
        litellm_params:
          model: openai/deepseek-flash
          api_base: "https://opencode.ai/zen/go/v1"
