apiVersion: batch/v1
kind: CronJob
metadata:
  name: openwebui-model-tools-provisioner
  namespace: llm-hub
  labels:
    app.kubernetes.io/name: openwebui-model-tools-provisioner
    app.kubernetes.io/part-of: llm-hub
spec:
  schedule: 10 * * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
          - name: fetch-models
            image: python:3.13-alpine
            command:
            - /bin/sh
            - /scripts/provision.sh
            env:
            - name: LITELLM_URL
              value: http://litellm.llm-hub.svc.cluster.local:4000
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: shared
              mountPath: /shared
          containers:
          - name: apply-sql
            image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
            command:
            - /bin/sh
            - /scripts/provision.sh
            env:
            - name: SKIP_FETCH
              value: '1'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-db-credentials
                  key: databaseUrl
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: shared
              mountPath: /shared
          volumes:
          - name: scripts
            configMap:
              name: openwebui-model-tools-provisioner
              defaultMode: 493
          - name: shared
            emptyDir: {}
