---
# CronJob that gives EVERY LiteLLM chat model the Hindsight MCP tool servers as default
# tools in Open WebUI. Companion to litellm-key-provisioner (same reconcile pattern): the
# model list is not static, so the workspace-model override rows are reconciled hourly,
# not hand-seeded. Script: openwebui-model-tools-provisioner-configmap.yaml (provision.sh).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openwebui-model-tools-provisioner
  namespace: llm-hub
  labels:
    app.kubernetes.io/name: openwebui-model-tools-provisioner
    app.kubernetes.io/part-of: llm-hub
spec:
  schedule: "10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: provisioner
              # CNPG postgres image: psql for the Open WebUI DB + python3 for the LiteLLM call.
              image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
              command:
                - /bin/sh
                - /scripts/provision.sh
              env:
                - name: LITELLM_URL
                  value: "http://litellm.llm-hub.svc.cluster.local:4000"
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-master-key
                      key: master-key
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: openwebui-db-credentials
                      key: databaseUrl
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: openwebui-model-tools-provisioner
                defaultMode: 0755