---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shlink-resource-alerts
  namespace: shlink
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: shlink.resources
      interval: 30s
      rules:
        - alert: ShlinkCPUAboveRequest
          expr: |
            sum by (pod, container, namespace) (
              rate(container_cpu_usage_seconds_total{namespace="shlink", container!=""}[5m])
            ) >
            sum by (pod, container, namespace) (
              kube_pod_container_resource_requests{namespace="shlink", resource="cpu", container!=""}
            )
          for: 5m
          labels:
            severity: warning
            namespace: shlink
          annotations:
            summary: "shlink/{{ $labels.pod }} CPU above request"
            description: "{{ $labels.pod }}/{{ $labels.container }} CPU usage exceeds its request for more than 5 minutes."
        - alert: ShlinkMemoryAbove85PercentLimit
          # Fires on real memory pressure (85% of the cgroup limit) instead of
          # crossing the low request floor, which fired constantly for
          # shlink-backend (128Mi request vs 512Mi limit).
          expr: |
            100 * sum by (pod, container, namespace) (
              container_memory_working_set_bytes{namespace="shlink", container!=""}
            ) / sum by (pod, container, namespace) (
              kube_pod_container_resource_limits{namespace="shlink", resource="memory", container!=""}
            ) > 85
          for: 5m
          labels:
            severity: warning
            namespace: shlink
          annotations:
            summary: "shlink/{{ $labels.pod }} memory above 85% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} memory is above 85% of its limit for more than 5 minutes."
        - alert: ShlinkCPUAbove90PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              rate(container_cpu_usage_seconds_total{namespace="shlink", container!=""}[5m])
            ) / sum by (pod, container, namespace) (
              container_spec_cpu_quota{namespace="shlink", container!=""} / container_spec_cpu_period{namespace="shlink", container!=""}
            ) > 90
          for: 5m
          labels:
            severity: critical
            namespace: shlink
          annotations:
            summary: "shlink/{{ $labels.pod }} CPU above 90% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} CPU is above 90% of its limit for more than 5 minutes."
        - alert: ShlinkMemoryAbove90PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              container_memory_working_set_bytes{namespace="shlink", container!=""}
            ) / sum by (pod, container, namespace) (
              kube_pod_container_resource_limits{namespace="shlink", resource="memory", container!=""}
            ) > 90
          for: 5m
          labels:
            severity: critical
            namespace: shlink
          annotations:
            summary: "shlink/{{ $labels.pod }} memory above 90% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} memory is above 90% of its limit for more than 5 minutes."
