---
# LAN-only NodePort Service for OpenViking.
# Reachable inside the network on 192.168.1.179:30193.
# No public ingress / Cloudflare tunnel.
apiVersion: v1
kind: Service
metadata:
  name: openviking
  namespace: openviking
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: openviking
  ports:
    - name: http
      port: 1933
      targetPort: 1933
      nodePort: 30193
