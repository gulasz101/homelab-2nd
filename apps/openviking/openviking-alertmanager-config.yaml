---
# AlertmanagerConfig: route openviking namespace alerts to the Mattermost webhook.
# The webhook secret must live in the same namespace as this AlertmanagerConfig.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: openviking-mattermost-alerts
  namespace: openviking
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: openviking-mattermost
    matchers:
      - name: namespace
        value: openviking
        matchType: "="
  receivers:
    - name: openviking-mattermost
      slackConfigs:
        - apiURL:
            name: openviking-mattermost-webhook-url
            key: url
          sendResolved: true
          title: "{{ .CommonAnnotations.summary }}"
          text: "{{ .CommonAnnotations.description }}"
          fallback: "openviking alert: {{ .CommonAnnotations.summary }}"
