---
# OpenViking server deployment.
# - Single-replica, Recreate strategy (single-node k3s, no hostPort conflicts).
# - Live workspace on local-path PVC; config rendered from template via init container.
# - Embeddings via in-cluster Ollama GPU service; VLM via in-cluster LiteLLM proxy.
# - Internal-only NodePort Service on 192.168.1.179:30193.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: openviking
  labels:
    app.kubernetes.io/name: openviking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openviking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openviking
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      initContainers:
        - name: render-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /app/.openviking
              cat > /app/.openviking/ov.conf <<EOF
              {
                "server": {
                  "host": "0.0.0.0",
                  "port": 1933,
                  "root_api_key": "${OPENVIKING_ROOT_API_KEY}"
                },
                "storage": {
                  "workspace": "/app/.openviking/workspace"
                },
                "log": {
                  "level": "INFO",
                  "output": "stdout"
                },
                "embedding": {
                  "dense": {
                    "api_base": "http://ollama-embeddings.gpu-embedding.svc.cluster.local:11434/v1",
                    "api_key": "local",
                    "provider": "openai",
                    "dimension": 768,
                    "model": "nomic-embed-text"
                  }
                },
                "vlm": {
                  "api_base": "http://litellm.llm-hub.svc.cluster.local:4000/v1",
                  "api_key": "${OPENVIKING_VLM_API_KEY}",
                  "provider": "openai",
                  "extra_headers": {
                    "User-Agent": "OpenViking/1.0"
                  },
                  "model": "mistral-3.5-middle",
                  "timeout": 3600,
                  "max_concurrent": 64
                }
              }
              EOF
          env:
            - name: OPENVIKING_ROOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-root-api-key
                  key: root-api-key
            - name: OPENVIKING_VLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-vlm-api-key
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /app/.openviking
      containers:
        - name: server
          image: ghcr.io/volcengine/openviking@sha256:4bca8fa5dadf363d84c3eab1f7bb446f0b69587cd0dc059aad4c87382ee832b3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1933
              protocol: TCP
          env:
            - name: OPENVIKING_CONFIG_FILE
              value: /app/.openviking/ov.conf
          volumeMounts:
            - name: workspace
              mountPath: /app/.openviking/workspace
            - name: config
              mountPath: /app/.openviking
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: openviking-workspace
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
