---
# OpenViking server deployment.
# - Single-replica, Recreate strategy (single-node k3s, no hostPort conflicts).
# - Live workspace on local-path PVC; config rendered from template via init container.
# - Embeddings via in-cluster Ollama GPU service; VLM via in-cluster LiteLLM proxy.
# - Internal-only NodePort Service on 192.168.1.179:30193.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking
  namespace: openviking
  labels:
    app.kubernetes.io/name: openviking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openviking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openviking
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      initContainers:
        - name: render-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /app/.openviking
              envsubst < /tmpl/ov.conf > /app/.openviking/ov.conf
          env:
            - name: OPENVIKING_ROOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-root-api-key
                  key: root-api-key
            - name: OPENVIKING_VLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openviking-vlm-api-key
                  key: api-key
          volumeMounts:
            - name: config-template
              mountPath: /tmpl
            - name: config
              mountPath: /app/.openviking
      containers:
        - name: server
          image: ghcr.io/volcengine/openviking@sha256:07b01246fda12ca9ca6b5d7e21add2d2d9673da805ca4f09ec8d026a878dc7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1933
              protocol: TCP
          env:
            - name: OPENVIKING_CONFIG_FILE
              value: /app/.openviking/ov.conf
          volumeMounts:
            - name: workspace
              mountPath: /app/.openviking/workspace
            - name: config
              mountPath: /app/.openviking
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: openviking-workspace
        - name: config
          emptyDir: {}
        - name: config-template
          configMap:
            name: openviking-config
        - name: tmp
          emptyDir: {}
