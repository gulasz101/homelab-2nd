  # ============================================================
  # Mail-Archiver (H2-145 / ST3+ST4) — mail-archive.voitech.dev
  # Upstream ships an image and docs, no Helm chart, so raw manifests delivered by
  # Flux are the sanctioned last resort (guardrail 2); justified in the tracking note
  # and ADR-037. This group is the whole package: namespace, CNPG cluster with its
  # WAL/base backups to OMV MinIO (ST3), and the app itself — DataProtection keyring
  # on OMV NFS, Deployment, Service and NetworkPolicy (ST4).
  #
  # Wiring ruling (H2-148): only the secrets this group's own manifests consume are
  # listed here. mailarchiver-app-secrets.sops.yaml belongs to the app Deployment —
  # ST4 wires it together with its consumer, so the manifest list still mirrors
  # reality. The restore drill and the runtime evidence script in
  # apps/mail-archiver/drill/ are deliberately NOT listed: they are run by hand,
  # never reconciled.
  # ============================================================
  - mail-archiver/namespace.yaml
  # SOPS-encrypted secrets consumed by this package
  - mail-archiver/mailarchiver-db-credentials.sops.yaml
  - mail-archiver/mailarchiver-minio-backup-creds.sops.yaml
