---
# AlertmanagerConfig: route gpu-embedding namespace alerts to the Mattermost webhook.
# The matching webhook secret lives in the same namespace and is referenced below.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: gpu-embedding-mattermost-alerts
  namespace: gpu-embedding
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: gpu-embedding-mattermost
    matchers:
      - name: namespace
        value: gpu-embedding
        matchType: "="
  receivers:
    - name: gpu-embedding-mattermost
      slackConfigs:
        - apiURL:
            name: gpu-embedding-mattermost-webhook-url
            key: url
          sendResolved: true
          title: |-
            [{{ .Status | toUpper }}] {{ .CommonLabels.namespace | default "homelab" }}: {{ len .Alerts.Firing }} firing{{ if .Alerts.Resolved }}, {{ len .Alerts.Resolved }} resolved{{ end }}
          text: |-
            {{ range .Alerts.Firing }}- {{ .Labels.alertname }}: {{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}
            {{ end }}{{ range .Alerts.Resolved }}- {{ .Labels.alertname }}: {{ .Annotations.summary }} (resolved)
            {{ end }}
          fallback: |-
            {{ .CommonLabels.namespace | default "homelab" }} alert: {{ len .Alerts.Firing }} firing{{ if .Alerts.Resolved }}, {{ len .Alerts.Resolved }} resolved{{ end }}
