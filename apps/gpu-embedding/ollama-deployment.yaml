---
# GPU-accelerated Ollama embedding server.
# Runs in the shared gpu-embedding namespace so other services can reuse it.
# Since the 2026-11-12 node move (ADR-134): mimir's Radeon Vega 7 iGPU via
# Ollama's Vulkan backend. The GPU comes from the AMD device plugin
# (amd.com/gpu), so the pod is NOT privileged and mounts no host /dev.
# Measured on mimir: 36.6 ms/embed and 35.4 embeds/s (batch 64), vs 101 ms and
# 10.2/s on 4 CPU cores. The old GTX 970M left with the Clevo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embeddings
  namespace: gpu-embedding
  labels:
    app.kubernetes.io/name: ollama-embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-embeddings
    spec:
      # mimir holds the ollama-models local-path volume and the AMD iGPU.
      nodeSelector:
        kubernetes.io/hostname: mimir
        feature.node.kubernetes.io/pci-1002.present: "true"
      initContainers:
        - name: pull-model
          image: ollama/ollama:0.40.12
          # Only pull if the model manifest is missing. Avoid starting 'ollama serve'
          # in init (historic: it hung on Maxwell GPU detection on the Clevo).
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MODEL_DIR="/root/.ollama/models/manifests/registry.ollama.ai/library/nomic-embed-text"
              if [ -f "${MODEL_DIR}/latest" ]; then
                echo "nomic-embed-text already present; skipping pull."
              else
                echo "Pulling nomic-embed-text..."
                ollama pull nomic-embed-text
                echo "Model pulled."
              fi
          env:
            - name: HOME
              value: "/root"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      containers:
        - name: ollama
          image: ollama/ollama:0.40.12
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: HOME
              value: "/root"
            # Vulkan backend (RADV, Mesa) - works on the Renoir iGPU where ROCm does not
            # officially support gfx90c.
            - name: OLLAMA_VULKAN
              value: "1"
            # Ollama >= 0.40 drops integrated GPUs by default ("dropping integrated GPU;
            # to enable, set OLLAMA_IGPU_ENABLE=1"). The iGPU is the whole point here.
            - name: OLLAMA_IGPU_ENABLE
              value: "1"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
              amd.com/gpu: 1
            limits:
              cpu: "4"
              memory: 4Gi
              amd.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models
