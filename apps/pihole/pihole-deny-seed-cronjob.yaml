---
# Pi-hole deny-entry seeder (GUL-392 hardening) — closes the ADR-022/038 rebuild gap.
#
# The curfew CronJobs converge GROUP MEMBERSHIP of the entries carrying a marker
# comment; they deliberately refuse to arm an empty set. That left the entries
# themselves existing only in the live FTL database — imperative state outside Git,
# lost on any rebuild. This job makes them declarative:
#
#   apps/pihole/pihole-deny-seeds.yaml  = the source of truth (37 entries)
#   pihole-deny-seed (this job, 05:00)  = creates missing entries, repairs a mangled
#                                         marker comment or enabled flag, never
#                                         touches groups of an existing entry, never
#                                         deletes.
#
# 05:00 Europe/Warsaw = after the 21:00-08:00 curfew window's last state change is
# irrelevant and before the 07:00/08:00 releases, so a repair lands before the
# daytime state is settled. Re-running by hand is safe and idempotent:
#   kubectl -n pihole create job --from=cronjob/pihole-deny-seed seed-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pihole-deny-seed
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole-deny-seed
    app.kubernetes.io/part-of: pihole-family-shield
spec:
  schedule: "0 5 * * *"
  timeZone: Europe/Warsaw
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pihole-deny-seed
        spec:
          restartPolicy: OnFailure
          containers:
            - name: deny-seed
              image: python@sha256:f3ebba2ace255c93267a0278da88c7f1044432991abc4e6ad20d22e34dd0f8ee
              imagePullPolicy: IfNotPresent
              command: ["python3", "/scripts/pihole_curfew.py", "seed"]
              env:
                - name: PIHOLE_API
                  value: "http://192.168.1.179:80/api"
                - name: PIHOLE_SEED_FILE
                  value: "/seeds/denies.json"
                - name: PIHOLE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pihole-app-secrets
                      key: password
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: seeds
                  mountPath: /seeds
          volumes:
            - name: script
              configMap:
                name: pihole-curfew-script
            - name: seeds
              configMap:
                name: pihole-deny-seeds
