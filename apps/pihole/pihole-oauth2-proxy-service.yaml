---
apiVersion: v1
kind: Service
metadata:
  name: pihole-oauth2-proxy
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole-oauth2-proxy
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: pihole-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
      nodePort: 30810
      protocol: TCP
