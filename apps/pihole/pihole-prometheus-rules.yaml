---
# PrometheusRule for the pihole namespace.
# Pi-hole down == home offline, so pod-down is critical by design.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pihole-resource-alerts
  namespace: pihole
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: pihole.availability
      interval: 1m
      rules:
        - alert: PiholePodNotReady
          expr: |
            kube_pod_status_ready{namespace="pihole", condition="true"} == 0
            unless on (namespace, pod) kube_pod_owner{namespace="pihole", owner_kind="Job"}
          for: 5m
          labels:
            severity: critical
            namespace: pihole
          annotations:
            summary: "pihole pod not ready — home DNS may be down"
            description: "The Pi-hole pod in namespace pihole has been not-ready for 5m. OPNsense :53 redirect points at this pod; if it stays down, flip the break-glass runbook (H2-74)."

        - alert: PiholeMetricsTargetDown
          expr: |
            up{namespace="pihole", container="exporter"} == 0
          for: 10m
          labels:
            severity: warning
            namespace: pihole
          annotations:
            summary: "pihole exporter target down"
            description: "Prometheus cannot scrape the Pi-hole exporter for 10m."

        - alert: PiholeMemoryAbove80PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              container_memory_working_set_bytes{namespace="pihole", container!=""}
            )
            /
            sum by (pod, container, namespace) (
              kube_pod_container_resource_limits{namespace="pihole", resource="memory", container!=""}
            ) > 80
          for: 15m
          labels:
            severity: warning
            namespace: pihole
          annotations:
            summary: "pihole/{{ $labels.pod }} memory above 80% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} memory is above 80% of its limit for more than 15 minutes."

        - alert: PiholeRestartStorm
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="pihole"}[1h]) > 3
          for: 5m
          labels:
            severity: critical
            namespace: pihole
          annotations:
            summary: "pihole container restart storm"
            description: "{{ $labels.pod }}/{{ $labels.container }} restarted >3 times in the last hour."

        # H2-75/H2-76: curfew CronJobs (main pair pihole-curfew-* and Sylwia's
        # Instagram-only pair pihole-s-ig-*). A failed job means the family devices
        # either stay blocked in the morning or stay unfiltered at night — both are
        # design violations. kube metrics label job_name.
        - alert: PiholeCurfewJobFailed
          expr: |
            kube_job_status_failed{namespace="pihole", job_name=~"pihole-(curfew|s-ig)-(enable|disable)-.*"} > 0
          for: 5m
          labels:
            severity: critical
            namespace: pihole
          annotations:
            summary: "Pi-hole curfew job {{ $labels.job_name }} failed"
            description: "A Pi-hole curfew CronJob ({{ $labels.job_name }}) failed. Check the job pod logs (FTL API auth, group PUT, gravity, or the refuse-to-arm-nothing guard). Family devices are on the wrong blocking schedule until it succeeds. Manual re-run: kubectl -n pihole create job --from=cronjob/<name> manual-curfew"

        # GUL-392: the deny-entry seeder. If this fails, the declarative seed list
        # (pihole-deny-seeds ConfigMap) and the live FTL database have diverged —
        # meaning enforcement could be missing entries after a rebuild, or the
        # markers the curfew reconcilers key on are wrong.
        - alert: PiholeDenySeedJobFailed
          expr: |
            kube_job_status_failed{namespace="pihole", job_name=~"pihole-deny-seed-.*"} > 0
          for: 5m
          labels:
            severity: critical
            namespace: pihole
          annotations:
            summary: "Pi-hole deny seeder {{ $labels.job_name }} failed"
            description: "pihole-deny-seed failed: the declarative seed list and the live FTL deny entries are out of sync (API auth, a rejected PUT, gravity, or the verification read-back). Check the pod logs, then re-run: kubectl -n pihole create job --from=cronjob/pihole-deny-seed seed-now"

        # GUL-712: the client-roster seeder. A failure means the roster in Git and
        # the live FTL client table have diverged — after a rebuild that means
        # family devices are sitting in group 0 with no curfew at all.
        - alert: PiholeClientSeedJobFailed
          expr: |
            kube_job_status_failed{namespace="pihole", job_name=~"pihole-client-seed-.*"} > 0
          for: 5m
          labels:
            severity: critical
            namespace: pihole
          annotations:
            summary: "Pi-hole client-roster seeder {{ $labels.job_name }} failed"
            description: "pihole-client-seed failed: the roster in apps/pihole/pihole-clients-seeds.yaml and the live FTL client table are out of sync (API auth, a rejected POST/PUT, or the verification read-back). Devices may be in the wrong group, which means the 21:00-08:00 curfew may not be protecting them. Check the pod logs, then re-run: kubectl -n pihole create job --from=cronjob/pihole-client-seed seed-now"

        # GUL-712: the weekly roster audit exits 2 when a seeded row that carries a
        # required curfew group has vanished or changed groups — that is a MAC
        # rotation (Apple rotates private Wi-Fi MACs) or a hand edit, and either way
        # the device silently falls out of the curfew.
        - alert: PiholeClientAuditDrift
          expr: |
            kube_job_status_failed{namespace="pihole", job_name=~"pihole-client-audit-.*"} > 0
          for: 5m
          labels:
            severity: warning
            namespace: pihole
          annotations:
            summary: "Pi-hole roster audit {{ $labels.job_name }} reported drift"
            description: "pihole-client-audit failed: either a seeded client row in a required curfew group (default 10) is missing or has changed groups, or the report could not be posted to Mattermost. The audit report is in the pod logs and the channel. Re-run: kubectl -n pihole create job --from=cronjob/pihole-client-audit audit-now"
