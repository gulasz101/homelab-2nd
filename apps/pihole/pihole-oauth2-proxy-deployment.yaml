---
# oauth2-proxy enforces Authentik SSO in front of the Pi-hole admin UI.
# LAN-only NodePort 30810 -> oauth2-proxy -> pihole-web (ClusterIP).
# NO Cloudflare tunnel: the DNS control plane must never be publicly reachable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-oauth2-proxy
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole-oauth2-proxy
    app.kubernetes.io/component: sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole-oauth2-proxy
        app.kubernetes.io/component: sso
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-2nd
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.voitech.dev/application/o/pi-hole/
            - --redirect-url=http://192.168.1.179:30810/oauth2/callback
            - --email-domain=*
            - --upstream=http://pihole-web.pihole.svc.cluster.local:80/
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            # LAN-only plain HTTP access: cookie-secure must be off or the
            # browser drops the session cookie on http://. Acceptable on the
            # home network; the NodePort is not reachable from the internet.
            - --cookie-secure=false
            - --cookie-expire=168h
            - --cookie-refresh=1h
            - --skip-provider-button=true
            - --scope=openid email profile offline_access
            - --cookie-csrf-per-request=true
            # Bound the per-request CSRF cookie pile (H2-102): uniquely-named 15-min
            # cookies accumulate on polling clients and breach header-size limits
            # (HTTP 431). Oldest beyond the limit are auto-cleared on each mint.
            - --cookie-csrf-per-request-limit=3
            - --disable-keep-alives
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pihole-oauth2-proxy
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pihole-oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pihole-oauth2-proxy
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
