---
# Pi-hole CLIENT ROSTER seeds (GUL-712) — the other half of the family-shield curfew.
#
# WHY THIS EXISTS
#   Every `client -> group` row lived only in the live FTL database. The deny-entry
#   seeder (pihole-deny-seeds) restores the *lists*, the CronJobs restore the
#   *schedule*, and the groups are seeded by the chart — but on a rebuild every
#   device falls back to group 0 (Default, porn list only). The 21:00-08:00
#   Instagram curfew then protects nobody, silently. This file is the roster in Git.
#
# WHAT THE SEEDER DOES (pihole-client-seed, 05:10 Europe/Warsaw)
#   - creates any missing row with the comment and groups below;
#   - repairs the comment and the groups of an existing row;
#   - never deletes: a live row absent from this file is printed and left alone;
#   - refuses to run on an empty list (an empty roster would mean "everyone is
#     unregistered", the exact blast radius this file exists to remove);
#   - read-backs every row afterwards. No gravity/restartdns: client matching is
#     read live from the FTL database.
#
# GROUPS ARE NOT A DAYTIME BASELINE — and that is deliberate.
#   The curfew modes move the groups of DENY ENTRIES (enable -> [9,10], disable ->
#   [9]); they never touch a client row. A device in group 10 keeps receiving the
#   S-IG blocks for exactly as long as the entry carries group 10. So repairing a
#   client's groups at 05:10 cannot disarm a curfew armed between 21:00 and 08:00.
#   The groups here are the device CLASSIFICATION, valid at any hour:
#     9  = W-wojtek-247      Wojtek's devices, curfew 21:00-08:00
#     10 = S-sylwia-curfew   Sylwia's devices, curfew 21:00-08:00
#     11 = P-permissive      permissive (same porn list as Default; NO curfew)
#     12 = INFRA-exempt      infrastructure: never filtered, never curfewed
#
# EDITING: change rows here, commit, let Flux apply it. The next 05:10 run (or
#   kubectl -n pihole create job --from=cronjob/pihole-client-seed seed-now)
#   converges the live API to this file. Apple rotates private Wi-Fi MACs, so a
#   stale row is normal — the weekly audit (pihole-client-audit) is the detector,
#   not this file's memory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-client-seeds
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole-client-seed
    app.kubernetes.io/part-of: pihole-family-shield
data:
