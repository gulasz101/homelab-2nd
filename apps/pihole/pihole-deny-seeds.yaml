---
# Pi-hole deny-entry seeds (H2-72 / GUL-392 hardening).
#
# WHY THIS EXISTS
#   Every deny entry on the live Pi-hole was created imperatively through the FTL
#   API. The curfew CronJobs (pihole-curfew-*, pihole-s-ig-*) are drift-healers, not
#   seeders — their `enable` mode deliberately refuses to arm an empty set. So a
#   cluster rebuild restored the *schedules* but not the *entries they manage*, and
#   every curfew job then failed loudly until someone re-seeded by hand. Enforcement
#   state living outside Git is a GitOps violation (guardrail 1).
#
# WHAT THE SEEDER DOES (pihole-deny-seed CronJob, 05:00 Europe/Warsaw)
#   - creates any missing deny entry (exact or regex) with the comment marker and
#     enabled flag from this file, at the daytime group set recorded here;
#   - repairs a mangled marker comment or enabled flag on an existing entry;
#   - never touches group membership of an existing entry — that belongs to the
#     curfew reconcilers (enable -> [9,10], disable -> [9]);
#   - never deletes anything;
#   - gravity + restartdns when it changed something, then read-back verification.
#
# EDITING: change entries here, commit, and Flux applies it. The next 05:00 run (or a
# manual `kubectl -n pihole create job --from=cronjob/pihole-deny-seed seed-now`)
# converges the live API to this file. Groups in this file are the daytime baseline.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-deny-seeds
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole-deny-seed
    app.kubernetes.io/part-of: pihole-family-shield
data:
  denies.json: |
    [
      {
        "kind": "exact",
        "domain": "facebook.com",
        "groups": [
          9
        ],
        "comment": "W/S block",
        "enabled": true
