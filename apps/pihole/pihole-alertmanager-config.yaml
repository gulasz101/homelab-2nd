---
# AlertmanagerConfig: route pihole namespace alerts to the Mattermost webhook.
# The webhook secret must live in the same namespace as this AlertmanagerConfig.
# The hook itself is the same Mattermost incoming webhook as the observability one
# (identical value, proven live 2026-11-01). A 403 from a Python client is
# Cloudflare blocking the TLS fingerprint, not a dead hook: probe with curl.
# See docs/runbooks/alert-delivery-verification.md.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: pihole-mattermost-alerts
  namespace: pihole
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: pihole-mattermost
    matchers:
      - name: namespace
        value: pihole
        matchType: "="
  receivers:
    - name: pihole-mattermost
      slackConfigs:
        - apiURL:
            name: pihole-mattermost-webhook-url
            key: url
          sendResolved: true
          title: |-
            [{{ .Status | toUpper }}] {{ .CommonLabels.namespace }}: {{ len .Alerts.Firing }} firing{{ if .Alerts.Resolved }}, {{ len .Alerts.Resolved }} resolved{{ end }}
          text: |-
            {{ range .Alerts.Firing }}- {{ .Labels.alertname }}: {{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}
            {{ end }}{{ range .Alerts.Resolved }}- {{ .Labels.alertname }}: {{ .Annotations.summary }} (resolved)
            {{ end }}
