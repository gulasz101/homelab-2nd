---
# Pi-hole Family Shield — network-wide DNS discipline (H2-73 + H2-74).
# Chart 2.38.0 / Pi-hole core 2026.07.2 (FTL v6).
# DNS: hostNetwork so the pod binds homelab-2nd :53 directly (UDP+TCP).
# This eliminates the NodePort 30053 reply-source asymmetry that broke Android clients.
# serviceDns becomes an in-cluster ClusterIP for internal consumers; LAN clients reach
# 192.168.1.179:53 directly, with real client IPs preserved (no NAT).
# DHCP service disabled: OPNsense stays the DHCP server (H2-74).
# Web UI stays ClusterIP — reachable only through oauth2-proxy (Authentik SSO).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: pihole
spec:
  interval: 1h
  chart:
    spec:
      chart: pihole
      version: "2.38.0"
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    image:
      repository: pihole/pihole
      tag: "2026.07.2"
      pullPolicy: IfNotPresent

    # Keep the shield on the stable wired node.
    nodeSelector:
      kubernetes.io/hostname: homelab-2nd

    # DNS: hostNetwork so the pod binds the node's real :53 directly.
    # This eliminates the NodePort 30053 reply-source asymmetry that broke Android clients.
    # serviceDns stays as an in-cluster ClusterIP for internal consumers; clients reach
    # 192.168.1.179:53 on the node.
    hostNetwork: "true"
    privileged: "true"

    podDnsConfig:
      enabled: true
      policy: "ClusterFirstWithHostNet"
      nameservers:
        - 127.0.0.1
        - 8.8.8.8

    serviceDns:
      type: ClusterIP
      port: 53
      mixedService: true
      externalTrafficPolicy: Local

    serviceDhcp:
      # OPNsense owns DHCP; Pi-hole only resolves. Static leases on OPNsense
      # define device identity (W/S/P groups, see ADR-021).
      enabled: false

    serviceWeb:
      type: ClusterIP
      http:
        enabled: true
        port: 80
      https:
        enabled: false

    admin:
      enabled: true
      existingSecret: "pihole-app-secrets"
      passwordKey: "password"

    DNS1: "1.1.1.1"
    DNS2: "1.0.0.1"

    persistentVolumeClaim:
      enabled: true
      size: 2Gi
      storageClass: local-path
      accessModes:
        - ReadWriteOnce

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    monitoring:
      podMonitor:
        enabled: true
        interval: 30s
      sidecar:
        enabled: true

    # Blocklist/adlist groups and the curfew automation land in H2-75.
    adlists: {}
    whitelist: {}
    blacklist: {}
    regex: {}
