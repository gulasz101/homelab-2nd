---
# Daily scheduled base backups for the OpenGist CNPG cluster
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: opengist-db-daily
  namespace: opengist
spec:
  schedule: "0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: opengist-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
