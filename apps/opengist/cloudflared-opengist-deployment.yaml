---
# Dedicated Cloudflare Tunnel for gist.voitech.dev -> OpenGist
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-opengist
  namespace: opengist
  labels:
    app.kubernetes.io/name: cloudflared-opengist
    app.kubernetes.io/component: tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-opengist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-opengist
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
            - --url
            - http://opengist-http.opengist.svc.cluster.local:6157
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opengist-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
