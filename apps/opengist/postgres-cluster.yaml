---
# OpenGist Postgres cluster — single instance on local-path NVMe
# Backups + WAL archiving via the Barman Cloud CNPG-I plugin to OMV MinIO
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: opengist-db
  namespace: opengist
  annotations:
    # Recovery reuses the same ObjectStore/serverName as the source, so the
    # "archive must be empty" guard must be bypassed.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie

  # Recovery bootstrap: if this cluster is ever recreated, restore the latest
  # available base backup from the barman ObjectStore and replay WAL.
  bootstrap:
    recovery:
      source: origin
      database: opengist
      owner: opengist
      secret:
        name: opengist-db-credentials

  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: opengist-db-backups
          serverName: opengist-db

  storage:
    storageClass: local-path
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: opengist-db-backups
        serverName: opengist-db

  backup:
    retentionPolicy: "30d"

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
