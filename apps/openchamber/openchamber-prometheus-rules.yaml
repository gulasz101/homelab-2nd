---
# PrometheusRule for the openchamber namespace (H2-28 additions).
# Covers the whole namespace pod health, incl. the new syncthing vault-sync
# sidecar. Follows the homelab pattern:
#   - release: prometheus-stack label (matches the live Prometheus CR selector)
#   - namespace label on every alert (AlertmanagerConfig implicit matcher)
#   - kube_pod_status_ready with the Completed-pod exclusion (commit 5151228)
#     so the hourly backup CronJob's Completed pods do not fire false alerts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openchamber-resource-alerts
  namespace: openchamber
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: openchamber.resources
      interval: 1m
      rules:
        - alert: OpenChamberMemoryAbove85PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              container_memory_working_set_bytes{namespace="openchamber", container!=""}
            )
            /
            sum by (pod, container, namespace) (
              kube_pod_container_resource_limits{namespace="openchamber", resource="memory", container!=""}
            ) > 85
          for: 15m
          labels:
            severity: warning
            namespace: openchamber
          annotations:
            summary: "openchamber/{{ $labels.pod }} container {{ $labels.container }} memory above 85% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} memory is above 85% of its limit for more than 15 minutes."

        - alert: OpenChamberCPUAbove90PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              rate(container_cpu_usage_seconds_total{namespace="openchamber", container!=""}[5m])
            )
            /
            sum by (pod, container, namespace) (
              kube_pod_container_resource_limits{namespace="openchamber", resource="cpu", container!=""}
            ) > 90
          for: 15m
          labels:
            severity: warning
            namespace: openchamber
          annotations:
            summary: "openchamber/{{ $labels.pod }} container {{ $labels.container }} CPU above 90% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} CPU is above 90% of its limit for more than 15 minutes."

    - name: openchamber.pods
      interval: 1m
      rules:
        - alert: OpenChamberPodNotReady
          expr: |
            kube_pod_status_ready{namespace="openchamber", condition="true"} == 0
            unless on(pod) kube_pod_status_phase{namespace="openchamber", phase=~"Succeeded|Failed"} == 1
          for: 15m
          labels:
            severity: warning
            namespace: openchamber
          annotations:
            summary: "openchamber pod {{ $labels.pod }} not Ready for 15m"
            description: "Pod {{ $labels.pod }} in namespace openchamber has been not-Ready for more than 15 minutes (Completed job pods excluded)."