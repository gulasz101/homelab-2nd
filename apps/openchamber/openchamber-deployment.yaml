---
# OpenChamber worker — Ubuntu image with Node, the OpenCode CLI and the
# OpenChamber web server. Pinned to t460, the idle 4c/7.6G k3s worker.
#
# Storage split:
#   * /storage            -> OMV NFS (durable): OpenChamber settings/device
#                            tokens, seeded OpenCode config, workspace clones.
#   * /var/lib/openchamber -> t460 local NVMe: the OpenCode SQLite session DB.
#                            SQLite WAL needs shared memory and is not safe on
#                            NFS; durability for it comes from the S3 backup job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openchamber
  namespace: openchamber
  labels:
    app.kubernetes.io/name: openchamber
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openchamber
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openchamber
        app.kubernetes.io/component: worker
    spec:
      # Service links would inject OPENCHAMBER_PORT (and OPENCHAMBER_SERVICE_*)
      # from the Service named "openchamber", clobbering the app's own vars.
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: t460
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: prepare
          image: alpine/git:2.45.2
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -eu
              # Durable share (OMV NFS).
              mkdir -p /storage/openchamber /storage/opencode-config /storage/workspaces
              if [ ! -f /storage/opencode-config/opencode.json ]; then
                cp /config-seed/opencode.json /storage/opencode-config/opencode.json
                echo "[prepare] seeded opencode.json"
              fi
              if [ ! -d /storage/workspaces/homelab-2nd/.git ]; then
                git clone --depth 1 https://github.com/gulasz101/homelab-2nd.git \
                  /storage/workspaces/homelab-2nd || true
              fi
              # Vault mirror dir (H2-28) — Syncthing sidecar's receive-only target.
              # Syncthing (uid 1000) must own it; it lives on the same OMV NFS PV.
              # .stfolder marker is REQUIRED: syncthing refuses an empty folder
              # with "folder marker missing (potential data loss)".
              mkdir -p /storage/vault/.stfolder
              chown -R 1000:1000 /storage/vault
              # Local NVMe (SQLite session DB + state).
              mkdir -p /local/opencode-data /local/opencode-state
              chown -R 1000:1000 /storage /local
          volumeMounts:
            - name: data
              mountPath: /storage
            - name: local
              mountPath: /local
            - name: config-seed
              mountPath: /config-seed
              readOnly: true
            # Syncthing TLS identity (SOPS-decrypted by Flux) — only readable
            # by the init/sidecar pair, never by the main container.
            - name: syncthing-identity
              mountPath: /identity
        # Builds the Syncthing sidecar's home dir: TLS identity from the SOPS
        # secret + config.xml from the ConfigMap, merged onto a writable
        # emptyDir (identity files made read-only; index db lands next to
        # them, on local NVMe, since the home is a real PVC-backed dir).
        - name: syncthing-identity-init
          image: alpine/git:2.45.2
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /staging
              cp /identity-src/cert.pem /identity-src/key.pem /staging/
              cp /config-src/config.xml /staging/
              chmod 400 /staging/cert.pem /staging/key.pem
              chown -R 1000:1000 /staging
              echo "[syncthing-init] staged identity + config"
          volumeMounts:
            - name: syncthing-identity
              mountPath: /identity-src
              readOnly: true
            - name: syncthing-config
              mountPath: /config-src
              readOnly: true
            - name: syncthing-home
              mountPath: /staging
      containers:
        # Vault-sync sidecar (H2-28): Syncthing in receive-only mode, mirroring
        # the vault from the M1 Max. Identity from the SOPS secret, config from
        # the ConfigMap, home dir on local NVMe (Syncthing's index db is
        # sqlite, not NFS-safe). Image pinned by amd64 manifest digest of
        # syncthing/syncthing:2.1.2.
        - name: syncthing
          image: syncthing/syncthing@sha256:d4a6dca9676da9054964e275e9d77f671bd261ae2a9e10b335059ef30f7d46bc
          imagePullPolicy: IfNotPresent
          args: ["serve", "--home", "/var/lib/syncthing", "--no-browser"]
          ports:
            - name: syncthing
              containerPort: 22000
              protocol: TCP
          env:
            - name: HOME
              value: /var/lib/syncthing
            - name: STNOUPGRADE
              value: "1"
          volumeMounts:
            # Read-only inputs: TLS identity (from the SOPS secret) and the
            # config.xml (from the ConfigMap), merged in by the init container.
            - name: syncthing-home
              mountPath: /var/lib/syncthing
            # The vault mirror itself (receive-only target), on OMV NFS.
            - name: data
              mountPath: /vault
              subPath: vault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: openchamber
          image: ghcr.io/gulasz101/openchamber-web:1.23.1-r3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: opencode
              containerPort: 4096
              protocol: TCP
          env:
            - name: OPENCHAMBER_HOST
              value: "0.0.0.0"
            - name: OPENCHAMBER_PORT
              value: "3000"
            - name: OPENCHAMBER_DATA_DIR
              value: /storage/openchamber
            - name: OPENCODE_CONFIG_DIR
              value: /storage/opencode-config
            - name: OPENCODE_DATA_DIR
              value: /var/lib/openchamber/opencode-data
            - name: OPENCODE_PORT
              value: "4096"
            - name: OPENCHAMBER_OPENCODE_HOSTNAME
              value: "0.0.0.0"
            - name: OPENCHAMBER_WORKDIR
              value: /storage/workspaces/homelab-2nd
            - name: OPENCHAMBER_UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: OPENCHAMBER_UI_PASSWORD
            - name: OPENCODE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: OPENCODE_JWT_SECRET
            - name: OPENCHAMBER_LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: OPENCHAMBER_LITELLM_KEY
            - name: OPENVIKING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openchamber-secrets
                  key: OPENVIKING_API_KEY
            # GitHub access — token from SOPS, never written to disk.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openchamber-github
                  key: GITHUB_TOKEN
            - name: GIT_AUTHOR_NAME
              value: OpenChamber Worker
            - name: GIT_COMMITTER_NAME
              value: OpenChamber Worker
            - name: GIT_AUTHOR_EMAIL
              value: gulasz101@gmail.com
            - name: GIT_COMMITTER_EMAIL
              value: gulasz101@gmail.com
          volumeMounts:
            - name: data
              mountPath: /storage
            # Vault sync (H2-28): READ-WRITE for OpenChamber — delegated agents
            # write tracking notes into the vault; they sync to the Mac.
            - name: data
              mountPath: /vault
              subPath: vault
            - name: local
              mountPath: /var/lib/openchamber
            # OpenCode stores its sessions in SQLite under XDG data/state paths;
            # these are subPath mounts of the local NVMe PVC.
            - name: local
              mountPath: /home/openchamber/.local/share/opencode
              subPath: opencode-data
            - name: local
              mountPath: /home/openchamber/.local/state/opencode
              subPath: opencode-state
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openchamber-data
        - name: local
          persistentVolumeClaim:
            claimName: openchamber-storage
        - name: config-seed
          configMap:
            name: openchamber-opencode-config
        # Vault-sync sidecar volumes (H2-28).
        # syncthing-home: writable home (index db + staged identity/config).
        # emptyDir = local NVMe scratch, wiped on pod restart (index rebuilds
        # from scratch, harmless for a receive-only mirror).
        - name: syncthing-home
          emptyDir: {}
        - name: syncthing-identity
          secret:
            secretName: openchamber-syncthing-identity
        - name: syncthing-config
          configMap:
            name: openchamber-syncthing-config
