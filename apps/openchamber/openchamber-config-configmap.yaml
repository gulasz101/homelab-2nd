---
# Seed OpenCode configuration for the OpenChamber worker.
#
# Seeded into <OPENCODE_CONFIG_DIR>/opencode.json by the prepare init container
# and re-copied only when `seed-version` changes, so the UI can still edit and
# persist changes between config releases.
#
# Key design points:
#   * Provider is the native `opencode-go` provider — NOT a custom
#     OpenAI-compatible provider — because only the native provider sends the
#     `x-opencode-session` header the OpenCode Go gateway requires. Its baseURL
#     is pointed at LiteLLM, which forwards client headers upstream.
#     EXCEPTION (2026-10-12, ADR-050): the SOU fork lane runs on `qwen3.8-flash`,
#     for which the native provider picks a transport the Go gateway cannot
#     serve. That lane therefore uses the second provider below (`litellm`,
#     npm @ai-sdk/openai-compatible -> /v1/chat/completions). LiteLLM's
#     session-normalizer hook injects the missing x-opencode-session header for
#     it (the model is listed in OPENCODE_GO_UNSUFFIXED), so the gateway accepts
#     the request. Do NOT switch the fork lane back to `opencode-go` for this id.
#   * The model name is the native Go model id (`deepseek-v4.1-flash`) so
#     OpenCode picks the right transport; LiteLLM exposes the same model name
#     and forwards to https://opencode.ai/zen/go/v1.
#   * MCP servers give the agent the same tools the homelab agents have.
#   * Permissions: delegated worker sessions must run UNATTENDED. Everything is
#     `allow` except a small deny-list of dangerous operations (2026-09-15: the
#     H2-19 run stalled ~30 min waiting for interactive approvals).
#
# 2026-10-09 (seed-version 4): second agent `itsaplan-worker-sou` added for the
# Star-Office-UI fork lane (SOU board), running its own model against its own
# workspace /storage/workspaces/star-office-ui-fork. The homelab-2nd lane is
# unchanged. The repo config was byte-identical to the live file before this
# bump, so nothing in-flight is clobbered.
#
# 2026-10-12 (seed-version 7): the fork lane moves to qwen3.8-flash driven
# through a SECOND, explicitly OpenAI-protocol provider (`litellm`). Reason:
# OpenCode's native `opencode-go` provider chooses the Anthropic transport
# (/v1/messages) for the bare id `qwen3.8-flash`, and the OpenCode Go gateway
# cannot serve that model over that protocol (400 ModelProtocolUnsupported /
# MissingSessionID, measured 2026-10-12). The same model on the OpenAI transport
# (/v1/chat/completions, i.e. npm @ai-sdk/openai-compatible) answers 200 OK.
# The native provider stays for the H2 lane's deepseek-v4.1-flash. See ADR-050.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openchamber-opencode-config
  namespace: openchamber
data:
  # Bump when opencode.json below changes: the prepare init container re-copies
  # the seed into /storage/opencode-config only when this differs from the
  # version recorded in /storage/opencode-config/.seed-version, so UI edits
  # between bumps survive. Must be moved TOGETHER with the pod-template
  # annotation homelab.voitech.dev/opencode-seed-version on the openchamber
  # Deployment (that annotation is what actually rolls the pod).
  seed-version: "7"
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "autoupdate": false,
      "model": "opencode-go/deepseek-v4.1-flash",
      "skills": {
        "paths": ["/storage/opencode-config/skill"]
      },
      "provider": {
        "opencode-go": {
          "options": {
            "baseURL": "http://litellm.llm-hub.svc.cluster.local:4000/v1",
            "apiKey": "{env:OPENCHAMBER_LITELLM_KEY}"
          }
        },
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM (OpenAI protocol)",
          "options": {
            "baseURL": "http://litellm.llm-hub.svc.cluster.local:4000/v1",
            "apiKey": "{env:OPENCHAMBER_LITELLM_KEY}"
          },
          "models": {
            "qwen3.8-flash": {
              "name": "Qwen3.8 Flash (LiteLLM -> OpenCode Go)"
            }
          }
        }
      },
      "permission": {
        "edit": "allow",
        "webfetch": "allow",
        "bash": {
          "*": "allow",
          "rm -rf /*": "deny",
          "sudo *": "deny",
          "git push --force*": "deny"
        }
      },
      "mcp": {
        "openviking": {
          "type": "remote",
          "url": "http://openviking.openviking.svc.cluster.local:1933/mcp",
          "enabled": true,
          "headers": {
            "Authorization": "Bearer {env:OPENVIKING_API_KEY}"
          }
        },
        "docs-mcp": {
          "type": "remote",
          "url": "http://docs-mcp-server.docs-mcp.svc.cluster.local:6280/mcp",
          "enabled": true
        },
        "firecrawl": {
          "type": "local",
          "command": ["npx", "-y", "firecrawl-mcp"],
          "enabled": true,
          "environment": {
            "FIRECRAWL_API_URL": "http://api.firecrawl.svc.cluster.local:3002",
            "FIRECRAWL_API_KEY": "self-hosted",
            "FIRECRAWL_RETRY_MAX_ATTEMPTS": "3"
          }
        },
        "itsaplan": {
          "type": "remote",
          "url": "https://plan-api.voitech.dev/mcp",
          "enabled": true,
          "headers": {
            "Authorization": "Bearer {env:ITSAPLAN_API_KEY}"
          }
        }
      },
      "agent": {
        "itsaplan-worker": {
          "description": "Worker agent driven by Itsaplan schedules",
          "model": "opencode-go/deepseek-v4.1-flash",
          "prompt": "You are the OpenChamber worker agent for the homelab-2nd project. A delegated Itsaplan issue is your job: load the `itsaplan-tasks` skill and follow it end to end. Work autonomously — permissions are pre-approved, respect the deny-list, and never call the question tool; decide and record a ruling instead. Acceptance criteria are the contract: decompose the issue into real H2 subtasks with parentId, drive them Todo -> In Progress -> Done, and prove every criterion with evidence before closing. If it touches the homelab, follow the GitOps workflow: Flux + Helm only, SOPS-age encrypted secrets, no plaintext credentials. Write a tracking note under /vault/homelab/tracking/ (YYYY-MM-DD-<slug>.md) — /vault is the user's Obsidian vault synced live to his devices via Syncthing; write ONLY under homelab/tracking/ (and homelab/docs/adr/ for ADRs), NEVER read or modify anything else in /vault, and NEVER copy vault content into the git workspace /storage/workspaces/homelab-2nd (public repo). Your final message is the deliverable posted to the issue — make it complete and evidence-based.",
          "permission": {
            "edit": "allow",
            "webfetch": "allow",
            "bash": {
              "*": "allow",
              "rm -rf /*": "deny",
              "sudo *": "deny",
              "git push --force*": "deny"
            }
          }
        },
        "itsaplan-worker-sou": {
          "description": "Fork worker agent driven by Itsaplan schedules (Star-Office-UI fork, SOU board)",
          "model": "litellm/qwen3.8-flash",
          "prompt": "You are the OpenChamber worker agent for the Star-Office-UI fork. A delegated Itsaplan issue on the SOU board is your job: load the `itsaplan-tasks` skill and follow it end to end. Work autonomously — permissions are pre-approved, respect the deny-list, and never call the question tool; decide and record a ruling instead. Acceptance criteria are the contract: decompose the issue into real SOU subtasks with parentId, drive them Todo -> In Progress -> Done, and prove every criterion with evidence before closing. Hard rules for this fork, non-negotiable: (1) never use Qwen-Image-2.1 — it is research-only licensed; Qwen/Qwen-Image 1.0 is Apache-2.0 and is fine. (2) never img2img and never train on Star-Office or LimeZu PNGs — those assets are being replaced entirely. (3) drive state from code, never from prose: upstream SOUL.md auto-sync is broken (issue #102). Work only inside /storage/workspaces/star-office-ui-fork, and NEVER copy vault content into it — it is a public repository. Itsaplan writes go to the SOU board, never H2. Your final message is the deliverable posted to the issue — make it complete and evidence-based.",
          "permission": {
            "edit": "allow",
            "webfetch": "allow",
            "bash": {
              "*": "allow",
              "rm -rf /*": "deny",
              "sudo *": "deny",
              "git push --force*": "deny"
            }
          }
        }
      }
    }
