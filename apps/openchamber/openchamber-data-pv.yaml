---
# Durable OpenChamber storage on OMV NFS (granted to t460 = 192.168.1.111).
#
# Holds OpenChamber settings/device tokens, the seeded OpenCode config and the
# workspace clones. The OpenCode SQLite database (sessions) deliberately stays
# on t460 local-path: SQLite's WAL mode needs shared memory and is not safe on
# NFS. Those sessions are covered by the MinIO backup CronJob instead.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: openchamber-data
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: openmediavault.local
    path: /srv/dev-disk-by-uuid-cda9bf6e-0ed1-4e61-b063-1cbab7351886/openchamber/data
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openchamber-data
  namespace: openchamber
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: ""
  volumeName: openchamber-data
