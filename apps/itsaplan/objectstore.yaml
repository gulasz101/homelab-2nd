---
# ObjectStore for the Barman Cloud CNPG-I plugin — Itsaplan backups to OMV MinIO
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: itsaplan-db-backups
  namespace: itsaplan
spec:
  configuration:
    destinationPath: s3://cnpg-backups/itsaplan
    endpointURL: http://openmediavault.local:9000
    s3Credentials:
      accessKeyId:
        name: itsaplan-minio-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: itsaplan-minio-backup-creds
        key: ACCESS_SECRET_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
