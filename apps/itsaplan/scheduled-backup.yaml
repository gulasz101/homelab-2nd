---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: itsaplan-db
  namespace: itsaplan
spec:
  schedule: "0 0 4 * * *"  # 04:00 daily (6-field cron with seconds)
  backupOwnerReference: self
  cluster:
    name: itsaplan-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
