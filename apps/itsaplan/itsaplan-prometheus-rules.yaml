---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: itsaplan-resource-alerts
  namespace: itsaplan
  labels:
    release: prometheus-stack
spec:
  groups:
    - name: itsaplan.resources
      interval: 30s
      rules:
        - alert: ItsaplanCPUAbove90PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              rate(container_cpu_usage_seconds_total{namespace="itsaplan", container!=""}[5m])
            ) / sum by (pod, container, namespace) (
              container_spec_cpu_quota{namespace="itsaplan", container!=""} / container_spec_cpu_period{namespace="itsaplan", container!=""}
            ) > 90
          for: 5m
          labels:
            severity: critical
            namespace: itsaplan
          annotations:
            summary: "itsaplan/{{ $labels.pod }} CPU above 90% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} CPU is above 90% of its limit for more than 5 minutes."
        - alert: ItsaplanMemoryAbove90PercentLimit
          expr: |
            100 * sum by (pod, container, namespace) (
              container_memory_working_set_bytes{namespace="itsaplan", container!=""}
            ) / sum by (pod, container, namespace) (
              kube_pod_container_resource_limits{namespace="itsaplan", resource="memory", container!=""}
            ) > 90
          for: 5m
          labels:
            severity: critical
            namespace: itsaplan
          annotations:
            summary: "itsaplan/{{ $labels.pod }} memory above 90% of limit"
            description: "{{ $labels.pod }}/{{ $labels.container }} memory is above 90% of its limit for more than 5 minutes."
        - alert: ItsaplanPodNotReady
          expr: |
            kube_pod_status_ready{namespace="itsaplan", condition="true"} == 0
          for: 5m
          labels:
            severity: warning
            namespace: itsaplan
          annotations:
            summary: "itsaplan pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been not ready for more than 5 minutes."
        - alert: ItsaplanPodRestartLoop
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="itsaplan"}[30m]) > 3
          for: 0m
          labels:
            severity: warning
            namespace: itsaplan
          annotations:
            summary: "itsaplan pod {{ $labels.pod }} restarting frequently"
            description: "Pod {{ $labels.pod }} has restarted more than 3 times in the last 30 minutes."
        - alert: ItsaplanAndrzejRunnerDown
          expr: |
            kube_pod_status_ready{namespace="itsaplan", pod=~"itsaplan-andrzej-runner-.*", condition="true"} == 0
          for: 5m
          labels:
            severity: warning
            namespace: itsaplan
          annotations:
            summary: "itsaplan Andrzej runner pod is not ready"
            description: "The Itsaplan→Andrzej agent runner pod {{ $labels.pod }} has been not ready for more than 5 minutes. Scheduled tasks will not be picked up."
        - alert: ItsaplanAndrzejRunnerAbsent
          expr: |
            absent(kube_pod_status_ready{namespace="itsaplan", pod=~"itsaplan-andrzej-runner-.*", condition="true"}) == 1
          for: 5m
          labels:
            severity: critical
            namespace: itsaplan
          annotations:
            summary: "itsaplan Andrzej runner pod is missing"
            description: "No Itsaplan→Andrzej agent runner pod exists in namespace itsaplan. Scheduled/assigned tasks will not reach Andrzej."
        - alert: ItsaplanAndrzejRunnerRestartLoop
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="itsaplan", pod=~"itsaplan-andrzej-runner-.*"}[30m]) > 3
          for: 0m
          labels:
            severity: warning
            namespace: itsaplan
          annotations:
            summary: "itsaplan Andrzej runner is restarting frequently"
            description: "Andrzej runner pod {{ $labels.pod }} has restarted more than 3 times in the last 30 minutes."
