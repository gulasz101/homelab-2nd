---
# One-off bootstrap job: create a throwaway god account, enable Authentik OIDC,
# then close registration and disable email/password auth.
# Idempotent: if the setup user already exists, it signs in; if auth is already
# locked down with OIDC enabled, the job exits cleanly.
apiVersion: batch/v1
kind: Job
metadata:
  name: itsaplan-oidc-bootstrap
  namespace: itsaplan
  annotations:
    # Flux reconciles this once. Delete the Job manually after success.
    fluxcd.io/ignore: "false"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: arr-box
      tolerations:
        - key: workload
          operator: Equal
          value: arr-box
          effect: NoSchedule
      containers:
        - name: bootstrap
          image: curlimages/curl:8.13.0
          envFrom:
            - secretRef:
                name: itsaplan-oidc-creds
          env:
            - name: API_URL
              value: "https://plan-api.voitech.dev"
            - name: APP_URL
              value: "https://plan.voitech.dev"
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # Wait for API to be ready.
              for i in $(seq 1 60); do
                if curl -fsS "${API_URL}/" >/dev/null 2>&1; then
                  break
                fi
                echo "waiting for api..."
                sleep 5
              done

              # If already fully bootstrapped, do nothing.
              auth_config=$(curl -fsS "${API_URL}/auth-config")
              echo "Current auth-config: ${auth_config}"
              if echo "${auth_config}" | grep -q '"registration":"closed"' \
                && echo "${auth_config}" | grep -q '"emailPassword":false' \
                && echo "${auth_config}" | grep -q '"oidc":true'; then
                echo "SSO is already enabled and local auth is disabled. Nothing to do."
                exit 0
              fi

              # Acquire a session as the setup (god) user. Try sign-up first; if the
              # user exists from a previous run, sign in instead.
              signup_response=$(curl -sS -c /tmp/cookies.txt -b /tmp/cookies.txt \
                -H "Content-Type: application/json" \
                -d '{"name":"Setup Account","email":"'"${SETUP_EMAIL}"'","password":"'"${SETUP_PASSWORD}"'","callbackURL":"'"${APP_URL}"'/login"}' \
                "${API_URL}/api/auth/sign-up/email" || true)
              if echo "${signup_response}" | grep -q '"code":"USER_ALREADY_EXISTS_USE_ANOTHER_EMAIL"'; then
                echo "Setup user already exists; signing in..."
                curl -fsS -c /tmp/cookies.txt -b /tmp/cookies.txt \
                  -H "Content-Type: application/json" \
                  -d '{"email":"'"${SETUP_EMAIL}"'","password":"'"${SETUP_PASSWORD}"'","rememberMe":true}' \
                  "${API_URL}/api/auth/sign-in/email" >/dev/null
              elif echo "${signup_response}" | grep -q '"token"'; then
                echo "Setup user created."
              else
                echo "Unexpected sign-up response: ${signup_response}"
                exit 1
              fi

              # Enable Authentik OIDC. Explicit -X PUT is required: the API only
              # exposes PUT /god/oidc-settings; curl -d without -X defaults to POST,
              # which Elysia routes as 404.
              echo "Enabling OIDC provider..."
              curl -fsS -X PUT -c /tmp/cookies.txt -b /tmp/cookies.txt \
                -H "Content-Type: application/json" \
                -d '{
                  "enabled": true,
                  "label": "'"${OIDC_LABEL}"'",
                  "discoveryUrl": "'"${OIDC_DISCOVERY_URL}"'",
                  "clientId": "'"${OIDC_CLIENT_ID}"'",
                  "clientSecret": "'"${OIDC_CLIENT_SECRET}"'",
                  "scopes": ["openid", "profile", "email"],
                  "pkce": true
                }' \
                "${API_URL}/god/oidc-settings" >/dev/null

              # Disable email/password auth and close registration.
              echo "Locking down auth settings..."
              curl -fsS -X PUT -c /tmp/cookies.txt -b /tmp/cookies.txt \
                -H "Content-Type: application/json" \
                -d '{
                  "registration": "closed",
                  "emailPassword": false,
                  "requireEmailVerification": false,
                  "magicLink": false
                }' \
                "${API_URL}/god/auth-settings" >/dev/null

              # Verify final state.
              final_config=$(curl -fsS "${API_URL}/auth-config")
              echo "Final auth-config: ${final_config}"
              if echo "${final_config}" | grep -q '"registration":"closed"' \
                && echo "${final_config}" | grep -q '"emailPassword":false' \
                && echo "${final_config}" | grep -q '"oidc":true'; then
                echo "Itsaplan OIDC bootstrap complete."
              else
                echo "Bootstrap did not reach expected final state."
                exit 1
              fi
