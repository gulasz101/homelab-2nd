---
# Dedicated Cloudflare Tunnel for plan.voitech.dev -> itsaplan web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-plan
  namespace: itsaplan
  labels:
    app.kubernetes.io/name: cloudflared-plan
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-plan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-plan
    spec:
      nodeSelector:
        kubernetes.io/hostname: arr-box
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
            - --url
            - http://itsaplan-web.itsaplan.svc.cluster.local:3001
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: itsaplan-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Dedicated Cloudflare Tunnel for api.plan.voitech.dev -> itsaplan api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-plan-api
  namespace: itsaplan
  labels:
    app.kubernetes.io/name: cloudflared-plan-api
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-plan-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-plan-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: arr-box
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
            - --url
            - http://itsaplan-api.itsaplan.svc.cluster.local:3000
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: itsaplan-api-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
