---
# Itsaplan Postgres cluster — single instance on local-path NVMe
# Backups + WAL archiving via the Barman Cloud CNPG-I plugin to OMV MinIO
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: itsaplan-db
  namespace: itsaplan
  # Barman serverName generation convention: see
  # docs/cnpg-backup-servername-generations.md. A rebuilt cluster archives into
  # a fresh "<name>-genN" namespace while recovering from the previous one, so
  # the cnpg.io/skipEmptyWalArchiveCheck annotation is no longer needed.
spec:
  instances: 1
  # Switchover (not restart) on any primary pod-spec change: moving node = new replica +
  # promote, never an in-place restart that a node-bound local-path PV can't follow.
  primaryUpdateMethod: switchover
  # local-path PVs are node-bound for life: pin explicitly (H2-306 lesson), node move 2026-11-11.
  affinity:
    nodeSelector:
      kubernetes.io/hostname: loki
  imageName: ghcr.io/cloudnative-pg/postgresql:17-minimal-trixie

  bootstrap:
    initdb:
      database: itsaplan
      owner: itsaplan
      secret:
        name: itsaplan-db-credentials

  storage:
    storageClass: local-path
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: itsaplan-db-backups
        # Current generation (archiver target); bump to "<name>-genN" (fresh) on rebuild.
        serverName: itsaplan-db

  backup:
    retentionPolicy: "30d"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
