---
# Itsaplan Postgres cluster — single instance on local-path NVMe
# Backups + WAL archiving via the Barman Cloud CNPG-I plugin to OMV MinIO
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: itsaplan-db
  namespace: itsaplan
  annotations:
    # The WAL archive for this server already contains history, so the
    # "archive must be empty" guard must be bypassed for archiving/bootstraps.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-minimal-trixie

  bootstrap:
    initdb:
      database: itsaplan
      owner: itsaplan
      secret:
        name: itsaplan-db-credentials

  storage:
    storageClass: local-path
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: itsaplan-db-backups
        serverName: itsaplan-db

  backup:
    retentionPolicy: "30d"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
