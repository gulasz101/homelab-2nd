---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsaplan-andrzej-runner
  namespace: itsaplan
  labels:
    app.kubernetes.io/name: itsaplan-andrzej-runner
    app.kubernetes.io/component: agent-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: itsaplan-andrzej-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itsaplan-andrzej-runner
    spec:
      nodeSelector:
        kubernetes.io/hostname: arr-box
      containers:
        - name: runner
          image: node:26-alpine
          workingDir: /etc/itsaplan-runner
          command:
            - npx
            - -y
            - '@itsaplan/runner@0.5.0'
            - ./itsaplan-runner.json
          env:
            - name: ITSAPLAN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: itsaplan-andrzej-agent-key
                  key: ITSAPLAN_API_KEY
            - name: ITSAPLAN_URL
              valueFrom:
                secretKeyRef:
                  name: itsaplan-andrzej-agent-key
                  key: ITSAPLAN_URL
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: itsaplan-andrzej-webhook-creds
                  key: WEBHOOK_URL
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: itsaplan-andrzej-webhook-creds
                  key: WEBHOOK_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/itsaplan-runner
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: itsaplan-andrzej-runner
            defaultMode: 0755
