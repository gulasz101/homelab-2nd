---
# AlertmanagerConfig: route voice namespace alerts to the Mattermost webhook.
# The webhook secret must live in the same namespace as this AlertmanagerConfig.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: voice-mattermost-alerts
  namespace: voice
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: voice-mattermost
    matchers:
      - name: namespace
        value: voice
        matchType: "="
  receivers:
    - name: voice-mattermost
      slackConfigs:
        - apiURL:
            name: voice-mattermost-webhook-url
            key: url
          sendResolved: true
          title: "{{ .CommonAnnotations.summary }}"
          text: "{{ .CommonAnnotations.description }}"
          fallback: "voice alert: {{ .CommonAnnotations.summary }}"
