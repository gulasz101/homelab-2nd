---
# Speaches CPU-only STT/TTS server.
# Image: ghcr.io/speaches-ai/speaches:latest-cpu
# Exposes OpenAI-compatible endpoints on port 8000.
# Open WebUI routes STT here via AUDIO_OPENAI_API_BASE_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speaches
  namespace: voice
  labels:
    app.kubernetes.io/name: speaches
    app.kubernetes.io/component: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: speaches
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speaches
        app.kubernetes.io/component: stt
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: ensure-model-cache-writable
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /home/ubuntu/.cache/huggingface/hub
              chown -R 1000:1000 /home/ubuntu/.cache/huggingface
          volumeMounts:
            - name: model-cache
              mountPath: /home/ubuntu/.cache/huggingface
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: speaches
          image: ghcr.io/speaches-ai/speaches:latest-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: UVICORN_HOST
              value: "0.0.0.0"
            - name: UVICORN_PORT
              value: "8000"
            - name: UVICORN_WORKERS
              value: "1"
            # Disable telemetry / analytics.
            - name: DO_NOT_TRACK
              value: "1"
            - name: GRADIO_ANALYTICS_ENABLED
              value: "False"
            - name: DISABLE_TELEMETRY
              value: "1"
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: PYANNOTE_METRICS_ENABLED
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - name: model-cache
              mountPath: /home/ubuntu/.cache/huggingface
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: speaches-model-cache
