---
# ObjectStore for the Barman Cloud CNPG-I plugin — Paperclip backups to OMV MinIO
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: paperclip-db-backups
  namespace: paperclip
spec:
  configuration:
    destinationPath: s3://cnpg-backups/paperclip
    endpointURL: http://openmediavault.local:9000
    s3Credentials:
      accessKeyId:
        name: paperclip-minio-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: paperclip-minio-backup-creds
        key: ACCESS_SECRET_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
