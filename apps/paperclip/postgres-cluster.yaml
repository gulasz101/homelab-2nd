---
# CloudNativePG cluster for Paperclip — single instance on local-path NVMe
# WAL + base backups via the Barman Cloud CNPG-I plugin to OMV MinIO
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperclip-db
  namespace: paperclip
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-minimal-trixie

  enableSuperuserAccess: true

  postgresql:
    parameters:
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      database: paperclip
      owner: paperclip
      secret:
        name: paperclip-db-credentials

  storage:
    storageClass: local-path
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperclip-db-backups
        serverName: paperclip-db

  backup:
    retentionPolicy: "30d"

  # No CPU limit: with 500m the pod was CFS-throttled in 47% of periods and Paperclip
  # page loads stalled on bursty queries (2026-10-25). Memory stays capped.
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
