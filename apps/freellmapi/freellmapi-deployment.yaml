---
# FreeLLMAPI v0.16.9 (tashfeenahmed/freellmapi): one OpenAI/Anthropic-compatible
# /v1 endpoint in front of the free tiers of ~34 LLM providers, with per-key
# rate tracking and automatic failover (GUL-123, ADR-084).
# Upstream ships only a Docker image + compose file, no Helm chart, so raw
# manifests via Flux are the sanctioned last resort (guardrail 2).
#
# Pin the release tag: upstream cuts several releases a week, and :latest would
# let a restarted pod come back on a version nobody chose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freellmapi
  namespace: freellmapi
  labels:
    app: freellmapi
    app.kubernetes.io/name: freellmapi
    app.kubernetes.io/version: "0.16.9"
spec:
  replicas: 1
  strategy:
    type: Recreate  # single SQLite file on a RWO volume: never two writers
  selector:
    matchLabels:
      app: freellmapi
  template:
    metadata:
      labels:
        app: freellmapi
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-2nd
      # The image starts as root only so its entrypoint can chown PaaS volumes,
      # then drops to `node` (1000). Running as 1000 from the start skips that
      # (the entrypoint execs straight through when uid != 0) and fsGroup makes
      # the local-path volume writable.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freellmapi
          image: ghcr.io/tashfeenahmed/freellmapi:v0.16.9
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: FREEAPI_DB_PATH
              value: /app/server/data/freellmapi.db
            # Built-in encrypted snapshot (gzip + AES-GCM with ENCRYPTION_KEY),
            # written after a WAL checkpoint. If freellmapi.db is missing at
            # boot, the app restores from this file before migrations — so a
            # restore is "drop the MinIO copy here and start the pod".
            - name: FREEAPI_DB_BACKUP_PATH
              value: /app/server/data/freellmapi.db.backup
            - name: FREEAPI_DB_BACKUP_INTERVAL_MS
              value: "300000"
            # Default is 120 /v1 requests per minute per client IP. In-cluster
            # callers (Hindsight consolidation runs 6 in parallel) all come from a
            # few pod IPs, so 120 would throttle the memory backlog in the proxy
            # itself, before any provider quota matters.
            - name: PROXY_RATE_LIMIT_RPM
              value: "600"
          # ENCRYPTION_KEY (provider keys at rest) and FREEAPI_CONFIG_JSON (the
          # declarative config: admin account, so the unauthenticated first-run
          # setup window never opens; provider keys; routing strategy).
          envFrom:
            - secretRef:
                name: freellmapi-secrets
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/server/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 768Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freellmapi-data
