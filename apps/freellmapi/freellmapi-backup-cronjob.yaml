---
# Daily FreeLLMAPI backup to OMV MinIO (s3://freellmapi-backups/freellmapi/).
# The app itself writes freellmapi.db.backup every 5 minutes: a WAL-checkpointed
# copy of the SQLite DB, gzipped and AES-GCM-encrypted with ENCRYPTION_KEY
# (FREEAPI_DB_BACKUP_PATH in the Deployment). This job only ships that file, so
# MinIO never holds a plaintext DB, and the object is useless without the key in
# freellmapi-secrets (SOPS) — keep both, or the backup is noise.
#
# The app rewrites the file in place (not atomic), so the job reads it twice and
# only uploads when both reads hash the same — a torn copy is retried, not shipped.
# Upload uses AWS SigV4 from the stdlib (fitness/karakeep pattern, no mc binary).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freellmapi-backup
  namespace: freellmapi
spec:
  schedule: "15 4 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            job_name: freellmapi-backup
        spec:
          restartPolicy: OnFailure
          # freellmapi-data is a local-path volume, node-local by definition;
          # the app Deployment carries the same selector.
          # uid 1000 = the app's `node` user: the backup file is mode 0600.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          nodeSelector:
            kubernetes.io/hostname: homelab-2nd
          containers:
            - name: backup
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  echo "Starting FreeLLMAPI backup"
                  python3 - <<'PY'
                  import os, datetime, time
                  import urllib.request, urllib.parse, hashlib, hmac
                  import xml.etree.ElementTree as ET

                  bucket = 'freellmapi-backups'
                  prefix = 'freellmapi/'
                  endpoint = 'http://openmediavault.local:9000'
                  region = 'us-east-1'
                  service = 's3'
                  access_key = os.environ['FREELLMAPI_MINIO_ACCESS_KEY']
                  secret_key = os.environ['FREELLMAPI_MINIO_SECRET_KEY']
                  src = '/data/freellmapi.db.backup'
                  retention_days = 30

                  def sha256(data):
                      return hashlib.sha256(data if isinstance(data, bytes) else data.encode('utf-8')).hexdigest()

                  def sign(key, msg):
                      return hmac.new(key, msg.encode('utf-8'), hashlib.sha256).digest()

                  def get_signature_key(secret, date_stamp, region, service):
                      k_date = sign(('AWS4' + secret).encode('utf-8'), date_stamp)
                      k_region = sign(k_date, region)
                      k_service = sign(k_region, service)
                      return sign(k_service, 'aws4_request')

                  def signed_request(method, path, payload=b'', query='', payload_hash=None, content_length=None):
                      t = datetime.datetime.now(datetime.timezone.utc)
                      date_stamp = t.strftime('%Y%m%d')
                      amz_date = t.strftime('%Y%m%dT%H%M%SZ')
                      if isinstance(payload, str):
                          payload = payload.encode('utf-8')
                      if payload_hash is None:
                          payload_hash = sha256(payload)
                      host = 'openmediavault.local:9000'
                      headers = {
                          'host': host,
                          'x-amz-content-sha256': payload_hash,
                          'x-amz-date': amz_date,
                      }
                      if method in ('PUT', 'POST'):
                          if content_length is None:
                              content_length = len(payload)
                          headers['content-length'] = str(content_length)
                      header_keys = sorted(headers.keys())
                      signed_headers = ';'.join(header_keys)
                      canonical_request = '\n'.join([
                          method,
                          urllib.parse.quote(path, safe='/'),
                          query,
                          ''.join(f'{k}:{headers[k]}\n' for k in header_keys),
                          signed_headers,
                          payload_hash,
                      ])
                      credential_scope = f'{date_stamp}/{region}/{service}/aws4_request'
                      string_to_sign = '\n'.join([
                          'AWS4-HMAC-SHA256',
                          amz_date,
                          credential_scope,
                          sha256(canonical_request.encode('utf-8')),
                      ])
                      signing_key = get_signature_key(secret_key, date_stamp, region, service)
                      signature = hmac.new(signing_key, string_to_sign.encode('utf-8'), hashlib.sha256).hexdigest()
                      headers['Authorization'] = (
                          f'AWS4-HMAC-SHA256 Credential={access_key}/{credential_scope}, '
                          f'SignedHeaders={signed_headers}, Signature={signature}'
                      )
                      url = f'{endpoint}{path}'
                      if query:
                          url = f'{url}?{query}'
                      req = urllib.request.Request(url, data=payload, method=method, headers=headers)
                      return urllib.request.urlopen(req, timeout=120)

                  def read_stable():
                      # Two reads with the same hash = not caught mid-rewrite.
                      for attempt in range(5):
                          with open(src, 'rb') as f:
                              a = f.read()
                          time.sleep(3)
                          with open(src, 'rb') as f:
                              b = f.read()
                          if a and a == b:
                              return a
                          print(f'Backup file changed or empty between reads (attempt {attempt + 1}), retrying')
                          time.sleep(10)
                      raise SystemExit('could not get a stable read of freellmapi.db.backup')

                  if not os.path.exists(src):
                      raise SystemExit(f'{src} missing - is FREEAPI_DB_BACKUP_PATH set and the app running?')
                  age_s = time.time() - os.path.getmtime(src)
                  if age_s > 3600:
                      raise SystemExit(f'{src} is {int(age_s)}s old - the app backup pump has stalled')
                  payload = read_stable()
                  size = len(payload)
                  file_hash = hashlib.sha256(payload).hexdigest()
                  ts = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%S')
                  key = prefix + f'freellmapi-{ts}.db.backup'
                  for attempt in range(3):
                      try:
                          resp = signed_request('PUT', f'/{bucket}/{urllib.parse.quote(key, safe="/")}', payload,
                                                payload_hash=file_hash, content_length=size)
                          print(f'Uploaded -> {bucket}/{key} ({size} bytes, HTTP {resp.status})')
                          break
                      except Exception as e:
                          print(f'Upload attempt {attempt + 1} failed: {e}')
                          if attempt == 2:
                              raise
                          time.sleep(2 ** attempt)

                  # Retention: delete objects older than retention_days.
                  list_query = urllib.parse.urlencode({'list-type': '2', 'prefix': prefix}, quote_via=urllib.parse.quote)
                  list_resp = signed_request('GET', f'/{bucket}', b'', list_query)
                  root = ET.fromstring(list_resp.read())
                  ns = {'s3': 'http://s3.amazonaws.com/doc/2006-03-01/'}
                  cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=retention_days)
                  removed = 0
                  for contents in root.findall('s3:Contents', ns):
                      key_el = contents.find('s3:Key', ns)
                      if key_el is None:
                          continue
                      k = key_el.text
                      last_mod = datetime.datetime.fromisoformat(contents.find('s3:LastModified', ns).text.replace('Z', '+00:00'))
                      if last_mod < cutoff:
                          signed_request('DELETE', f'/{bucket}/{urllib.parse.quote(k, safe="/")}')
                          removed += 1
                          print(f'Removed old backup: {k}')
                  print(f'Retention cleanup complete, removed {removed} objects')
                  PY
                  echo "FreeLLMAPI backup complete"
              env:
                - name: FREELLMAPI_MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: freellmapi-minio-backup-creds
                      key: ACCESS_KEY_ID
                - name: FREELLMAPI_MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: freellmapi-minio-backup-creds
                      key: ACCESS_SECRET_KEY
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: freellmapi-data
                readOnly: true
