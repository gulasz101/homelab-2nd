---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: star-office-db
  namespace: star-office
spec:
  schedule: "0 0 5 * * *"  # 05:00 daily (6-field cron with seconds)
  backupOwnerReference: self
  cluster:
    name: star-office-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
