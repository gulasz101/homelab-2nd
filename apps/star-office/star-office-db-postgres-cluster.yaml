---
# CloudNativePG cluster for Star Office UI (sou)
# Single instance on local-path NVMe; WAL + base backups to OMV MinIO.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: star-office-db
  namespace: star-office
spec:
  instances: 1
  # Switchover (not restart) on any primary pod-spec change: moving node = new replica +
  # promote, never an in-place restart that a node-bound local-path PV can't follow.
  primaryUpdateMethod: switchover
  # local-path PVs are node-bound for life: pin explicitly (H2-306 lesson), node move 2026-11-11.
  affinity:
    nodeSelector:
      kubernetes.io/hostname: loki
  imageName: ghcr.io/cloudnative-pg/postgresql:17-minimal-trixie

  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: sou
      owner: sou_ingest
      secret:
        name: star-office-db-credentials

  storage:
    storageClass: local-path
    size: 5Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: star-office-db-backups
        serverName: star-office-db

  backup:
    retentionPolicy: "30d"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
