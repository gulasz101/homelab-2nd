---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: star-office-ui
  namespace: flux-system
spec:
  image: ghcr.io/gulasz101/star-office-ui-fork
  interval: 5m0s
  secretRef:
    name: regcred  # if needed; public GHCR, but leaving optional
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: star-office-ui
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: star-office-ui
  policy:
    semver:
      range: ">=2.0.0"
