# sou-ingest: LAN/Netbird-only ingest face. One gunicorn worker; in-process state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sou-ingest
  namespace: star-office
  labels:
    app.kubernetes.io/name: sou-ingest
    app.kubernetes.io/part-of: star-office
    app.kubernetes.io/component: ingest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sou-ingest
      app.kubernetes.io/part-of: star-office
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sou-ingest
        app.kubernetes.io/part-of: star-office
        app.kubernetes.io/component: ingest
      annotations:
        # Secret-backed env vars (secretKeyRef) and Secret volumes do NOT
        # refresh in a running pod. When star-office-db-credentials changes,
        # the pod keeps the old DATABASE_URL until it is recreated - and the
        # symptom is a 500/connection error on every star-office push. Bump
        # this counter to roll the pod.
        # GUL-74: bumped for the hermes-matejko token.
        # GUL-76: the token map is gone (ADR-078) - the registry is the
        # database table `ingest_tokens`, read per request, so a token
        # change needs no roll. The counter now guards the DB credentials.
        secret-version: "2"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sou
          image: ghcr.io/gulasz101/star-office-ui-fork:v2.4.0 # {"$imagepolicy": "flux-system:star-office-ui"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 19000
              protocol: TCP
          env:
            - name: SOU_MODE
              value: ingest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: star-office-db-credentials
                  key: ingest_database_url
            - name: SOU_MIGRATE
              value: "1"
          # No SOU_INGEST_TOKENS here on purpose (ADR-078). The per-agent
          # token registry is the database table `ingest_tokens`
          # (sha256(token) -> agent), read per request by the ingest face.
          # The old env map was a second, stale source that shadowed the
          # database and made `tokens.py revoke` a no-op for every agent it
          # still listed. With SOU_MODE=ingest and no map, the door stays
          # LOCKED: only a registered database token opens it.
          # Register a new agent with:
          #   kubectl -n star-office exec deploy/sou-ingest -- \
          #     sh -c 'cd /app/backend && python3 tokens.py register <agent>'
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      # No volumes: the ingest face reads nothing from a Secret volume any
      # more (ADR-078). The token registry is the database.
