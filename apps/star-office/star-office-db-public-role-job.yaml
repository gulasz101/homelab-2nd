---
# One-off Job: create the read-only sou_public role after CNPG bootstrap.
# Connects as the postgres superuser (CNPG creates star-office-db-superuser
# when enableSuperuserAccess is true) so it can create roles and set passwords.
# sou_ingest lacks CREATEROLE, so this job cannot run as sou_ingest.
apiVersion: batch/v1
kind: Job
metadata:
  name: star-office-db-public-role
  namespace: star-office
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: star-office-db-public-role
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:17-minimal-trixie
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cat >/tmp/grant.sql <<EOF
              CREATE ROLE sou_public WITH LOGIN PASSWORD '$SOU_PUBLIC_PASSWORD';
              ALTER ROLE sou_public WITH LOGIN PASSWORD '$SOU_PUBLIC_PASSWORD';
              GRANT CONNECT ON DATABASE sou TO sou_public;
              GRANT USAGE ON SCHEMA public TO sou_public;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO sou_public;
              ALTER DEFAULT PRIVILEGES FOR ROLE sou_ingest IN SCHEMA public GRANT SELECT ON TABLES TO sou_public;
              EOF
              psql -h "$SOU_DB_HOST" -U postgres -d sou -v ON_ERROR_STOP=0 -f /tmp/grant.sql || true
              rm -f /tmp/grant.sql
              echo "sou_public role provisioned"
          env:
            - name: SOU_DB_HOST
              value: star-office-db-rw.star-office.svc.cluster.local
            - name: SOU_PUBLIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: star-office-db-credentials
                  key: sou_public_password
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: star-office-db-superuser
                  key: password
  backoffLimit: 10
