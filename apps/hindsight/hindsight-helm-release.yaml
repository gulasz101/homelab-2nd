---
# Hindsight API + control plane HelmRelease (H2-238, epic H2-232)
#
# The decided configuration lives in apps/hindsight/README.md - this file is the
# machine-readable copy of that table. Nothing here is exploratory.
#
# Summary of the decisions expressed below:
#   - chart pinned 0.10.3 and every image tag pinned to 0.10.3 as well. The chart
#     derives an unset image tag from .Values.version -> Chart.appVersion, so a
#     chart-only pin would let a future chart bump move the app images silently.
#     Two knobs, both pinned.
#   - slim images: embeddings and reranking are served by our own TEI deployments,
#     so the API does not need the ~9 GB full bundle with its baked-in models.
#   - database: the CNPG cluster from H2-236, never the chart's bundled Postgres.
#     The password is read from key `postgres-password` of `hindsight-secrets`
#     because Helm values cannot reference a secret in another namespace - which is
#     exactly why H2-235 mirrored the DB password into this namespace's secret.
#   - LLM traffic goes to the local LiteLLM gateway, not to an upstream vendor.
#   - CPU TEI only: the host GPU is a Maxwell (sm_52) part and TEI's CUDA images
#     need compute capability >= 7.5.
#   - worker.enabled false: the API's internal worker is plenty for one user, and
#     node CPU *requests* are the binding constraint. Revisit on sustained backlog.
#
# Exposure is NOT decided here: the API gets a LAN/Netbird NodePort in H2-239, so
# both Services stay at the chart's ClusterIP default.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
  namespace: hindsight
spec:
  interval: 1h
  chart:
    spec:
      chart: hindsight
      version: "0.10.3"
      sourceRef:
        kind: HelmRepository
        name: hindsight
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # ------------------------------------------------------------------
    # Version pinning - knob 1 of 2
    # ------------------------------------------------------------------
    # Global image tag for every component that does not set its own tag below.
    # Belt and braces: if a future chart version adds a component, this keeps it
    # on 0.10.3 instead of letting it follow the new chart's appVersion. The four
    # components we know about are pinned individually further down (knob 2)
    # because the api/worker need the `-slim` suffix, which this cannot express.
    version: "0.10.3"

    # The secret the chart's own templates read:
    #   - every key is envFrom'd into the api, worker and control-plane containers
    #     (`HINDSIGHT_API_LLM_API_KEY` and `HINDSIGHT_API_TENANT_API_KEY` arrive
    #     this way)
    #   - `postgres-password` is additionally referenced by name, because
    #     `postgres-password` is not a valid environment variable name and is
    #     therefore skipped by envFrom. It feeds $(POSTGRES_PASSWORD), which the
    #     chart interpolates into HINDSIGHT_API_DATABASE_URL.
    existingSecret: hindsight-secrets

    # ------------------------------------------------------------------
    # API
    # ------------------------------------------------------------------
    api:
      # knob 2 of 2: the api image tag is explicit so a chart bump cannot move it
      # (see the version block above). `-slim` because embeddings/reranking are
      # external (our TEI) and the full bundle is ~9 GB of models we never use.
      image:
        repository: ghcr.io/vectorize-io/hindsight-api
        tag: "0.10.3-slim"
        pullPolicy: IfNotPresent

      # HINDSIGHT_API_PORT aside, these are the only api settings the chart does
      # not derive itself. Explicit env beats envFrom, so these win over anything
      # with the same name inside `hindsight-secrets`.
      env:
        # LLM: the local LiteLLM *proxy* (a gateway that already fronts every
        # provider the homelab uses and holds the real upstream keys). It speaks
        # the OpenAI Chat Completions API, so the correct provider here is
        # `openai` pointed at the proxy's /v1 root — NOT `litellm`.
        #
        # `HINDSIGHT_API_LLM_PROVIDER=litellm` means something different: it loads
        # the LiteLLM *library* inside hindsight-api and calls the chosen upstream
        # provider directly, which requires LiteLLM's own prefix format
        # (`azure/gpt-4o`, `openai/gpt-4o`). Against a proxy that fails at the first
        # retain with:
        #   litellm.BadRequestError: LLM Provider NOT provided.
        #   You passed model=nemotron-3-nano-30b-ollama
        # i.e. the deployment comes up healthy, MCP answers, recall returns empty —
        # and *nothing can ever be stored*. Verified 2026-10-13 (H2-279).
        HINDSIGHT_API_LLM_PROVIDER: openai
        # Retargeted 2026-10-14 from nemotron-3-nano-30b-ollama (Ollama Cloud)
        # to gpt-oss-120b via OpenRouter. Every retain was failing with
        #   429 'timed out waiting for a concurrent request slot'
        # generated by LiteLLM itself — its upstream slot pool for ollama.com
        # was exhausted, so even a trivial "Say OK" request timed out at 90-120s.
        # This cost nothing to diagnose but hours of failed migration (H2-284).
        #
        # H2-307: 42 s average retain on the price-sorted OpenRouter route
        # (gpt-oss-120b-openrouter) with default reasoning (~1.1k reasoning
        # tokens/call). Switch to the dedicated throughput-sorted route
        # (gpt-oss-120b-hindsight, :nitro) and pin reasoning_effort=low for both
        # retain and consolidation to cut latency and cost.
        HINDSIGHT_API_LLM_MODEL: gpt-oss-120b-hindsight
        # Consolidation runs on the OpenCode Go subscription (flat fee) instead of
        # paid OpenRouter credit: LiteLLM alias `hindsight-consolidation-go` =
        # free minimax-m3.1-flash, falling back to deepseek-v4.1-flash on Go and
        # only then to gpt-oss-120b on OpenRouter. Replay-tested on 8 real
        # consolidation prompts: both Go models 8/8 valid, faster than gpt-oss
        # (H2-306, 2026-10-19). Ollama Cloud stays rejected (rate limiting).
        # Retain stays on :nitro (gpt-oss-120b-hindsight) because agents wait on it.
        HINDSIGHT_API_CONSOLIDATION_LLM_MODEL: hindsight-consolidation-go
        # GUL-97 (2026-10-22): outer budget for ONE consolidation LLM call.
        # LiteLLM gives MiniMax 120 s and then falls back to DeepSeek on the
        # Go plan (apps/llm-hub/litellm-helm-release.yaml, route
        # hindsight-consolidation-go). 210 s = 120 s primary + 90 s fallback,
        # so Hindsight stops cancelling calls LiteLLM is about to rescue.
        # GUL-108 (2026-10-22) raised the primary budget from 60 s after the
        # live route measured p95 53.5 s and ~48% of consolidation calls
        # hopping to deepseek-v4.1-flash-go at the 60 s cliff; Hindsight's
        # batch log showed those calls completing in 77-106 s total. The
        # inherited default of 120 s used to fire while LiteLLM was still
        # waiting on MiniMax with its own 6000 s default - the fallback never
        # ran and the slow tail was cancelled and retried from scratch forever.
        # Keep this ABOVE the LiteLLM route timeout; render-check.sh asserts
        # the ordering and the >=90 s fallback window.
        HINDSIGHT_API_CONSOLIDATION_LLM_TIMEOUT: "210"
        # NO *_LLM_REASONING_EFFORT here: LiteLLM rejects it for this route with
        #   400 UnsupportedParamsError: openrouter does not support parameters:
        #   ['reasoning_effort'], for model=openai/gpt-oss-120b:nitro
        # and every retain failed from 08:37 to the revert (H2-306, 2026-10-19).
        # Reasoning control, if wanted, belongs in the LiteLLM model entry.
        HINDSIGHT_API_LLM_BASE_URL: http://litellm.llm-hub.svc.cluster.local:4000/v1
        # Consolidation death spiral (H2-306, 2026-10-19): on our hub-heavy banks
        # (entities like the owner or "homelab" sit on thousands of facts) the
        # link-expansion graph query (`WITH seed_sources ...`) ran 45 s+ with six
        # copies in parallel. LINK_EXPANSION_TIMEOUT (10 s) only stops the client
        # waiting; Postgres kept running the abandoned query for up to
        # DB_STATEMENT_TIMEOUT (default 600 s). They piled up, pegged the DB at its
        # 2-CPU limit, and CNPG's liveness probe killed Postgres (6 restarts).
        #   - DB_STATEMENT_TIMEOUT 60: Postgres itself cancels runaway statements.
        #   - LINK_EXPANSION_PER_ENTITY_LIMIT 50 (default 200): caps the hub fan-out
        #     that makes the query expensive in the first place.
        #   - CONSOLIDATION_LLM_PARALLELISM: was 2 while the DB was on zigbee-node;
        #     6 since the DB moved to homelab-2nd (3 CPU / 6Gi). Each Hermes session
        #     is its own tag group, so a ~48k-fact backlog parallelises well.
        #   - CONSOLIDATION_LLM_BATCH_SIZE stays at the default 8: at 16, ~10% of
        #     consolidation calls failed validation (gpt-oss dropped required
        #     fields like source_fact_ids in the longer structured answers).
        HINDSIGHT_API_DB_STATEMENT_TIMEOUT: "60"
        HINDSIGHT_API_LINK_EXPANSION_PER_ENTITY_LIMIT: "50"
        HINDSIGHT_API_CONSOLIDATION_LLM_PARALLELISM: "6"
        #   - DB_POOL_MAX_SIZE 30 (default 100): each Postgres backend can use
        #     several work_mem buffers; 100 busy connections pushed the DB to its
        #     memory limit during the backfill (H2-306).
        HINDSIGHT_API_DB_POOL_MAX_SIZE: "30"
        # Stable worker id (H2-306). On startup a worker only recovers tasks left
        # in 'processing' under ITS OWN worker_id, which defaults to the hostname,
        # i.e. the pod name, and that changes on every rollout. So every restart
        # orphaned the in-flight consolidations and blocked those banks for good
        # (5 days on 10-14..10-19). A fixed id lets each new pod reclaim them.
        # Safe only with ONE replica and the Recreate strategy (postRenderer below).
        HINDSIGHT_API_WORKER_ID: hindsight-api
        # ------------------------------------------------------------------
        # Reranker saturation (GUL-93 / GUL-88): cap the cross-encoder pool.
        # ------------------------------------------------------------------
        # The single TEI reranker (1 replica, 2 CPU, default 512 slots) is
        # saturated by the internal worker's consolidation backlog. Every
        # consolidation recall (budget=low) and every interactive recall
        # (budget=mid) reranks up to 300 candidates, i.e. 3 x 128-text TEI
        # batches. Six consolidation recalls in flight (CONSOLIDATION_LLM_
        # PARALLELISM 6) queue behind each other, and interactive recalls
        # exceed the 30 s TEI HTTP timeout ("TEI rerank request failed:
        # Timeout on reading data from socket", ~125 s observed).
        #
        # MAX_CANDIDATES_LOW / _MID = 100 cut that to ONE batch per recall,
        # both for the consolidation recalls that saturate the pool and for
        # the interactive mid-budget recalls that were timing out. Default is
        # 0, which falls back to MAX_CANDIDATES=300. HIGH stays at the default
        # (comprehensive reasoning keeps the full pool).
        HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "100"
        HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID: "100"
        # MCP auth ON: the tenant extension makes the API require the tenant key
        # that arrives via envFrom (HINDSIGHT_API_TENANT_API_KEY).
        HINDSIGHT_API_TENANT_EXTENSION: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
        # TEI providers: deliberately NOT set in this env block, and they must
        # never be added back to it. While `tei.embedding.enabled` /
        # `tei.reranker.enabled` are true (bottom of this file), the chart emits
        # these four entries itself:
        #   HINDSIGHT_API_EMBEDDINGS_PROVIDER = tei
        #   HINDSIGHT_API_EMBEDDINGS_TEI_URL  = http://hindsight-tei-embedding:8091
        #   HINDSIGHT_API_RERANKER_PROVIDER   = tei
        #   HINDSIGHT_API_RERANKER_TEI_URL    = http://hindsight-tei-reranker:8090
        # Declaring the two *_PROVIDER keys here as well would render each key
        # NAME twice in the api container's env list, and Kubernetes server-side
        # apply rejects that outright:
        #   .spec.template.spec.containers[name="api"].env: duplicate entries for
        #   key [name="HINDSIGHT_API_EMBEDDINGS_PROVIDER"]
        # That is NOT cosmetic, and "the chart's value wins anyway" is wrong: the
        # api Deployment is then never created at all, the HelmRelease stalls on
        # MissingRollbackTarget, and the API simply has no backend. It cost us
        # exactly that on 2026-10-13 (H2-271). The four values above are the
        # chart's to own; tests/render-check.sh asserts both providers are still
        # `tei` AND that no env key name repeats anywhere in the render.

        # ------------------------------------------------------------------
        # Traces -> the homelab's OTel Collector -> Tempo (H2-242)
        # ------------------------------------------------------------------
        # Hindsight ships OpenTelemetry tracing for operations and LLM calls
        # (GenAI semantic conventions), and it continues a caller's W3C trace
        # context when one is sent - so a recall triggered from an agent appears
        # under that agent's trace rather than as a parallel one. Off by default
        # upstream (`otel_traces_enabled` defaults to False), so without these
        # three lines nothing ever reaches Tempo and H2-242's "traces reach
        # Tempo" acceptance test is unprovable.
        # The endpoint is the Collector's OTLP/HTTP port on the Service the
        # collector chart renders in `observability` (verified by rendering
        # opentelemetry-collector with mode=daemonset: Service
        # `opentelemetry-collector`, ports 4317 gRPC / 4318 HTTP). HTTP, not gRPC:
        # that is the endpoint the upstream docs use for this variable.
        # Health and /metrics are excluded from tracing by the app's default
        # OTEL_PYTHON_FASTAPI_EXCLUDED_URLS, so probe traffic stays out of Tempo.
        HINDSIGHT_API_OTEL_TRACES_ENABLED: "true"
        HINDSIGHT_API_OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.observability.svc.cluster.local:4318"
        HINDSIGHT_API_OTEL_SERVICE_NAME: "hindsight-api"

        # ------------------------------------------------------------------
        # Queue-depth gauges for the API's internal worker (H2-242)
        # ------------------------------------------------------------------
        # `metrics_backlog_enabled` defaults to False because it runs periodic
        # per-schema COUNT queries. With worker.enabled=false the API's internal
        # worker drains everything, so these three gauges
        # (hindsight_async_operations, hindsight_consolidation_backlog,
        # hindsight_consolidation_failed) are the only "is the worker keeping up?"
        # signal - and the only way to see a hung operation stuck holding the
        # worker slot. One user, one tenant: the COUNTs are trivial here.
        HINDSIGHT_API_METRICS_BACKLOG_ENABLED: "true"

        # ------------------------------------------------------------------
        # MCP tool-description guidance (open-webui wiring, 2026-10-15)
        # ------------------------------------------------------------------
        # Open WebUI exposes Hindsight as native MCP tools; the chat model only
        # benefits if it actually CALLS recall/retain. Appended to the built-in
        # tool descriptions so every MCP client sees the fleet-wide rule:
        # which bank owns chat memories and when recall must run first.
        HINDSIGHT_API_MCP_INSTRUCTIONS: "Banks: chat memories (ai-chat conversations) live in the 'open-webui' bank - retain there. The hermes-* banks are read-only knowledge from the homelab's agent fleet (Andrzej, Szarik, ...). Before answering questions about the user's past, preferences, prior work, the homelab, or anything discussed in earlier chats, call recall FIRST (bank_id 'open-webui' for chat-shared facts, 'hermes-andrzej' or another hermes-* bank for agent knowledge, or omit bank_id to search across banks). When the user asks you to remember something, call sync_retain right away."

      # External models, external TEI: a model-cache PVC would only pin the api pod
      # to one node (ReadWriteOnce) and there is nothing local to cache.
      persistence:
        modelCache:
          enabled: false

      # Requests are deliberately modest: the node is already at ~78% CPU requests,
      # and this workload is I/O-bound on Postgres and LiteLLM. Limits stay generous
      # because the burst (embedding/consolidation passes) is short and rare.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 3Gi

      # ClusterIP, on purpose - H2-239 adds the LAN/Netbird NodePort.
      service:
        type: ClusterIP

    # ------------------------------------------------------------------
    # Control plane (Next.js UI)
    # ------------------------------------------------------------------
    controlPlane:
      # The control plane IS the full image: upstream publishes no `-slim` variant
      # for it, so it is pinned to the plain 0.10.3 tag.
      image:
        repository: ghcr.io/vectorize-io/hindsight-control-plane
        tag: "0.10.3"
        pullPolicy: IfNotPresent

    # ------------------------------------------------------------------
    # Worker
    # ------------------------------------------------------------------
    worker:
      # The API's internal worker handles one user's traffic. Turning this on adds a
      # second pod that would also hold a slice of the model cache and wait in the
      # CPU-request queue. Revisit when the internal worker shows a sustained
      # backlog (that is the trigger, not "we have CPU one day").
      enabled: false
      image:
        # Inert while enabled: false - set for the same reason as the api tag, so
        # whoever flips the switch gets the slim image and not a 9 GB pull.
        repository: ghcr.io/vectorize-io/hindsight-api
        tag: "0.10.3-slim"
        pullPolicy: IfNotPresent

    # ------------------------------------------------------------------
    # Database: our CNPG cluster, never the chart's bundled Postgres
    # ------------------------------------------------------------------
    postgresql:
      enabled: false
      external:
        host: hindsight-db-rw.hindsight.svc.cluster.local
        port: 5432
        database: hindsight
        username: hindsight
        # No password here and none possible: this file is public. The chart reads
        # `postgres-password` from existingSecret (above) and interpolates it into
        # HINDSIGHT_API_DATABASE_URL. Do not add `external.password` - that would
        # both leak a credential and render a chart-managed Secret.

    # ------------------------------------------------------------------
    # Embeddings + reranker: CPU TEI sidecars of this chart
    # ------------------------------------------------------------------
    # Both models are CPU-served on purpose. The host GPU is a GTX 970M (Maxwell,
    # compute capability 5.2) and TEI's published CUDA images require >= 7.5. The
    # `test-embeddings-inference` docs are indexed in docs-mcp if that is ever
    # revisited (moving embeddings to the GPU's Ollama is a provider swap, see the
    # README). Image tag and resources stay at the chart's cpu-1.8.3 defaults, which
    # are pinned by the chart version.
    tei:
      embedding:
        enabled: true
        # MAX_CLIENT_BATCH_SIZE is TEI's cap on inputs per /embed call. The
        # default 256 413s on dense documents: Hindsight embeds every memory
        # unit of a doc in ONE request, so any doc that yields 257+ facts
        # (e.g. long architecture/reference notes) fails its whole retain with
        # "Failed to generate batch embeddings: TEI ... HTTP 413". 512 covers
        # the whole known corpus. Verified 2026-10-14: 256 inputs OK, 257 ->
        # HTTP 413 'batch size 257 > maximum allowed batch size 256'.
        env:
          MAX_CLIENT_BATCH_SIZE: "512"
        # --auto-truncate: TEI's per-input token cap is the model's context
        # (256 for MiniLM). Without it, any chunk over 256 tokens fails the
        # ENTIRE retain with HTTP 413 'inputs must have less than 256 tokens.
        # Given: 272'. The chart gives the reranker this flag by default but
        # NOT the embedder - asymmetry, presumably an upstream oversight.
        # Truncation loses the tail of very long chunks; acceptable loss
        # versus a hard failure. Verified 2026-10-14.
        args:
          - "--auto-truncate"
      reranker:
        enabled: true
        # GUL-93: right-size the TEI slot pool. TEI reserves one slot per text
        # in a rerank request and refuses work once its pool is full. The API
        # defaults send up to MAX_CONCURRENT(8) x BATCH_SIZE(128) = 1024 texts,
        # but TEI's own default is 512 slots - half that. The docs call this out
        # explicitly: start with at least 1024 slots (--max-concurrent-requests).
        # args REPLACES the chart's default [--auto-truncate], so it is repeated.
        args:
          - "--auto-truncate"
          - "--max-concurrent-requests"
          - "1024"

    # ------------------------------------------------------------------
    # Metrics: the API's /metrics endpoint into the homelab Prometheus
    # ------------------------------------------------------------------
    # Only the api monitor renders (the worker one is gated on worker.enabled).
    # `release: prometheus-stack` is the label the live Prometheus selects on.
    metrics:
      serviceMonitor:
        enabled: true
        labels:
          release: prometheus-stack

  # ==================================================================
  # STARTUP GATE for the api container (H2-275)
  # ==================================================================
  # THE EVIDENCE. Pod `hindsight-api-55b6d8c954-bcwmh` on `zigbee-node`,
  # 2026-10-13 05:35 CEST (read-only probe of the live cluster; the pod was in
  # CrashLoopBackOff with 13 restarts):
  #
  #   Last State: Terminated   Reason: Completed   Exit Code: 0
  #   Started 05:35:06 CEST    Finished 05:36:04 CEST        # 58 s alive
  #   Liveness:  http-get http://:8888/health/live delay=30s timeout=5s
  #              period=10s #success=1 #failure=3
  #   Events:    Liveness probe failed: dial tcp 10.42.3.251:8888:
  #              connect: connection refused
  #              Container api failed liveness probe, will be restarted
  #   Last log:  "Loaded tenant extension: ApiKeyTenantExtension"
  #              "Received signal 15, shutting down..."
  #
  # Exit code 0, no traceback, and no "Uvicorn running on ...": the app did not
  # crash, kubelet reaped it. Config + extension loading alone took 23 s
  # (03:35:32 -> 03:35:55) and :8888 had still not bound when the liveness budget
  # expired - 30 s initialDelaySeconds + 3 x 10 s periodSeconds = 60 s to the
  # first success, on a node that is also running this release's CNPG primary.
  #
  # THE FIX. A startupProbe on :8888. Until it succeeds kubelet suspends BOTH the
  # liveness and the readiness probe, so a slow boot gets one explicit budget and
  # then liveness resumes with its own semantics intact - liveness is deliberately
  # NOT disabled, because a process that hangs AFTER startup must still be
  # restarted. Budget: failureThreshold 30 x periodSeconds 10 s = 300 s (5 min)
  # plus a 5 s per-attempt timeout, i.e. ~13x the 23 s of extension loading seen
  # live, while a genuinely hung boot is still killed inside the 5th minute.
  #
  # WHY NOT A VALUES KNOB: chart 0.10.3 exposes `api.livenessProbe` and
  # `api.readinessProbe` (the two objects below) but renders NO startupProbe at
  # all - `templates/api-deployment.yaml` emits `livenessProbe:` and
  # `readinessProbe:` and nothing else - and it has no probe extension point. So
  # the chart's two probes are left exactly as they are and the gate is added to
  # the rendered Deployment through `spec.postRenderers`, the supported kustomize
  # hook that helm-controller runs on every render. Same mechanism, same reason,
  # as apps/shlink, apps/itsaplan and apps/zigbee/node-red.
  #
  # `containers/0` is the api container: the chart's template writes it first,
  # before `api.extraContainers`, and this release defines no extra containers.
  #
  # tests/render-check.sh section 5m replays this patch through `kubectl
  # kustomize` over `helm template` of the pinned chart - the same two-step render
  # helm-controller performs - and asserts the probe, the 300 s budget and that
  # liveness/readiness come through untouched. So the assertion is on the object
  # that reaches the cluster, not on the chart's raw output.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: hindsight-api
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /health/live
                    port: 8888
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              # Recreate, not RollingUpdate (H2-306): with the stable
              # HINDSIGHT_API_WORKER_ID below, two overlapping pods would share
              # one worker id and the new pod would "recover" tasks the old pod
              # is still running. The old pod must be gone first.
              # `rollingUpdate: null` is required: helm-controller uses server-side
              # apply, which otherwise keeps the live object's rollingUpdate block
              # and the API rejects it ("may not be specified when strategy type
              # is Recreate"); an explicit null removes the field.
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
                  rollingUpdate: null
