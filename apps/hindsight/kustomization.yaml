---
# ============================================================
# Hindsight — agent memory platform (H2-232)
#
# Nested kustomization, same shape as apps/zigbee/ and apps/arr-stack/: the
# group has one render path and its own file list, so the shared
# apps/kustomization.yaml only ever carries the single `- hindsight/` entry.
#
# ORDER MATTERS for the SOPS secrets: they must exist before the HelmRelease
# consumes them (the api pod reads `postgres-password` out of
# hindsight-secrets), and before the CNPG cluster bootstraps from
# hindsight-db-credentials.
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml

  # --- credentials (SOPS; encrypted with the repo age recipient) ---
  # hindsight-db-credentials  : username+password for the CNPG app role
  #                             (referenced by bootstrap.initdb.secret)
  # hindsight-secrets         : the chart's existingSecret -- envFrom'd, AND the
  #                             source of `postgres-password` that
  #                             api-deployment/worker-statefulset read whenever
  #                             postgresql.enabled=false. Also carries
  #                             HINDSIGHT_API_LLM_API_KEY (the LiteLLM virtual
  #                             key `memory-hindsight`) and the MCP tenant key.
  # hindsight-minio-backup-creds : OMV MinIO user scoped to cnpg-backups/hindsight
  - hindsight-db-credentials.sops.yaml
  - hindsight-secrets.sops.yaml
  - hindsight-minio-backup-creds.sops.yaml

  # --- CNPG cluster (H2-236) ---
  # The Cluster consumes hindsight-db-credentials (the initdb owner role) and
  # hindsight-minio-backup-creds (barman WAL archiving + base backups to
  # s3://cnpg-backups/hindsight); the ScheduledBackup consumes the Cluster.
  # Order therefore matters: secrets, then the ObjectStore (the plugin reads its
  # destination and credentials from it), then the Cluster, then its backups.
  - hindsight-db-objectstore.yaml
  - hindsight-db-postgres-cluster.yaml
  - hindsight-scheduled-backup.yaml

  # --- Helm chart source + release (H2-238) ---
  # The HelmRepository is declared in flux-system (with every other one in this
  # repo) and the HelmRelease in hindsight refers to it cross-namespace, so the
  # repository has to come first: Flux resolves the sourceRef before it renders a
  # release, and an unresolvable source leaves the HelmRelease NotReady.
  - hindsight-helm-repository.yaml
  - hindsight-helm-release.yaml

  # --- LAN/Netbird exposure (H2-239) ---
  # The chart's own Services stay ClusterIP: it has no nodePort value, so the
  # Hermes hosts (outside the cluster) reach Hindsight through these two fixed
  # NodePorts - api 30239, control plane 30240, no public hostname. The chosen
  # ports are documented in the file along with the neighbours they avoid.
  - hindsight-service.yaml

  # --- Public ingress (H2-241) ---
  # hindsight.voitech.dev is served by a dedicated Cloudflare Tunnel, created via
  # the Cloudflare API (ADR-032), whose origin is the SSO gate and NOT the control
  # plane: the CP has no authentication of its own, so
  #   Tunnel -> hindsight-oauth2-proxy (Authentik OIDC) -> hindsight-control-plane
  # Order matters: the tunnel-token Secret and the oauth2-proxy credentials must
  # exist before the Deployments that mount them, and the proxy Service should be
  # up before cloudflared starts dialling its origin.
  #
  # hindsight-tunnel-token      : the tunnel's own token (SOPS, repo recipient)
  # hindsight-oauth2-proxy      : Authentik client-id / client-secret / cookie-secret
  #                               (SOPS) - provider declared in
  #                               infrastructure/auth/authentik-blueprint-secret.sops.yaml
  - hindsight-tunnel-token.sops.yaml
  - hindsight-oauth2-proxy.sops.yaml
  - hindsight-oauth2-proxy-service.yaml
  - hindsight-oauth2-proxy-deployment.yaml
  - cloudflared-hindsight-deployment.yaml
  - hindsight-tunnel-ingress-configmap.yaml

  # --- Observability (H2-242) ---
  # The ServiceMonitor is NOT here on purpose: the chart renders it from
  # metrics.serviceMonitor (labelled release: prometheus-stack), and a second
  # hand-written one would scrape the api twice.
  #
  # All three objects below live in the `observability` namespace, not in
  # `hindsight` - and that is deliberate:
  #   * AlertmanagerConfig: the operator resolves a receiver's urlSecret only in
  #     the config's OWN namespace, and Hindsight has no Mattermost webhook
  #     secret (H2-235's bundle never minted one; a webhook URL is a secret that
  #     must not be invented). So it reuses the existing
  #     homelab-node-mattermost-webhook-url in `observability`, exactly as the
  #     cnpg-backup / homelab-node / flux-gitops / mail-archiver configs do.
  #     The operator then appends `namespace=observability` to the generated
  #     route (AlertmanagerConfigMatcherStrategy, default OnNamespace), which is
  #     why every alert in hindsight-prometheus-rules.yaml is labelled
  #     `namespace: observability` even though its expression selects
  #     namespace="hindsight". Reversal recipe: hindsight-alertmanager-config.yaml.
  #   * PrometheusRule: sits beside that config so the routing label is not a
  #     lie; the Prometheus ruleSelector is label-based (release:
  #     prometheus-stack) and ruleNamespaceSelector is empty, so a rule in any
  #     namespace loads. Do NOT swap the two labels: PrometheusRules use
  #     `release: prometheus-stack`, AlertmanagerConfigs use
  #     `release: kube-prometheus-stack`.
  #   * dashboard ConfigMap: the Grafana sidecar provisions ConfigMaps labelled
  #     grafana_dashboard=1 into the folder named by the grafana.folder
  #     annotation. Every sibling app dashboard in this repo lives in
  #     `observability` with the same shape.
  #
  # The dashboards are the three upstream JSON files fetched verbatim from
  # monitoring/grafana/dashboards/ at tag v0.10.3 (Hindsight Operations, Hindsight
  # LLM Metrics, Hindsight API Service) - not hand-drawn panels. Two editing
  # gotchas, recorded here because a JSON ConfigMap cannot carry comments:
  #   1. Units belong at fieldConfig.defaults.unit. Grafana silently ignores
  #      custom.unit and then formats every panel with the default unit.
  #   2. Every panel filters on `tenant=~"$tenant"` and the $tenant template
  #      variable is a label_values() query with includeAll + allValue ".*", so it
  #      resolves to All by default and the panels render non-empty while the
  #      tenant label is off (HINDSIGHT_API_METRICS_INCLUDE_TENANT defaults to
  #      false). If a future edit switches that variable to a concrete value, the
  #      panels go blank on a deployment whose metrics carry no tenant label.
  - hindsight-prometheus-rules.yaml
  - hindsight-alertmanager-config.yaml
  - hindsight-dashboard-configmap.yaml
