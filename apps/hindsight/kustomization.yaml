---
# ============================================================
# Hindsight — agent memory platform (H2-232)
#
# Nested kustomization, same shape as apps/zigbee/ and apps/arr-stack/: the
# group has one render path and its own file list, so the shared
# apps/kustomization.yaml only ever carries the single `- hindsight/` entry.
#
# ORDER MATTERS for the SOPS secrets: they must exist before the HelmRelease
# consumes them (the api pod reads `postgres-password` out of
# hindsight-secrets), and before the CNPG cluster bootstraps from
# hindsight-db-credentials.
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml

  # --- credentials (SOPS; encrypted with the repo age recipient) ---
  # hindsight-db-credentials  : username+password for the CNPG app role
  #                             (referenced by bootstrap.initdb.secret)
  # hindsight-secrets         : the chart's existingSecret -- envFrom'd, AND the
  #                             source of `postgres-password` that
  #                             api-deployment/worker-statefulset read whenever
  #                             postgresql.enabled=false. Also carries
  #                             HINDSIGHT_API_LLM_API_KEY (the LiteLLM virtual
  #                             key `memory-hindsight`) and the MCP tenant key.
  # hindsight-minio-backup-creds : OMV MinIO user scoped to cnpg-backups/hindsight
  - hindsight-db-credentials.sops.yaml
  - hindsight-secrets.sops.yaml
  - hindsight-minio-backup-creds.sops.yaml

  # --- CNPG cluster (H2-236) ---
  # The Cluster consumes hindsight-db-credentials (the initdb owner role) and
  # hindsight-minio-backup-creds (barman WAL archiving + base backups to
  # s3://cnpg-backups/hindsight); the ScheduledBackup consumes the Cluster.
  # Order therefore matters: secrets, then the Cluster, then its backups.
  - hindsight-db-postgres-cluster.yaml
  - hindsight-scheduled-backup.yaml

  # --- Helm chart source + release (H2-238) ---
  # The HelmRepository is declared in flux-system (with every other one in this
  # repo) and the HelmRelease in hindsight refers to it cross-namespace, so the
  # repository has to come first: Flux resolves the sourceRef before it renders a
  # release, and an unresolvable source leaves the HelmRelease NotReady.
  - hindsight-helm-repository.yaml
  - hindsight-helm-release.yaml

  # --- LAN/Netbird exposure (H2-239) ---
  # The chart's own Services stay ClusterIP: it has no nodePort value, so the
  # Hermes hosts (outside the cluster) reach Hindsight through these two fixed
  # NodePorts - api 30239, control plane 30240, no public hostname. The chosen
  # ports are documented in the file along with the neighbours they avoid.
  - hindsight-service.yaml
