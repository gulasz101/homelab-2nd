---
# Daily scheduled base backup for the Hindsight CNPG cluster (H2-232).
#
# Uses the Barman Cloud CNPG-I plugin (ADR-081), same shape as the other eleven
# clusters: `method: plugin` + `pluginConfiguration` names the WAL archiver
# plugin, and the ObjectStore (`hindsight-db-objectstore.yaml`) holds the
# destination and retention.
#
# `immediate: true` takes the first base backup as soon as this lands, so the
# s3://cnpg-backups/hindsight tree is populated before the restore ticket
# (H2-237) tries to prove a restore. Without it the first backup would only
# exist after the next 03:00 and a same-day restore drill would have nothing to
# restore from but WAL.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: hindsight-db-backup
  namespace: hindsight
spec:
  schedule: "0 0 3 * * *"  # 03:00 daily (6-field cron with seconds)
  backupOwnerReference: self
  cluster:
    name: hindsight-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
