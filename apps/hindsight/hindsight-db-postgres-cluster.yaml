---
# ============================================================
# CNPG Cluster for Hindsight — the agent-memory platform (H2-232)
#
# Single instance on the homelab-2nd NVMe via `local-path` — fast, and NOT
# durable. Durability is the barman WAL archiving + base backups to OMV MinIO
# below (guardrail 4: OMV is the only durable store, this node is rebuildable).
#
# IMAGE CHOICE: the DEFAULT `postgresql:16` flavour, deliberately not
# `-minimal`/`-standard`, because the schema needs pgvector (the `vector`
# extension). Since ADR-081 the barman-cloud tooling comes from the plugin
# sidecar, not the operand, so a future rebuild could move to
# `postgresql:16-minimal-trixie` + an `extensions:` pgvector image; that image
# change is deliberately NOT part of the backup migration (GUL-90).
#
# Barman `serverName` generation convention: see
# docs/cnpg-backup-servername-generations.md. This is generation 2 (H2-306): it
# recovered from `hindsight-db` and archives into `hindsight-db-gen2`. The next
# rebuild recovers from `hindsight-db-gen2` and archives into `hindsight-db-gen3`
# — always both sides together.
# ============================================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-db
  namespace: hindsight
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  # Pinned to homelab-2nd (architecture: live DB PVCs on its NVMe). Generation 1
  # had no pin, so local-path bound its PV to `zigbee-node` (2 GB ARM board) and
  # every Hindsight timeout/restart from 10-13 to 10-19 traced back to that
  # (H2-306). A local-path PV is node-bound for life, so the pin must exist
  # BEFORE the first pod is scheduled; this is why generation 2 exists.
  affinity:
    nodeSelector:
      kubernetes.io/hostname: homelab-2nd

  # Sized for homelab-2nd (8c/31GB). H2-307 measured ~56% CPU throttling at 1
  # core during backlog consolidation.
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"

  # Generation 2 (H2-306, 2026-10-19): recovered from generation 1's base backup
  # + WAL in OMV MinIO (`serverName: hindsight-db`). The restored database
  # already contains the `vector` extension, which generation 1 created via
  # initdb `postInitApplicationSQL` (the app role `hindsight` is not a superuser).
  # A from-scratch rebuild without a backup would need that initdb block back.
  bootstrap:
    recovery:
      source: origin
      database: hindsight
      owner: hindsight
      secret:
        name: hindsight-db-credentials

  # The recovery source: generation 1's history, which generation 2 was restored
  # from. CNPG only reads it at bootstrap, so it is inert on a running cluster.
  # Plugin form since ADR-081; same ObjectStore as the archiver, different
  # serverName (generation 1 = the un-suffixed cluster name).
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: hindsight-db-backups
          # Previous generation (recovery source); bump to the prior genN on rebuild.
          serverName: hindsight-db

  # Storage — local-path on the homelab-2nd NVMe (fast, NOT durable).
  storage:
    storageClass: local-path
    size: 10Gi

  # Backup + WAL archiving -> OMV MinIO S3 (the durable copy), through the
  # barman-cloud CNPG-I plugin since ADR-081. The in-tree
  # `backup.barmanObjectStore` API is deprecated (CNPG >= 1.26) and mutually
  # exclusive with plugins; retentionPolicy lives in the ObjectStore.
  #
  # serverName stays `hindsight-db-gen2`: this is a migration, not a rebuild, so
  # the plugin must continue the same archive the in-tree archiver was writing.
  # See docs/cnpg-backup-servername-generations.md.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hindsight-db-backups
        # Current generation (archiver target); bump to "<name>-genN" (fresh) on rebuild.
        serverName: hindsight-db-gen2

  # homelab-2nd sizing. 3Gi was not enough during the H2-306 backfill plus the
  # first real consolidation in five days: the pod sat at 3065Mi/3Gi and 1.8 CPU,
  # stopped answering its liveness probe and was killed. 6Gi on a 31 GB node; the
  # memory request is raised to 2Gi so the scheduler accounts for it. CPU limit 5:
  # at 3 the DB sat pinned at 3002m during backfill + consolidation and the API's
  # DB-backed readiness probe timed out (node itself at 58%). CPU requests stay
  # low because the node is ~78% CPU-committed.
  resources:
    requests:
      memory: "2Gi"
      cpu: "250m"
    limits:
      memory: "6Gi"
      cpu: "5000m"
