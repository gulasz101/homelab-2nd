---
# ============================================================
# CNPG Cluster for Hindsight — the agent-memory platform (H2-232)
#
# Single instance on the homelab-2nd NVMe via `local-path` — fast, and NOT
# durable. Durability is the barman WAL archiving + base backups to OMV MinIO
# below (guardrail 4: OMV is the only durable store, this node is rebuildable).
#
# IMAGE CHOICE: the DEFAULT `postgresql:16` flavour, deliberately not
# `-minimal`/`-standard`. It is the only CNPG operand image that ships BOTH
# pgvector (Hindsight's schema needs the `vector` extension) and `barman-cloud`
# (the in-tree `backup.barmanObjectStore` needs it inside the operand). Same
# choice and same reason as the live apps/honcho/postgres-cluster.yaml.
#
# Barman `serverName` generation convention: see
# docs/cnpg-backup-servername-generations.md. This is generation 2 (H2-306): it
# recovered from `hindsight-db` and archives into `hindsight-db-gen2`. The next
# rebuild recovers from `hindsight-db-gen2` and archives into `hindsight-db-gen3`
# — always both sides together.
# ============================================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-db
  namespace: hindsight
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  # Pinned to homelab-2nd (architecture: live DB PVCs on its NVMe). Generation 1
  # had no pin, so local-path bound its PV to `zigbee-node` (2 GB ARM board) and
  # every Hindsight timeout/restart from 10-13 to 10-19 traced back to that
  # (H2-306). A local-path PV is node-bound for life, so the pin must exist
  # BEFORE the first pod is scheduled; this is why generation 2 exists.
  affinity:
    nodeSelector:
      kubernetes.io/hostname: homelab-2nd

  # Sized for homelab-2nd (8c/31GB). H2-307 measured ~56% CPU throttling at 1
  # core during backlog consolidation.
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"

  # Generation 2 (H2-306, 2026-10-19): recovered from generation 1's base backup
  # + WAL in OMV MinIO (`serverName: hindsight-db`). The restored database
  # already contains the `vector` extension, which generation 1 created via
  # initdb `postInitApplicationSQL` (the app role `hindsight` is not a superuser).
  # A from-scratch rebuild without a backup would need that initdb block back.
  bootstrap:
    recovery:
      source: origin
      database: hindsight
      owner: hindsight
      secret:
        name: hindsight-db-credentials

  # The recovery source: generation 1's history, which generation 2 was restored
  # from. CNPG only reads it at bootstrap, so it is inert on a running cluster.
  externalClusters:
    - name: origin
      barmanObjectStore:
        destinationPath: s3://cnpg-backups/hindsight
        endpointURL: http://openmediavault.local:9000
        # Previous generation (recovery source); bump to the prior genN on rebuild.
        serverName: hindsight-db
        s3Credentials:
          accessKeyId:
            name: hindsight-minio-backup-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: hindsight-minio-backup-creds
            key: ACCESS_SECRET_KEY
        data:
          compression: gzip
        wal:
          compression: gzip

  # Storage — local-path on the homelab-2nd NVMe (fast, NOT durable).
  storage:
    storageClass: local-path
    size: 10Gi

  # Backup + WAL archiving -> OMV MinIO S3 (the durable copy).
  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/hindsight
      endpointURL: http://openmediavault.local:9000
      # Current generation (archiver target); bump to "<name>-genN" (fresh) on rebuild.
      serverName: hindsight-db-gen2
      s3Credentials:
        accessKeyId:
          name: hindsight-minio-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: hindsight-minio-backup-creds
          key: ACCESS_SECRET_KEY
      data:
        compression: gzip
    retentionPolicy: "30d"

  # homelab-2nd sizing (H2-307): 2 CPU / 3Gi limits; requests stay low because
  # the node's CPU requests are already ~78% committed.
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "3Gi"
      cpu: "2000m"
