---
# Firecrawl API + worker harness.
# Runs the upstream self-host command: node dist/src/harness.js --start-docker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-api
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: firecrawl-api
    app.kubernetes.io/part-of: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-api
      app.kubernetes.io/part-of: firecrawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-api
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: api
          image: ghcr.io/firecrawl/firecrawl:latest
          command:
            - node
            - dist/src/harness.js
            - --start-docker
          ports:
            - name: http
              containerPort: 3002
            - name: extract-worker
              containerPort: 3004
            - name: worker
              containerPort: 3005
          envFrom:
            - configMapRef:
                name: firecrawl-config
          env:
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api-key
                  key: FIRECRAWL_API_KEY
            - name: BULL_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api-key
                  key: BULL_AUTH_KEY
            - name: NUQ_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api-key
                  key: NUQ_RABBITMQ_URL
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: database
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
        - name: metrics-proxy
          # Auth-injecting reverse proxy for Prometheus scraping.
          # Firecrawl exposes its Prometheus metrics ONLY at
          # /admin/<BULL_AUTH_KEY>/metrics (verified in upstream
          # apps/api/src/routes/admin.ts — there is no dedicated
          # metrics key and ServiceMonitor paths are static strings,
          # so the key must be injected at request time).
          #
          #   Prometheus -> http://pod:9100/metrics -> nginx -> localhost:3002/admin/$KEY/metrics
          #
          # The key arrives via secretKeyRef (same key the api container
          # already receives) and is rendered by the official nginx
          # template mechanism (envsubst at container start). It never
          # appears in the repo, in Prometheus target labels, or in any
          # externally visible scrape URL. 9100 is not exposed publicly —
          # firecrawl has no public ingress at all.
          image: nginx:1.27-alpine
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: BULL_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api-key
                  key: BULL_AUTH_KEY
          volumeMounts:
            - name: nginx-metrics-template
              mountPath: /etc/nginx/templates
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-metrics-template
          configMap:
            name: firecrawl-metrics-proxy-nginx