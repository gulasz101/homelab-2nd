---
# Firecrawl API + worker harness.
# Runs the upstream self-host command: node dist/src/harness.js --start-docker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-api
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: firecrawl-api
    app.kubernetes.io/part-of: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-api
      app.kubernetes.io/part-of: firecrawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-api
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: api
          image: ghcr.io/firecrawl/firecrawl:latest
          command:
            - node
            - dist/src/harness.js
            - --start-docker
          ports:
            - name: http
              containerPort: 3002
            - name: extract-worker
              containerPort: 3004
            - name: worker
              containerPort: 3005
          envFrom:
            - configMapRef:
                name: firecrawl-config
          env:
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api-key
                  key: FIRECRAWL_API_KEY
            - name: BULL_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api-key
                  key: BULL_AUTH_KEY
            - name: NUQ_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api-key
                  key: NUQ_RABBITMQ_URL
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: database
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
