---
# Hourly scheduled base backup for the Firecrawl queue database.
# WAL archiving is continuous via the barman-cloud CNPG-I plugin.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: firecrawl-db-hourly-backup
  namespace: firecrawl
spec:
  schedule: "0 * * * *"
  backupOwnerReference: self
  cluster:
    name: firecrawl-db
