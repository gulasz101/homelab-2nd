---
# Dedicated Cloudflare Tunnel for firecrawl.voitech.dev -> Firecrawl API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-firecrawl
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: cloudflared-firecrawl
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-firecrawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-firecrawl
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firecrawl-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 128Mi
