---
# AlertmanagerConfig: route firecrawl namespace alerts to the Mattermost webhook.
# The webhook secret lives in the same namespace as this CRD per the Prometheus
# Operator's urlSecret resolution rules.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: firecrawl-mattermost-alerts
  namespace: firecrawl
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: firecrawl-mattermost
    matchers:
      - name: namespace
        value: firecrawl
        matchType: '='
  receivers:
    - name: firecrawl-mattermost
      slackConfigs:
        - apiURL:
            name: firecrawl-mattermost-webhook-url
            key: url
          sendResolved: true
          title: |-
            [{{ .Status | toUpper }}] {{ .CommonLabels.namespace }}: {{ len .Alerts.Firing }} firing{{ if .Alerts.Resolved }}, {{ len .Alerts.Resolved }} resolved{{ end }}
          text: |-
            {{ range .Alerts.Firing }}- {{ .Labels.alertname }}: {{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}
            {{ end }}{{ range .Alerts.Resolved }}- {{ .Labels.alertname }}: {{ .Annotations.summary }} (resolved)
            {{ end }}
          fallback: |-
            {{ .CommonLabels.namespace }} alert: {{ len .Alerts.Firing }} firing{{ if .Alerts.Resolved }}, {{ len .Alerts.Resolved }} resolved{{ end }}
