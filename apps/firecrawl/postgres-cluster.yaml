---
# Firecrawl queue backend — CloudNativePG cluster in the firecrawl namespace.
# Firecrawl's NUQ queue schema is initialized by the application at startup,
# so a standard PostgreSQL 18 cluster is sufficient. If the app fails to
# initialize its schema, the fallback is the upstream ghcr.io/firecrawl/nuq-postgres
# container as a queue-only StatefulSet (documented in the ADR).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: firecrawl-db
  namespace: firecrawl
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie

  bootstrap:
    initdb:
      database: firecrawl
      owner: firecrawl
      secret:
        name: firecrawl-db-credentials

  storage:
    storageClass: local-path
    size: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: firecrawl-db-backups
        serverName: firecrawl-db

  backup:
    retentionPolicy: "30d"

  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
