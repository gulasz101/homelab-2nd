---
# Firecrawl NUQ queue backend — upstream nuq-postgres container.
# CloudNativePG plain PostgreSQL cannot run the NUQ schema because it requires
# pg_cron/pgcrypto and Firecrawl's own tuning, so this is the documented
# queue-backend exception to the CNPG rule (see ADR-010).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nuq-postgres
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: nuq-postgres
    app.kubernetes.io/part-of: firecrawl
spec:
  serviceName: nuq-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nuq-postgres
      app.kubernetes.io/part-of: firecrawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nuq-postgres
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: postgres
          image: ghcr.io/firecrawl/nuq-postgres:latest
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: firecrawl-db-credentials
                  key: database
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
