---
# In-cluster Redis for Firecrawl job queue and rate limiting.
# Queue state is rebuildable; a small local-path PVC keeps jobs across restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: firecrawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --bind
            - "0.0.0.0"
            - --appendonly
            - "yes"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
