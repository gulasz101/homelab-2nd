---
# In-cluster RabbitMQ for the Firecrawl worker harness.
# Single replica with a local-path PVC for durable queues.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/part-of: firecrawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: firecrawl
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: firecrawl
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: firecrawl-api-key
                  key: RABBITMQ_PASSWORD
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # RabbitMQ takes 15-25s to boot on this node under CPU pressure.
          # Use a startup probe to give it a generous boot window, then lighter
          # TCP-based liveness/readiness probes so diagnostics commands don't
          # timeout under load.
          startupProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
