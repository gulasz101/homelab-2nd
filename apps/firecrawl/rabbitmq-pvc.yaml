---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: firecrawl
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
