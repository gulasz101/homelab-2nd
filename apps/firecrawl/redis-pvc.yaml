---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: firecrawl
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: firecrawl
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
