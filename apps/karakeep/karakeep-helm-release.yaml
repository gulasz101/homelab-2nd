---
# Karakeep HelmRelease — official chart, single-pod StatefulSet, OMV NFS data + MinIO S3
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
  namespace: karakeep
spec:
  interval: 1h
  chart:
    spec:
      chart: karakeep
      # Chart 0.34.1 ships Meilisearch v1.55.0 (subchart 0.41.0); 0.32.0
      # shipped v1.13.0. The version is a decision, not a Flux side effect.
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: karakeep-app
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # -- Public URL used by NextAuth and the app
    applicationHost: keep.voitech.dev
    applicationProtocol: https

    # -- Disable chart-generated secrets; we inject our own via envFrom below.
    #    The chart expects applicationSecretKey/meilisearchMasterKey to be raw
    #    strings used as defaults for its own secrets, not secretKeyRefs.
    applicationSecretKey: ~
    meilisearchMasterKey: ~
    secrets:
      karakeep:
        enabled: false
      meilesearch:
        enabled: false

    # Chrome sidecar disabled to fit single-node CPU; plain-HTTP fallback crawls fine.
    controllers:
      karakeep:
        type: statefulset
        replicas: 1
        strategy: RollingUpdate
        containers:
          karakeep:
            envFrom:
              - secretRef:
                  name: karakeep-app-secrets
              - secretRef:
                  name: karakeep-oidc-client
              - secretRef:
                  name: karakeep-minio-assets
              - secretRef:
                  name: karakeep-litellm-key

            env:
              # -- SSO: Authentik OIDC only ─────────────────────────────────
              DISABLE_PASSWORD_AUTH: "true"
              # Signups are allowed only via OAuth (there is no local signup form).
              DISABLE_SIGNUPS: "false"
              OAUTH_AUTO_REDIRECT: "true"
              OAUTH_PROVIDER_NAME: "Authentik"
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
              OAUTH_WELLKNOWN_URL: "https://auth.voitech.dev/application/o/karakeep/.well-known/openid-configuration"

              # ── S3 asset store on OMV MinIO ─────────────────────────────
              ASSET_STORE_S3_ENDPOINT: "http://openmediavault.local:9000"
              ASSET_STORE_S3_BUCKET: "karakeep-assets"
              ASSET_STORE_S3_REGION: "us-east-1"
              ASSET_STORE_S3_FORCE_PATH_STYLE: "true"

              # ── AI tagging via LiteLLM proxy ─────────────────────────────
              OPENAI_BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
              # GUL-1431: Qwen3.6-35B-A3B on the M1 Max, thinking forced off at the
              # route (with thinking on, ~1,200 calls a day would fill the GPU).
              # A local image job unloads it for up to 25 min, hence the job timeout.
              INFERENCE_TEXT_MODEL: "qwen3.6-35b-a3b-local-nothink"
              INFERENCE_IMAGE_MODEL: "qwen3.6-35b-a3b-local-nothink"
              INFERENCE_CONTEXT_LENGTH: "8192"
              INFERENCE_ENABLE_AUTO_TAGGING: "true"
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
              INFERENCE_OUTPUT_SCHEMA: "plain"
              INFERENCE_JOB_TIMEOUT_SEC: "900"

              # Chrome sidecar disabled; unset browser URL so crawler uses plain HTTP.
              BROWSER_WEB_URL: ""

              # ── Observability / misc ─────────────────────────────────────
              LOG_LEVEL: "info"
              WORKERS_PORT: "3001"
              WORKERS_HOST: "0.0.0.0"
              OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring.svc.cluster.local:4318"
              OTEL_LOGS_EXPORTER: "otlp"
              OTEL_RESOURCE_ATTRIBUTES: "service.name=karakeep,service.namespace=karakeep"

            resources:
              # Crawling/indexing is bursty; 1 CPU throttled the app hard enough
              # that /api/health timed out and liveness killed it under bulk load.
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "3"
                memory: 3Gi

            probes:
              # Liveness stays HTTP (the chart merges its default handler, so a
              # tcpSocket here would produce an invalid probe with two handlers),
              # but is tolerant enough that a busy crawler can't get the pod killed.
              liveness:
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 30
                  failureThreshold: 10
                  httpGet:
                    path: /api/health
                    port: 3000
              # Readiness stays HTTP but is tolerant of slow periods under load.
              readiness:
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 45
                  periodSeconds: 10
                  timeoutSeconds: 20
                  failureThreshold: 6
                  httpGet:
                    path: /api/health
                    port: 3000

        statefulset:
          # The upstream common chart (3.7.3) silently drops `volumeName` and
          # treats `storageClass: ""` as unset, so the generated PVC cannot be
          # pinned to the NFS PV from here. Instead the PVC `data-karakeep-0`
          # is pre-created by data-karakeep-0-pvc.yaml and bound to the static
          # PV `karakeep-data`; the StatefulSet reuses it by name.
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 10Gi

      chrome:
        enabled: false

    service:
      karakeep:
        controller: karakeep
        ports:
          http:
            port: 3000
      chrome: null

    persistence:
      chrome-tmp: null

    # Cloudflare Tunnel handles public ingress
    ingress:
      karakeep:
        enabled: false

    # Prometheus scraping annotations on the karakeep pod
    defaultPodOptions:
      # The karakeep-data NFS export on OMV is granted per node IP (mimir 192.168.1.145,
      # loki .190 since the 2026-11-11 node move); pinned to mimir, the data node.
      nodeSelector:
        kubernetes.io/hostname: mimir
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"

    meilisearch:
      enabled: true
      auth:
        # Subchart 0.41.0 reads the key as MEILI_MASTER_KEY from this Secret;
        # `existingMasterKeySecretKey` no longer exists and would be ignored.
        existingMasterKeySecret: karakeep-app-secrets
      environment:
        # The on-disk database was written by v1.13.0. Without this the
        # v1.55.0 engine refuses to open it and crash-loops.
        MEILI_UPGRADE_DB: true
      persistence:
        enabled: true
        size: 1Gi
      resources:
        requests:
          cpu: 10m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 2Gi
