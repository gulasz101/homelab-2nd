---
# Prometheus ServiceMonitor for Karakeep web metrics on /api/metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: karakeep
  namespace: karakeep
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: karakeep
  endpoints:
    - port: http
      path: /api/metrics
      interval: 15s
      scrapeTimeout: 10s
      # Karakeep requires Bearer auth on /api/metrics (PROMETHEUS_AUTH_TOKEN).
      # Token lives in the same SOPS secret mounted envFrom by the app.
      bearerTokenSecret:
        name: karakeep-app-secrets
        key: PROMETHEUS_AUTH_TOKEN
