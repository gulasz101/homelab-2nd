---
# Non-secret Honcho runtime configuration.
# Secret values live in SOPS-encrypted Kubernetes Secrets and are mounted as env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: honcho-config
  namespace: honcho
data:
  # LiteLLM proxy endpoint. Inside k3s we use the in-cluster service to avoid
  # Cloudflare WAF blocking the OpenAI SDK's fingerprint on llm.voitech.dev.
  LLM_OPENAI_BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000"
  # Embedding model is served by Ollama Cloud via LiteLLM proxy.
  EMBEDDING_MODEL_CONFIG__MODEL: "nomic-embed-text"
  EMBEDDING_MODEL_CONFIG__TRANSPORT: "openai"
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://192.168.1.179:30114/v1"
  EMBEDDING_VECTOR_DIMENSIONS: "768"
  VECTOR_STORE_TYPE: "pgvector"
  # Deriver model.
  DERIVER_MODEL_CONFIG__TRANSPORT: "openai"
  DERIVER_MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  # Summary model.
  SUMMARY_MODEL_CONFIG__TRANSPORT: "openai"
  SUMMARY_MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  # Dream specialist models. Honcho's Dream subsystem splits work into a
  # deduction specialist and an induction specialist; each has its own
  # MODEL_CONFIG with a hardcoded default of openai/gpt-5.4-mini. We
  # override both so the whole Dream pipeline stays on the internal hub.
  DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_DEDUCTION_MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_INDUCTION_MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  # Dialectic levels. Env shape must match Pydantic nested dict keys:
  # DIALECTIC.LEVELS["low"].MODEL_CONFIG.model
  DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  DIALECTIC_LEVELS__MINIMAL__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  DIALECTIC_LEVELS__LOW__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__LOW__MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  DIALECTIC_LEVELS__LOW__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  DIALECTIC_LEVELS__MEDIUM__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  DIALECTIC_LEVELS__HIGH__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  DIALECTIC_LEVELS__MAX__MODEL_CONFIG__TRANSPORT: "openai"
  DIALECTIC_LEVELS__MAX__MODEL_CONFIG__MODEL: "nemotron-3-nano-30b-ollama"
  DIALECTIC_LEVELS__MAX__MODEL_CONFIG__OVERRIDES__BASE_URL: "http://litellm.llm-hub.svc.cluster.local:4000/v1"
  # Honcho auth is disabled for the local homelab deployment.
  HONCHO_AUTH_ENABLED: "false"
  # Logging
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"
  # 2026-10-05: Ollama Cloud silently updated the nemotron-3-nano:30b alias;
  # it now emits 1.6k-3.5k reasoning tokens per call. The old 2500-token
  # default budget was consumed by thinking, leaving empty/truncated JSON
  # content (ValidationException storm in the deriver queue). Give reasoning
  # + answer proper headroom on every pipeline that uses nemotron.
  LLM_DEFAULT_MAX_TOKENS: "8192"
  DERIVER_MODEL_CONFIG__MAX_OUTPUT_TOKENS: "8192"
  SUMMARY_MODEL_CONFIG__MAX_OUTPUT_TOKENS: "8192"
  # The summarizer does NOT use MODEL_CONFIG.max_output_tokens - it passes
  # SUMMARY.MAX_TOKENS_SHORT/LONG straight to the call (src/utils/summarizer.py
  # :229/:267). Defaults 1000/4000 were fully consumed by nemotron reasoning,
  # giving finish_reason=length and basic-summary fallbacks. Field caps are
  # le=10000 / le=20000 respectively.
  SUMMARY_MAX_TOKENS_SHORT: "8192"
  SUMMARY_MAX_TOKENS_LONG: "16384"
  DREAM_DEDUCTION_MODEL_CONFIG__MAX_OUTPUT_TOKENS: "8192"
  DREAM_INDUCTION_MODEL_CONFIG__MAX_OUTPUT_TOKENS: "8192"
