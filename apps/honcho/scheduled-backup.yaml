---
# Daily scheduled backup for the Honcho CNPG cluster
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: honcho-db-backup
  namespace: honcho
spec:
  schedule: "0 0 3 * * *"  # 03:00 daily (6-field cron with seconds)
  backupOwnerReference: self
  cluster:
    name: honcho-db
  immediate: true
