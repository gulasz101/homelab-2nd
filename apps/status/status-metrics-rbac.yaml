---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: status-metrics
  namespace: status
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: status-metrics-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: status-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: status-metrics-reader
subjects:
  - kind: ServiceAccount
    name: status-metrics
    namespace: status
