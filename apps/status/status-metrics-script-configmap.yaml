---
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-metrics-script
  namespace: status
data:
  server.py: |
    #!/usr/bin/env python3
    import json
    import os
    import ssl
    import threading
    import time
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from urllib.request import urlopen, Request
    from urllib.parse import quote
    from datetime import datetime, timezone

    PROMETHEUS = "http://prometheus-stack-kube-prom-prometheus.observability.svc.cluster.local:9090"

    NODE_QUERIES = {
        "cpu": "100 - (avg by (instance) (irate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)",
        "memory": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
        "load1": "node_load1",
        "load5": "node_load5",
        "load15": "node_load15",
        "uptime": "node_time_seconds - node_boot_time_seconds",
    }

    CLUSTER_QUERIES = {
        "total_nodes": "count(count by (instance) (node_cpu_seconds_total))",
        "pods_running": "count(kube_pod_status_phase{phase='Running'})",
        "pods_total": "count(count by (pod, namespace) (kube_pod_status_phase))",
    }

    cache = {"nodes": [], "cluster": {}, "error": None, "cached_at": None}
    lock = threading.Lock()

    def query_prometheus(q):
        url = f"{PROMETHEUS}/api/v1/query?query={quote(q)}"
        with urlopen(url, timeout=10) as r:
            data = json.loads(r.read().decode())
        if data.get("status") == "success" and data["data"]["result"]:
            return data["data"]["result"]
        return []

    def get_node_name_map():
        """Map internal IP -> Kubernetes node name from kube_node_info."""
        rows = query_prometheus("kube_node_info")
        mapping = {}
        for row in rows:
            internal_ip = row["metric"].get("internal_ip")
            node = row["metric"].get("node")
            if internal_ip and node:
                mapping[internal_ip] = node
        return mapping

    def scrape_node_metric(q):
        rows = query_prometheus(q)
        out = {}
        for row in rows:
            instance = row["metric"].get("instance") or "unknown"
            # strip port
            host = instance.split(":")[0]
            out[host] = float(row["value"][1])
        return out

    def get_cluster_age():
        try:
            token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            if not os.path.exists(token_path):
                return None
            with open(token_path, "r") as f:
                token = f.read().strip()
            ctx = ssl.create_default_context(cafile=ca_path)
            req = Request(
                "https://kubernetes.default.svc/api/v1/namespaces/kube-system",
                headers={"Authorization": f"Bearer {token}"},
            )
            with urlopen(req, context=ctx, timeout=10) as r:
                data = json.loads(r.read().decode())
            return data.get("metadata", {}).get("creationTimestamp")
        except Exception:
            return None

    def avg(values):
        return sum(values) / len(values) if values else 0

    def fmt_uptime(seconds):
        days, rem = divmod(int(seconds), 86400)
        hours, rem = divmod(rem, 3600)
        minutes, _ = divmod(rem, 60)
        parts = []
        if days:
            parts.append(f"{days}d")
        if hours:
            parts.append(f"{hours}h")
        if minutes:
            parts.append(f"{minutes}m")
        return " ".join(parts) if parts else "0m"

    def updater():
        while True:
            try:
                name_map = get_node_name_map()

                # per-node metrics keyed by host (ip or name)
                node_data = {name: scrape_node_metric(q) for name, q in NODE_QUERIES.items()}
                nodes = []
                all_names = set()
                for metric_values in node_data.values():
                    all_names.update(metric_values.keys())

                for host in sorted(all_names):
                    friendly = name_map.get(host, host)
                    nodes.append({
                        "name": friendly,
                        "cpu": round(node_data["cpu"].get(host, 0), 1),
                        "memory": round(node_data["memory"].get(host, 0), 1),
                        "load1": round(node_data["load1"].get(host, 0), 2),
                        "load5": round(node_data["load5"].get(host, 0), 2),
                        "load15": round(node_data["load15"].get(host, 0), 2),
                        "uptime": node_data["uptime"].get(host, 0),
                        "uptime_human": fmt_uptime(node_data["uptime"].get(host, 0)),
                    })

                # cluster-wide metrics
                cluster = {}
                for key, q in CLUSTER_QUERIES.items():
                    rows = query_prometheus(q)
                    cluster[key] = int(float(rows[0]["value"][1])) if rows else 0

                cluster["cluster_age"] = get_cluster_age()
                cluster["cluster_age_days"] = 0
                if cluster["cluster_age"]:
                    created = datetime.fromisoformat(cluster["cluster_age"].replace("Z", "+00:00"))
                    cluster["cluster_age_days"] = (datetime.now(timezone.utc) - created).days

                cluster["avg_cpu"] = round(avg([n["cpu"] for n in nodes]), 1)
                cluster["avg_memory"] = round(avg([n["memory"] for n in nodes]), 1)
                cluster["avg_load"] = round(avg([n["load1"] for n in nodes]), 2)
                cluster["online_nodes"] = len(nodes)

                with lock:
                    cache.clear()
                    cache["nodes"] = nodes
                    cache["cluster"] = cluster
                    cache["error"] = None
                    cache["cached_at"] = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
            except Exception as e:
                with lock:
                    cache["error"] = str(e)
            time.sleep(30)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            path = self.path.split("?", 1)[0]
            if path in ("/metrics.json", "/"):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Access-Control-Allow-Origin", "*")
                self.end_headers()
                with lock:
                    self.wfile.write(json.dumps(cache).encode())
            elif path == "/cluster-age.json":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Access-Control-Allow-Origin", "*")
                self.end_headers()
                created = get_cluster_age()
                self.wfile.write(json.dumps({"created": created}).encode())
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, fmt, *args):
            pass

    if __name__ == "__main__":
        threading.Thread(target=updater, daemon=True).start()
        time.sleep(2)
        server = HTTPServer(("127.0.0.1", 8081), Handler)
        server.serve_forever()
