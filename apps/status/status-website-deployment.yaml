---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-website
  namespace: status
  labels:
    app.kubernetes.io/name: status-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: status-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-website
    spec:
      containers:
        - name: website
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: website-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

        - name: metrics
          image: python:3.11-alpine
          command:
            - python3
            - /scripts/server.py
          volumeMounts:
            - name: metrics-script
              mountPath: /scripts
          resources:
            requests:
              memory: "32Mi"
              cpu: "5m"
            limits:
              memory: "64Mi"
              cpu: "100m"

      volumes:
        - name: website-content
          configMap:
            name: status-website-content
        - name: nginx-config
          configMap:
            name: status-website-content
        - name: metrics-script
          configMap:
            name: status-metrics-script
            defaultMode: 0755
