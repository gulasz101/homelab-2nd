---
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-website-content
  namespace: status
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>voitech.dev - Homelab-2nd Status</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        <style>
            :root {
                --bg: #0b1120;
                --card: #151e2e;
                --border: #1f2d42;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --accent: #00d4aa;
                --accent-dim: rgba(0, 212, 170, 0.12);
                --danger: #ff6b6b;
            }
            body {
                font-family: 'Inter', sans-serif;
                background: var(--bg);
                color: var(--text);
            }
            .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 0.75rem;
            }
            .metric-value { color: var(--accent); }
            .section-title {
                border-left: 4px solid var(--accent);
                padding-left: 0.75rem;
            }
            .status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 8px var(--accent);
                display: inline-block;
                margin-right: 0.5rem;
            }
            .metric-label {
                color: var(--muted);
                font-size: 0.875rem;
            }
            .metric-sub {
                color: var(--muted);
                font-size: 0.75rem;
            }
            .node-detail {
                border-top: 1px solid var(--border);
                padding-top: 0.75rem;
                margin-top: 0.75rem;
            }
            .progress-bg {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 9999px;
                height: 0.5rem;
                overflow: hidden;
            }
            .progress-fill {
                background: var(--accent);
                height: 100%;
                border-radius: 9999px;
                transition: width 0.3s ease;
            }
        </style>
    </head>
    <body class="min-h-screen flex flex-col">
        <header class="border-b" style="background: var(--card); border-color: var(--border);">
            <div class="container mx-auto px-6 py-6 flex items-center justify-between flex-wrap">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-bold tracking-tight">voitech.dev</span>
                    <span class="text-sm" style="color: var(--muted);">Homelab-2nd Status</span>
                </div>
                <div class="flex items-center mt-2 sm:mt-0">
                    <span class="status-dot"></span>
                    <span class="text-sm font-medium">Operational</span>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-6 py-8 flex-grow">
            <div class="mb-6">
                <h1 class="text-2xl font-semibold mb-1">Real-Time Cluster Metrics</h1>
                <p style="color: var(--muted);">Live monitoring of the bare-metal Kubernetes cluster</p>
            </div>

            <h2 class="section-title text-lg font-semibold mb-4">Cluster Overview</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
                <div class="card p-4">
                    <div class="metric-label mb-1">Nodes Online</div>
                    <div class="text-2xl font-bold metric-value" id="nodes-online">-/-</div>
                    <div class="metric-sub">Active</div>
                </div>
                <div class="card p-4">
                    <div class="metric-label mb-1">Avg CPU</div>
                    <div class="text-2xl font-bold metric-value" id="cluster-cpu">-%</div>
                    <div class="metric-sub">Usage</div>
                </div>
                <div class="card p-4">
                    <div class="metric-label mb-1">Avg Memory</div>
                    <div class="text-2xl font-bold metric-value" id="cluster-memory">-%</div>
                    <div class="metric-sub">Usage</div>
                </div>
                <div class="card p-4">
                    <div class="metric-label mb-1">Avg Load</div>
                    <div class="text-2xl font-bold metric-value" id="cluster-load">-</div>
                    <div class="metric-sub">1min</div>
                </div>
                <div class="card p-4">
                    <div class="metric-label mb-1">Cluster Age</div>
                    <div class="text-2xl font-bold metric-value" id="cluster-age">-</div>
                    <div class="metric-sub">Days</div>
                </div>
                <div class="card p-4">
                    <div class="metric-label mb-1">Pods Running</div>
                    <div class="text-2xl font-bold metric-value" id="cluster-pods">-</div>
                    <div class="metric-sub"><span id="cluster-pods-total">-</span> total</div>
                </div>
            </div>

            <h2 class="section-title text-lg font-semibold mb-4">Nodes</h2>
            <div id="nodes-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
        </main>

        <footer class="border-t mt-8" style="background: var(--card); border-color: var(--border);">
            <div class="container mx-auto px-6 py-6">
                <div class="flex justify-center flex-wrap gap-6 mb-3 text-sm">
                    <a href="https://gulasz101.github.io/morning-brew/" target="_blank" class="hover:text-[#00d4aa] transition-colors">Morning Brew</a>
                    <a href="https://gulasz101.github.io/about/" target="_blank" class="hover:text-[#00d4aa] transition-colors">About</a>
                    <a href="https://www.linkedin.com/in/wojciech-gula-57797070/" target="_blank" class="hover:text-[#00d4aa] transition-colors">LinkedIn</a>
                    <a href="https://github.com/gulasz101/homelab-2nd" target="_blank" class="hover:text-[#00d4aa] transition-colors">GitHub</a>
                    <a href="https://status.voitech.dev" class="hover:text-[#00d4aa] transition-colors">Home</a>
                </div>
                <div class="text-center text-xs" style="color: var(--muted);">
                    Auto-refreshing every 5 seconds · Last update: <span id="last-update">-</span>
                </div>
            </div>
        </footer>

        <script>
            const fmt = (n, d=1) => Number.isFinite(n) ? n.toFixed(d) : '-';
            const clamp = (n) => Math.min(Math.max(n, 0), 100);

            function renderBar(percent) {
                const p = clamp(percent);
                return `<div class="progress-bg"><div class="progress-fill" style="width: ${p}%"></div></div>`;
            }

            function render(data) {
                const nodes = data.nodes || [];
                const cluster = data.cluster || {};

                document.getElementById('nodes-online').textContent =
                    `${cluster.online_nodes || nodes.length || 0}/${cluster.total_nodes || nodes.length || 0}`;
                document.getElementById('cluster-cpu').textContent = `${fmt(cluster.avg_cpu)}%`;
                document.getElementById('cluster-memory').textContent = `${fmt(cluster.avg_memory)}%`;
                document.getElementById('cluster-load').textContent = fmt(cluster.avg_load || 0, 2);
                document.getElementById('cluster-age').textContent = cluster.cluster_age_days || '-';
                document.getElementById('cluster-pods').textContent = cluster.pods_running || '-';
                document.getElementById('cluster-pods-total').textContent = cluster.pods_total || '-';
                document.getElementById('last-update').textContent = data.cached_at
                    ? new Date(data.cached_at).toLocaleTimeString()
                    : '-';

                const grid = document.getElementById('nodes-grid');
                grid.innerHTML = nodes.map(n => {
                    const cpuBreakdown = n.cpu_user != null || n.cpu_system != null || n.cpu_iowait != null
                        ? `<div class="metric-sub mt-1">User: ${fmt(n.cpu_user || 0)}%, Sys: ${fmt(n.cpu_system || 0)}%, IO: ${fmt(n.cpu_iowait || 0)}%</div>`
                        : '';
                    const memAbs = n.memory_used_gb != null && n.memory_total_gb != null
                        ? `<div class="metric-sub mt-1">${n.memory_used_gb} GB / ${n.memory_total_gb} GB</div>`
                        : '';
                    return `
                    <div class="card p-5">
                        <h3 class="text-base font-semibold mb-4 pb-2 border-b" style="border-color: var(--border);">${n.name}</h3>
                        <div class="space-y-4">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <span class="metric-label">CPU Usage</span>
                                    <span class="text-lg font-semibold metric-value">${fmt(n.cpu)}%</span>
                                </div>
                                ${renderBar(n.cpu)}
                                ${cpuBreakdown}
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <span class="metric-label">Memory</span>
                                    <span class="text-lg font-semibold metric-value">${fmt(n.memory)}%</span>
                                </div>
                                ${renderBar(n.memory)}
                                ${memAbs}
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="metric-label">Load Avg</span>
                                <span class="text-lg font-semibold metric-value">${fmt(n.load1, 2)}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="metric-label">Uptime</span>
                                <span class="text-lg font-semibold">${n.uptime_human || fmt(n.uptime, 0) + 's'}</span>
                            </div>
                        </div>
                        <div class="node-detail metric-sub">
                            1m ${fmt(n.load1, 2)} · 5m ${fmt(n.load5, 2)} · 15m ${fmt(n.load15, 2)}
                        </div>
                    </div>
                `}).join('');

                if (nodes.length === 0) {
                    grid.innerHTML = '<div style="color: var(--muted);">No nodes found.</div>';
                }
            }

            async function refresh() {
                try {
                    const res = await fetch('/metrics.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    render(data);
                } catch (e) {
                    console.error('refresh failed:', e);
                    document.getElementById('nodes-online').textContent = 'ERR';
                }
            }

            refresh();
            setInterval(refresh, 5000);
        </script>
    </body>
    </html>
  default.conf: |
    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        location /metrics.json {
            proxy_pass         http://127.0.0.1:8081;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /cluster-age.json {
            proxy_pass         http://127.0.0.1:8081;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
