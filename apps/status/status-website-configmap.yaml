---
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-website-content
  namespace: status
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>voitech.dev - Homelab Status</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
        <style>
            body { font-family: 'Inter', sans-serif; }
            .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            .metric-card { transition: all 0.3s ease; }
            .metric-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
            .status-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
            .status-online { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.5); }
            .status-offline { background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.5); }
            .pulse { animation: pulse 2s infinite; }
            @keyframes pulse {
                0% { opacity: 1; }
                50% { opacity: 0.5; }
                100% { opacity: 1; }
            }
        </style>
    </head>
    <body class="bg-gray-900 text-white min-h-screen">
        <header class="gradient-bg shadow-2xl">
            <div class="container mx-auto px-6 py-8">
                <div class="flex items-center justify-between flex-wrap">
                    <div class="flex items-center space-x-4">
                        <div class="text-3xl md:text-4xl font-extrabold text-white">
                            <i class="fas fa-chart-line mr-2"></i>
                            voitech.dev
                        </div>
                        <span class="hidden md:inline-block text-sm text-gray-200">Homelab Status</span>
                    </div>
                    <div class="mt-4 md:mt-0 flex items-center space-x-3">
                        <span class="status-indicator status-online pulse"></span>
                        <span class="text-sm font-medium">Operational</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-6 py-8">
            <div class="mb-8">
                <h2 class="text-2xl font-bold mb-2">
                    <i class="fas fa-tachometer-alt mr-2 text-blue-400"></i>
                    Real-Time Homelab Metrics
                </h2>
                <p class="text-gray-400">Live monitoring of the bare-metal Kubernetes cluster</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="metric-card bg-gray-800 rounded-xl p-6 border border-gray-700">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-gray-400">Nodes Online</h3>
                        <i class="fas fa-server text-blue-400"></i>
                    </div>
                    <div class="text-3xl font-bold" id="nodes-online">-/-</div>
                    <div class="text-sm text-gray-400 mt-1">Active</div>
                </div>

                <div class="metric-card bg-gray-800 rounded-xl p-6 border border-gray-700">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-gray-400">Cluster CPU</h3>
                        <i class="fas fa-microchip text-green-400"></i>
                    </div>
                    <div class="text-3xl font-bold" id="cluster-cpu">-%</div>
                    <div class="text-sm text-gray-400 mt-1">Average usage</div>
                </div>

                <div class="metric-card bg-gray-800 rounded-xl p-6 border border-gray-700">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-gray-400">Cluster Memory</h3>
                        <i class="fas fa-memory text-purple-400"></i>
                    </div>
                    <div class="text-3xl font-bold" id="cluster-memory">-%</div>
                    <div class="text-sm text-gray-400 mt-1">Average usage</div>
                </div>

                <div class="metric-card bg-gray-800 rounded-xl p-6 border border-gray-700">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-gray-400">Pods</h3>
                        <i class="fas fa-cubes text-yellow-400"></i>
                    </div>
                    <div class="text-3xl font-bold" id="cluster-pods">-</div>
                    <div class="text-sm text-gray-400 mt-1" id="cluster-pods-detail">- total</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="metric-card bg-gray-800 rounded-xl p-6 border border-gray-700">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-gray-400">Cluster Load</h3>
                        <i class="fas fa-weight-hanging text-red-400"></i>
                    </div>
                    <div class="text-3xl font-bold" id="cluster-load">-</div>
                    <div class="text-sm text-gray-400 mt-1">Average 1min load</div>
                </div>

                <div class="metric-card bg-gray-800 rounded-xl p-6 border border-gray-700">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-gray-400">Cluster Age</h3>
                        <i class="fas fa-calendar-alt text-indigo-400"></i>
                    </div>
                    <div class="text-3xl font-bold" id="cluster-age">-</div>
                    <div class="text-sm text-gray-400 mt-1">Days since bootstrap</div>
                </div>

                <div class="metric-card bg-gray-800 rounded-xl p-6 border border-gray-700">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-medium text-gray-400">Last Update</h3>
                        <i class="fas fa-clock text-cyan-400"></i>
                    </div>
                    <div class="text-lg font-bold" id="last-update">-</div>
                    <div class="text-sm text-gray-400 mt-1">Auto-refresh every 5s</div>
                </div>
            </div>

            <div class="mb-6">
                <h2 class="text-xl font-bold mb-4">
                    <i class="fas fa-server mr-2 text-blue-400"></i>
                    Nodes
                </h2>
            </div>

            <div id="nodes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Node cards injected here -->
            </div>
        </main>

        <footer class="bg-gray-800 mt-12 border-t border-gray-700">
            <div class="container mx-auto px-6 py-8">
                <div class="flex justify-center space-x-8 mb-4 flex-wrap">
                    <a href="https://gulasz101.github.io/morning-brew/" target="_blank" class="text-green-400 hover:text-green-300 transition-colors m-2">
                        <i class="fas fa-coffee mr-2"></i>Morning Brew
                    </a>
                    <a href="https://www.linkedin.com/in/wojciech-gula-57797070/" target="_blank" class="text-blue-400 hover:text-blue-300 transition-colors m-2">
                        <i class="fab fa-linkedin mr-2"></i>LinkedIn
                    </a>
                    <a href="https://github.com/gulasz101/homelab-2nd" target="_blank" class="text-gray-400 hover:text-gray-300 transition-colors m-2">
                        <i class="fab fa-github mr-2"></i>GitHub
                    </a>
                    <a href="https://status.voitech.dev" class="text-blue-400 hover:text-blue-300 transition-colors m-2">
                        <i class="fas fa-home mr-2"></i>Home
                    </a>
                </div>
                <div class="text-center text-gray-500 text-sm">
                    Powered by k3s, Prometheus, and a tiny Python sidecar. No cookies, no tracking.
                </div>
            </div>
        </footer>

        <script>
            const fmt = (n, d=1) => Number.isFinite(n) ? n.toFixed(d) : '-';

            function render(data) {
                const nodes = data.nodes || [];
                const cluster = data.cluster || {};

                document.getElementById('nodes-online').textContent =
                    `${cluster.online_nodes || nodes.length || 0}/${cluster.total_nodes || nodes.length || 0}`;
                document.getElementById('cluster-cpu').textContent = `${fmt(cluster.avg_cpu)}%`;
                document.getElementById('cluster-memory').textContent = `${fmt(cluster.avg_memory)}%`;
                document.getElementById('cluster-load').textContent = fmt(cluster.avg_load || 0, 2);
                document.getElementById('cluster-age').textContent = cluster.cluster_age_days || '-';
                document.getElementById('cluster-pods').textContent = cluster.pods_running || '-';
                document.getElementById('cluster-pods-detail').textContent =
                    `${cluster.pods_total || '-'} total`;
                document.getElementById('last-update').textContent = data.cached_at
                    ? new Date(data.cached_at).toLocaleTimeString()
                    : '-';

                const grid = document.getElementById('nodes-grid');
                grid.innerHTML = nodes.map(n => `
                    <div class="metric-card bg-gray-800 rounded-xl p-6 border border-gray-700">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold truncate" title="${n.name}">${n.name}</h3>
                            <span class="status-indicator status-online"></span>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <div class="text-xs text-gray-400">CPU</div>
                                <div class="text-xl font-semibold">${fmt(n.cpu)}%</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-400">Memory</div>
                                <div class="text-xl font-semibold">${fmt(n.memory)}%</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-400">Load Avg</div>
                                <div class="text-xl font-semibold">${fmt(n.load1, 2)}</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-400">Uptime</div>
                                <div class="text-xl font-semibold">${n.uptime_human || fmt(n.uptime, 0) + 's'}</div>
                            </div>
                        </div>
                        <div class="mt-4 text-xs text-gray-500">
                            load5: ${fmt(n.load5, 2)} · load15: ${fmt(n.load15, 2)}
                        </div>
                    </div>
                `).join('');

                if (nodes.length === 0) {
                    grid.innerHTML = '<div class="text-gray-400">No nodes found.</div>';
                }
            }

            async function refresh() {
                try {
                    const res = await fetch('/metrics.json?t=' + Date.now());
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    render(data);
                } catch (e) {
                    console.error('refresh failed:', e);
                    document.getElementById('nodes-online').textContent = 'ERR';
                }
            }

            refresh();
            setInterval(refresh, 5000);
        </script>
    </body>
    </html>
