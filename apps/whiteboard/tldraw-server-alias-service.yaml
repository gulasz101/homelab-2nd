---
# Compatibility alias for the externally-fixed Cloudflare tunnel origin.
# The live tunnel route is (documented, CF-side):
#   white-board.voitech.dev -> http://tldraw-server.apps-tldraw.svc.cluster.local:80
# This ExternalName Service makes that legacy name resolve to the real
# Excalidraw Service, so the public hostname works without touching Cloudflare.
# Delete together with tunnel-namespace.yaml once Wojtek repoints the CF route.
apiVersion: v1
kind: Service
metadata:
  name: tldraw-server
  namespace: apps-tldraw
  labels:
    app.kubernetes.io/name: whiteboard-tunnel
spec:
  type: ExternalName
  externalName: excalidraw.apps-whiteboard.svc.cluster.local
  ports:
    - name: http
      port: 80
