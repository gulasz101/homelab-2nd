---
# Flux image automation for Riff Radar (same shape as apps/star-office/).
#
# The package is private (ADR-101), so the ImageRepository authenticates with the
# platform pull credential (ADR-103). image-reflector-controller can only read a
# secretRef from its own namespace, so `ghcr-pull` exists in flux-system too —
# same file, same bytes as the kubelet's copy.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: riffradar
  namespace: flux-system
spec:
  image: ghcr.io/gulasz101/riff_radar
  interval: 5m0s
  secretRef:
    name: ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: riffradar
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: riffradar
  policy:
    semver:
      # 0.x is a demo app; a 1.0.0 bump is a deliberate human decision, not an
      # automatic pull into the demo environment.
      range: ">=0.1.0 <1.0.0"
