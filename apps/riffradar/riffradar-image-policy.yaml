---
# Flux image automation for Riff Radar (same shape as apps/star-office/).
#
# The package is private (ADR-101), so the ImageRepository authenticates with the
# same dockerconfigjson credential the kubelet uses: the Secret lives in
# flux-system as well, because image-reflector-controller can only read a
# secretRef from its own namespace.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: riffradar
  namespace: flux-system
spec:
  image: ghcr.io/gulasz101/riff_radar
  interval: 5m0s
  secretRef:
    name: riffradar-ghcr-pull
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: riffradar
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: riffradar
  policy:
    semver:
      # 0.x is a demo app; a 1.0.0 bump is a deliberate human decision, not an
      # automatic pull into the demo environment.
      range: ">=0.1.0 <1.0.0"
