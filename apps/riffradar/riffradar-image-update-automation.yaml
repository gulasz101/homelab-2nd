---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: riffradar
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: Flux Bot
        email: flux@voitech.dev
      messageTemplate: |
        Automated image update for {{ .AutomationObject }}
        Images:
        {{ range $_, $change := .Changed.Changes -}}
        - {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./apps/riffradar
