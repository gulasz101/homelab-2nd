---
# Riff Radar demo API + SPA (GUL-550, ADR-102).
#
# One replica and strategy Recreate, on purpose: the app is a single Bun process
# whose state is a SQLite file on an RWO local-path volume. Two writers or a
# rolling update (two pods, one SQLite file, two schema migration runs) is how
# you corrupt a demo. Recreate means "old pod gone, then new pod" — a few seconds
# of 502 at the Cloudflare edge, and one writer at any time.
#
# The image runs as root by default (no USER in the Dockerfile). We force a
# non-root uid here and give the process HOME=/tmp so Bun has somewhere to write
# its cache; the PVC is created 0777 by the local-path provisioner, so uid 1000
# can write data/db and data/tabs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riffradar
  namespace: riffradar
  labels:
    app.kubernetes.io/name: riffradar
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: riffradar
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riffradar
        app.kubernetes.io/component: app
    spec:
      # Private GHCR package (ADR-101/ADR-103): the kubelet needs the platform
      # dockerconfigjson Secret from apps/ghcr-pull/ghcr-pull.sops.yaml. Shared
      # with every other private image, so a new namespace is a script run, not
      # a new GitHub token.
      imagePullSecrets:
        - name: ghcr-pull
      # local-path PVC is node-local; the backup Job pins the same node.
      nodeSelector:
        kubernetes.io/hostname: homelab-2nd
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # The app hardcodes its data dir as './data' relative to the working
        # directory (/app), so the PVC is mounted over /app/data. The image
        # creates data/db and data/tabs as root at build time; the volume hides
        # them, so they are recreated with the pod's own uid.
        - name: prepare-data
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - mkdir -p /app/data/db /app/data/tabs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
        # First boot only, and it is an init container now on purpose.
        #
        # `seed.ts` is not additive for the admin user: it upserts id
        # `admin-001` with the built-in demo password and must_reset_password=1
        # (apps/api/src/db/seed.ts:214-228), and scripts/start.sh runs it on
        # every container start when SEED_ON_START=true. Restarting the pod was
        # therefore resetting the admin credential back to a password printed in
        # the public repo (GUL-757). The seed still has to run on an empty PVC —
        # that is what makes a rebuild a re-deploy (ADR-102) — so it moves here,
        # gated on the database file not existing, and the app container no
        # longer seeds at all.
        - name: seed-if-empty
          image: ghcr.io/gulasz101/riff_radar:0.1.0 # {"$imagepolicy": "flux-system:riffradar"}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /app/data/db/riffradar.db ]; then
                echo "riffradar.db present - not seeding (a seed would reset the admin password)"
                exit 0
              fi
              echo "empty data dir - migrating and seeding the demo"
              bun run /app/apps/api/src/db/migrate.ts
              bun run /app/apps/api/src/db/seed.ts
          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              value: file:/app/data/db/riffradar.db
            - name: TAB_FILES_DIR
              value: /app/data/tabs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: riffradar
          image: ghcr.io/gulasz101/riff_radar:0.1.0 # {"$imagepolicy": "flux-system:riffradar"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              value: file:/app/data/db/riffradar.db
            - name: TAB_FILES_DIR
              value: /app/data/tabs
            # Never seeds. `seed.ts` resets the admin password to the built-in
            # demo credential on every run (GUL-757), so seeding belongs to the
            # `seed-if-empty` init container above, which only acts on an empty
            # PVC. Leave this false: true re-arms a published password on every
            # restart, whatever the password was rotated to.
            - name: SEED_ON_START
              value: "false"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: riffradar-jwt
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: riffradar-data
        - name: tmp
          emptyDir: {}
