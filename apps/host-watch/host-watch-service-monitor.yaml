---
# Prometheus scrapes /metrics every 30 s. One scrape per 60 s probe interval is
# enough to report every probe result on time; the endpoint is cheap and this is
# the "the watchdog itself is dead" signal via `up{namespace="host-watch"}`.
#
# The selector names the metrics face explicitly. Both Services in this namespace
# carry app.kubernetes.io/name=host-watch, so a name-only selector scraped the
# heartbeat-ingest NodePort as well and every metric existed twice — which turned
# every host-watch alert into two identical alert instances (GUL-643).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: host-watch
  namespace: host-watch
  labels:
    release: prometheus-stack
    app.kubernetes.io/name: host-watch
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: host-watch
      app.kubernetes.io/component: metrics
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
