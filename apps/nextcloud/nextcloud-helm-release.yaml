---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 10m
  chart:
    spec:
      chart: nextcloud
      version: "9.4.5"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
  install:
    remediation:
      retries: 3
    timeout: 30m
  upgrade:
    remediation:
      retries: 3
    # 30m is shorter than the code copy on a cold cache; a Helm upgrade timeout
    # here means a rollback against an already-migrated database.
    timeout: 60m
  # The chart does not template progressDeadlineSeconds, so the Deployment
  # inherits the Kubernetes default of 600s. The Nextcloud entrypoint needs
  # 20-40 minutes to rsync ~25k files onto the NFS-backed /var/www/html PVC
  # before Apache binds port 80; at 600s the Deployment is marked Failed, the
  # HelmRelease health check reads that as a stalled release and rolls back
  # mid-upgrade — leaving the database migrated and the code not. Raise it to
  # an hour so the schema and the code always move together.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: nextcloud
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nextcloud
              spec:
                progressDeadlineSeconds: 3600
  values:
    image:
      flavor: apache
      # Pinned to an exact digest on purpose. Nextcloud ships security fixes by
      # REBUILDING an existing tag instead of cutting a new version, so
      # `35.0.3-apache` silently changed content on 2026-11-19 (image built
      # 15:13Z) to pick up the PHP security release: 8.5.12 -> 8.5.13
      # (18 CVEs incl. the session-serializer and PHP-FPM FastCGI issues,
      # CVE-2026-109618 / CVE-2026-109619 on the CISA KEV list). The tag alone
      # cannot record that, and a running pod keeps its old digest. Pinning the
      # index digest makes every rollout pull the patched build.
      #
      # No 35.0.4 exists yet (checked 2026-11-20): 35.0.3-apache IS the newest
      # published tag, re-spun against PHP 8.5.13.
      #
      # Chart value is rendered as `<registry>/<repo>:<tag>`, so the digest
      # suffix rides along as a normal OCI reference. Bump this digest (not just
      # the version) the next time Nextcloud re-spins a tag.
      tag: "35.0.3-apache@sha256:f22d1dd63844bd15bbf6c2019149653c3d1c775ba48b173b56c3c6ad5f386196"

    replicaCount: 1

    nextcloud:
      host: nextcloud-photos.voitech.dev
      username: admin
      password: changeme
      existingSecret:
        enabled: true
        secretName: nextcloud-admin-credentials
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password

      trustedDomains:
        - nextcloud-photos.voitech.dev
        - nextcloud.nextcloud.svc.cluster.local

      # PHP config overrides injected as config.php snippets
      configs:
        logging.config.php: |-
          <?php
          $CONFIG = array (
            'log_type' => 'stderr',
            'loglevel' => 2,
            'logtimezone' => 'Europe/Berlin',
          );
        preview.config.php: |-
          <?php
          $CONFIG = array (
            'enable_previews' => true,
            'preview_max_x' => 2048,
            'preview_max_y' => 2048,
            'preview_max_scale_factor' => 3,
            'enabledPreviewProviders' => array (
              'OC\\Preview\\PNG',
              'OC\\Preview\\JPEG',
              'OC\\Preview\\GIF',
              'OC\\Preview\\BMP',
              'OC\\Preview\\XBitmap',
              'OC\\Preview\\MP3',
              'OC\\Preview\\MP4',
              'OC\\Preview\\MKV',
              'OC\\Preview\\TXT',
              'OC\\Preview\\MarkDown',
              'OC\\Preview\\PDF'
            ),
          );
        public-url.config.php: |-
          <?php
          $CONFIG = array (
            'overwriteprotocol' => 'https',
            'overwritehost' => 'nextcloud-photos.voitech.dev',
            'overwrite.cli.url' => 'https://nextcloud-photos.voitech.dev',
            'trusted_proxies' => array('10.0.0.0/8'),
          );

      datadir: /var/www/html/data

      # S3 primary storage on OMV MinIO. The chart translates this into
      # OBJECTSTORE_S3_* environment variables, which the Nextcloud
      # entrypoint writes into config.php as objectstore => S3 on first
      # install. All user files are streamed to MinIO; the local data dir
      # only holds thumbnails, cache, and minimal metadata.
      objectStore:
        s3:
          enabled: true
          existingSecret: nextcloud-minio-creds
          secretKeys:
            accessKey: accessKeyId
            secretKey: secretAccessKey
          host: openmediavault.local
          port: 9000
          ssl: false
          usePathStyle: true
          region: us-east-1
          bucket: nextcloud-photos
          autoCreate: false
          legacyAuth: false

    # External Postgres via CNPG
    internalDatabase:
      enabled: false
    mariadb:
      enabled: false
    postgresql:
      enabled: false

    externalDatabase:
      enabled: true
      type: postgresql
      host: nextcloud-db-rw.nextcloud.svc.cluster.local:5432
      database: nextcloud
      user: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-db-creds
        usernameKey: username
        passwordKey: password
        databaseKey: database

    # Redis for file locking / caching (ephemeral, no persistence)
    redis:
      enabled: true
      auth:
        enabled: false
      master:
        persistence:
          enabled: false
      replica:
        replicaCount: 0

    externalRedis:
      enabled: false

    # The OMV NFS exports backing nextcloud-html and nextcloud-data are only
    # exported to homelab-2nd, so pin the pod to that node or the NFS mount
    # fails with access denied if it is ever rescheduled elsewhere.
    nodeSelector:
      kubernetes.io/hostname: mimir

    # Persistence: keep the whole Nextcloud root on the existing OMV NFS PVC
    # (nextcloud-html, 20Gi). This holds code, config, apps, cache, and local
    # thumbnails. The data directory (/var/www/html/data) is split out to the
    # dedicated 200Gi NFS PVC nextcloud-data. All durable user files still live
    # in MinIO S3 primary storage. Do not set storageClass or size here.
    persistence:
      enabled: true
      existingClaim: nextcloud-html
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data

    # Cronjob for background jobs
    cronjob:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    # Resource sizing
    resources:
      requests:
        cpu: 50m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

    # PHP tuning for large photo/video uploads
    phpConfigs:
      uploads.ini: |-
        upload_max_filesize=1G
        post_max_size=1G
        max_execution_time=300
        memory_limit=1024M

    # Liveness/readiness — give first-install plenty of time on NFS; the
    # Nextcloud entrypoint rsyncs ~500MB of code to /var/www/html every start.
    livenessProbe:
      enabled: true
      initialDelaySeconds: 600
      periodSeconds: 30
      failureThreshold: 20
      timeoutSeconds: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 300
      periodSeconds: 15
      failureThreshold: 60
      timeoutSeconds: 5

    # 600x15s = 2.5h: the entrypoint rsyncs ~25k files (890MB) onto the NFS
    # html PVC before Apache binds port 80 (measured ~1000-1300 files/min, so
    # 20-40 min from cold). 120x15s = 30 min was not enough, and a kubelet kill
    # mid-copy restarts the rsync from zero.
    startupProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 600
      timeoutSeconds: 10

    # Metrics exporter
    metrics:
      enabled: true
      https: false
      service:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9205"
