---
# CNPG Cluster for Nextcloud — single instance on local-path NVMe
# Backups + WAL archiving to OMV MinIO S3 bucket 'cnpg-backups/nextcloud'
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  namespace: nextcloud
  # Barman serverName generation convention: see
  # docs/cnpg-backup-servername-generations.md. A rebuilt cluster archives into
  # a fresh "<name>-genN" namespace while recovering from the previous one, so
  # the cnpg.io/skipEmptyWalArchiveCheck annotation is no longer needed.
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16-minimal-trixie

  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "1GB"

  # Recovery bootstrap: if this cluster is ever recreated, restore the latest
  # available base backup from the barman ObjectStore and replay WAL.
  bootstrap:
    recovery:
      source: origin
      database: nextcloud
      owner: nextcloud
      secret:
        name: nextcloud-db-credentials

  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: nextcloud-db-backups
          # Previous generation (recovery source); bump to the prior genN on rebuild.
          serverName: nextcloud-db

  # Storage — local-path on homelab-2nd NVMe (fast, NOT durable)
  storage:
    storageClass: local-path
    size: 20Gi

  # Backup + WAL archiving to OMV MinIO S3 via the barman-cloud CNPG-I plugin.
  # The in-tree backup.barmanObjectStore API is deprecated in CNPG v1.30+ and
  # is mutually exclusive with the WAL archiver plugin.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nextcloud-db-backups
        # Current generation (archiver target); bump to "<name>-genN" (fresh) on rebuild.
        serverName: nextcloud-db

  backup:
    retentionPolicy: "30d"

  # Resource limits — reasonable for a homelab
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
