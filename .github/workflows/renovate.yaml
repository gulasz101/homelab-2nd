name: Renovate

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -n "$RENOVATE_TOKEN" ]; then
            echo "Using the RENOVATE_TOKEN repository secret."
          else
            echo "::warning::RENOVATE_TOKEN is not set, falling back to GITHUB_TOKEN."
            echo "::warning::GitHub Actions must be allowed to create pull requests: Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions to create and approve pull requests'. Without that setting (or a RENOVATE_TOKEN with pull_requests: write) Renovate cannot open the PR."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.10
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
